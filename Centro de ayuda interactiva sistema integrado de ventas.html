<head>
<!--
════════════════════════════════════════════════════════════════════════════════
  CENTRO DE AYUDA · Core-Business Suite — v1.1 (CORREGIDO)
════════════════════════════════════════════════════════════════════════════════
  ¿QUÉ PASÓ? La versión anterior se veía en blanco por 2 errores fatales de JS
  que mataban el script ANTES de pintar nada (por eso #nav y #article quedaban
  vacíos y solo se veía la barra superior):

  [FATAL 1] Colisión de nombres: existían DOS funciones llamadas `steps()`.
            Una pintaba listas numeradas de contenido y otra devolvía los pasos
            del simulador de flujos. La segunda sobrescribía a la primera y, al
            construir los artículos, intentaba leer `HELP.flow` cuando `HELP`
            aún no existía → TypeError → todo el script moría.
            FIX: renombrada a `flowSteps()`.

  [FATAL 2] Orden de declaración: el objeto `HELP` se declaraba DESPUÉS del
            bloque de contenidos, pero `checklist()` lo leía durante la
            construcción de los artículos → "Cannot read properties of
            undefined (reading 'checks')".
            FIX: `HELP`/`LS`/`toast` se declaran al inicio del script y
            `checklist()` además es defensivo.

  [ALTO 3]  `art(titulo, lead, meta, body, init)` recibía 6 argumentos en las
            páginas interactivas (`..., body, null, function(){...}`), así que
            `init` quedaba en null y NINGUNA vista interactiva se inicializaba
            (mapa, glosario, FAQ, diagrama, flujos, backlog, sprint, roadmap,
            API, modelo de datos, design system…).
            FIX: `art()` acepta argumentos variables y toma como `init` la
            última función que reciba.

  [ALTO 4]  `renderDataModel()` declaraba funciones dentro de una
            concatenación (`'...' + function boxE(){} + ...`), lo que metía el
            código fuente como texto y lanzaba ReferenceError.
            FIX: helpers declarados antes de concatenar.

  [MEDIO 5] `stats()` leía `s[0].v` pero los datos traían `t` → los KPIs de
            bienvenida mostraban 0. FIX: detecta valor numérico o texto.
  [MEDIO 6] El icono `phone` no existía en el set → "undefined" en el menú.
  [MEDIO 7] Faltaban los estilos `.spot` y `.tour-card` → el tour se veía roto.
  [MEDIO 8] `enhance()` re-bindeaba listeners en cada render (el botón “Marcar
            como leído” se autoneutralizaba). FIX: guardas `dataset.bound`.
  [BAJO 9]  Caracteres sueltos en chino ("携带", "候选") y un bug de precedencia
            en `renderRoadmap()`. Corregidos.
  [NUEVO]   Red de seguridad: si algo vuelve a fallar, la página muestra el
            error en pantalla en lugar de quedarse en blanco.

  ────────────────────────────────────────────────────────────────────────────
  ¿CÓMO FUNCIONA ESTA AYUDA? (guía rápida)
  • Menú izquierdo: 12 bloques temáticos (Empezar aquí, Producto, Arquitectura,
    Módulos, Flujos, Sistema terminado, Estado, Plan, Equipo, Guías técnicas,
    Diseño, Calidad/Seguridad). Los bloques se colapsan al hacer clic.
  • Buscador (Ctrl/⌘ + K o tecla "/"): busca en títulos y cuerpo de los 55
    artículos y devuelve el fragmento con la coincidencia resaltada.
  • Índice derecho: saltos dentro del artículo con seguimiento de scroll.
  • “Marcar como leído”: el anillo inferior izquierdo mide tu avance (se guarda
    en este navegador). Botón “Reiniciar” lo pone a cero.
  • Páginas interactivas: diagrama de arquitectura clicable, simulador de flujos
    con reproducción paso a paso y bus de eventos, backlog filtrable de 43
    tareas, tablero del sprint, roadmap, matriz de permisos, catálogo de
    eventos, API Reference filtrable, modelo de datos, glosario y FAQ.
  • Atajos: Ctrl/⌘+K buscar · / buscar · Esc cerrar · Alt+← / Alt+→ artículo
    anterior/siguiente · botón Imprimir = PDF del artículo actual.
  • Es una app 100% independiente de la tienda: no comparte código ni datos con
    el sistema de la ferretería. Se puede publicar en docs.tudominio.com.
════════════════════════════════════════════════════════════════════════════════
-->

.stat .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;margin-bottom:11px}
.stat .ic svg{width:18px;height:18px}
.acc{border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);margin-bottom:10px;overflow:hidden}
.acc>summary{padding:14px 16px;cursor:pointer;font-weight:600;font-size:14.2px;display:flex;gap:11px;align-items:center;list-style:none}
.acc>summary::-webkit-details-marker{display:none}

.acc>summary .cv{margin-left:auto;width:15px;height:15px;transition:transform .25s var(--ease);color:var(--muted-2)}

.acc[open]>summary .cv{transform:rotate(90deg)}
.acc[open]>summary{border-bottom:1px solid var(--border);background:var(--surface-2)}
.acc .ac-b{padding:14px 16px;font-size:13.8px;color:var(--muted)}
.acc .ac-b p{color:var(--muted)}
.srch-btn{display:flex;align-items:center;gap:9px;flex:1;max-width:430px;padding:8px 13px;border-radius:11px;border:1px solid var(--border);background:var(--surface-2);color:var(--muted);font-size:13.5px;transition:.2s}

.cmdk .in-w{position:relative;border-bottom:1px solid var(--border)}
.cmdk .in-w>svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted-2)}
.cmdk input{width:100%;padding:17px 18px 17px 46px;border:0;background:transparent;font-size:16px}
.cmdk input:focus{outline:none}
.cmdk-list{max-height:min(440px,60vh);overflow-y:auto;padding:8px}

.ck-i.sel{background:var(--accent-soft)}

.ck-i .gp{font-size:11.5px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.ck-i .sn{font-size:12.6px;color:var(--muted);margin-top:3px;line-height:1.5}
.ck-i mark{background:color-mix(in srgb,var(--warn) 45%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.scrim{position:fixed;inset:0;background:rgba(8,12,20,.55);backdrop-filter:blur(3px);z-index:200;opacity:0;animation:fd .22s forwards}
@keyframes fd{to{opacity:1}}
.modal{position:fixed;inset:0;z-index:210;display:grid;place-items:center;padding:20px;overflow-y:auto}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--sh-3);width:min(860px,100%);max-height:90vh;overflow:hidden;display:flex;flex-direction:column;animation:pop .28s var(--ease)}
.toasts{position:fixed;bottom:20px;right:20px;z-index:400;display:flex;flex-direction:column;gap:9px;max-width:360px}
.toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:13px;padding:12px 15px;box-shadow:var(--sh-3);display:flex;gap:11px;animation:tin .32s var(--ease)}
.toast.out{animation:tout .28s var(--ease) forwards}
@keyframes tin{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateX(36px)}}
.toast .ti{width:19px;height:19px;flex:none;margin-top:2px}
.toast .ti svg{width:19px;height:19px}
.toast b{display:block;font-size:13.5px}.toast span{font-size:12.4px;color:var(--muted)}

[data-theme="dark"] #tooltip{background:#e7edf7;color:#111827}
#tooltip.show{opacity:1;transform:none}
.spot{position:fixed;z-index:600;border-radius:14px;box-shadow:0 0 0 9999px rgba(6,12,20,.55);pointer-events:none;transition:all .38s var(--ease)}
.tour-card{position:fixed;z-index:601;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-3);padding:20px;width:min(340px,90vw)}
.tour-card h4{font-size:16px;margin-bottom:7px}.tour-card p{font-size:13.5px;color:var(--muted)}
.diagram{width:100%;height:auto;overflow:visible}
.diagram .nd{cursor:pointer}

.diagram .nd.sel rect{stroke-width:2.8}
.diagram .flow{stroke-dasharray:6 8;animation:dash 1.5s linear infinite}

.fp-s.past{opacity:.85}

.fp-s.on .n{background:var(--accent);color:#fff}
.fp-s b{font-size:14.4px}
.fp-s p{font-size:13.3px;color:var(--muted);margin:0}

.lane{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;border:1px solid var(--border);background:var(--surface-2);color:var(--muted)}
.kb{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}

.kb-c b{font-size:13.2px;display:block;line-height:1.4;margin-bottom:6px}
.tl-day{position:relative;padding-left:26px}
.tl-day::before{content:'';position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--border)}
.tl-i{position:relative;padding-bottom:20px}
.tl-i::before{content:'';position:absolute;left:-24px;top:5px;width:13px;height:13px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.tl-i .h{font-family:var(--font-mono);font-size:12px;color:var(--accent);font-weight:600}
.ftb{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:13px 15px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);margin-bottom:14px;position:sticky;top:0;z-index:5}
.inp{padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-size:13.3px}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sw-row{display:flex;gap:9px;flex-wrap:wrap}
.sw-c{width:70px;text-align:center}
.sw-c i{display:block;height:44px;border-radius:11px;border:1px solid var(--border);margin-bottom:5px}
.sw-c span{font-size:10px;color:var(--muted);font-family:var(--font-mono);display:block;line-height:1.4}
.type-sample{border:1px solid var(--border);border-radius:var(--r-md);padding:16px;background:var(--surface)}
.mob-only{display:none}
.fatal{max-width:760px;margin:40px auto;padding:28px;border:1px solid var(--danger);border-radius:var(--r-lg);background:var(--danger-soft)}
.fatal pre{font-family:var(--font-mono);font-size:12px;white-space:pre-wrap;margin-top:14px;color:var(--danger)}
@media(max-width:1180px){.doc-layout{grid-template-columns:minmax(0,1fr)}.doc-toc{display:none}}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:290px;transform:translateX(-102%);transition:transform .3s var(--ease);box-shadow:var(--sh-3)}
  body.nav-open .side{transform:none}
  .mob-only{display:grid}
  .doc-layout{padding:22px 17px 70px}
  .srch-btn{max-width:none}.srch-btn span.lbl,.srch-btn kbd{display:none}
}
@media print{
  body{overflow:visible}
  .shell{display:block;height:auto}
  .side,.top,.doc-toc,.pager,.fp-ctl,.ftb,.no-print{display:none!important}
  .scroll-area{overflow:visible}
  .doc-layout{display:block;padding:0;max-width:none}
  article{max-width:none}
  .card,.pre{break-inside:avoid}
}

   2. COMPONENTES DE CONTENIDO
   ════════════════════════════════════════════════════════════════════════════ */
var STATES={done:['p-ok','var(--ok)','Listo'],progress:['p-warn','var(--warn)','En curso'],todo:['p-mut','var(--muted-2)','Pendiente'],blocked:['p-bad','var(--danger)','Bloqueado'],critical:['p-bad','var(--danger)','Crítico'],info:['p-info','var(--info)','Info']};
function pill(st,txt){ var s=STATES[st]||STATES.todo; return '<span class="pill '+s[0]+'">'+esc(txt||s[2])+'</span>'; }
function dot(st){ var s=STATES[st]||STATES.todo; return '<span class="st" style="background:'+s[1]+'" title="'+s[2]+'"></span>'; }
function callout(type,title,body){
  var ic={info:IC.info,warn:IC.alert,bad:IC.alert,ok:IC.check,tip:IC.spark}[type]||IC.info;
  return '<div class="callout c-'+type+'"><span class="ci">'+ic+'</span><div><b>'+esc(title)+'</b><p>'+body+'</p></div></div>';
}
function tbl(headers,rows){
  return '<div class="tb-scroll"><table class="tb"><thead><tr>'+headers.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr></thead><tbody>'+
    rows.map(function(r){ return '<tr>'+r.map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>'; }).join('')+'</tbody></table></div>';
}
function code(title,body){
  return '<div class="pre"><div class="pre-h"><span class="d"></span><span class="d"></span><span class="d"></span>'+esc(title)+
    '<button type="button" data-copy aria-label="Copiar código">'+IC.copy+'copiar</button></div><pre data-code>'+body+'</pre></div>';
}
function steps(list){
  return '<div class="steps">'+list.map(function(s){ return '<div class="step"><b>'+s[0]+'</b><p>'+s[1]+'</p></div>'; }).join('')+'</div>';
}
function bar(pct,color,label){
  return '<div class="spread xs muted" style="margin-bottom:5px"><span>'+esc(label||'')+'</span><b>'+pct+'%</b></div><div class="bar"><i data-w="'+pct+'" style="background:'+(color||'var(--accent)')+'"></i></div>';
}
function stats(items){
  return '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(165px,1fr));margin:18px 0">'+items.map(function(s){
    var d=s[0], numeric=(d.v!=null && !isNaN(parseFloat(d.v)));
    var val=numeric?d.v:d.t;
    return '<div class="stat"><span class="ic" style="background:'+s[3]+';color:'+s[2]+'">'+IC[s[1]]+'</span>'+
      (numeric
        ? '<b data-count="'+val+'" data-dec="'+(d.d||0)+'" data-pre="'+(d.p||'')+'" data-suf="'+(d.s||'')+'">'+esc(d.t||'')+'</b>'
        : '<b>'+esc(d.t!=null?d.t:val)+'</b>')+
      '<span class="lbl">'+esc(d.l||'')+'</span></div>';
  }).join('')+'</div>';
}
function checklist(id,items){
  var all=(typeof HELP!=='undefined' && HELP.checks)?HELP.checks:{};
  var st=all[id]||{};
  return '<div class="card card-pad" data-cklist="'+id+'">'+items.map(function(t,i){
    var on=!!st[i];
    return '<label class="ck '+(on?'done':'')+'"><input type="checkbox" data-ck="'+id+'" data-i="'+i+'" '+(on?'checked':'')+'><span>'+t+'</span></label>';
  }).join('')+'</div>';
}
function moduleDoc(m){
  return '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin:18px 0">'+
    [['Propósito',m.purpose],['Pantallas clave',m.screens],['Entidades',m.entities],['Integra con',m.integrates]]
    .map(function(x){ return '<div class="card card-pad"><span class="pill p-acc" style="margin-bottom:9px">'+x[0]+'</span><p class="sm" style="margin:0">'+x[1]+'</p></div>'; }).join('')+'</div>'+
    '<h3>Eventos del módulo</h3>'+tbl(['Evento','Dirección','Payload / efecto'],m.events)+
    '<h3>Permisos por rol</h3>'+tbl(['Rol','Puede'],m.perms)+
    '<h3>Estado actual</h3>'+bar(m.status.pct,m.status.color,'Avance del módulo: '+m.status.label)+
    '<div class="grid" style="grid-template-columns:1fr 1fr;margin-top:16px">'+
      '<div class="card card-pad"><h4 style="margin-bottom:9px">Ya funciona en el prototipo</h4><ul class="sm" style="padding-left:19px">'+m.done.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul></div>'+
      '<div class="card card-pad"><h4 style="margin-bottom:9px">Falta para producción</h4><ul class="sm" style="padding-left:19px">'+m.todo.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul></div></div>'+
    (m.api?'<h3>Endpoints</h3>'+tbl(['Método','Ruta','Descripción','Scope'],m.api):'');
}
/* FIX v1.1: acepta argumentos variables; la última función recibida es el init */
function art(title,lead,meta,body){
  var init=null;
  for(var i=3;i<arguments.length;i++){ if(typeof arguments[i]==='function') init=arguments[i]; }
  return {title:title,lead:lead,meta:meta||[],body:body||'',init:init};
}

var ignoreHash=false;

  if(typeof path!=='string') path='/bienvenida';

}

function buildToc(){
  var hs=$$('#article h2, #article h3'), toc=$('#toc');
  if(tocObserver){ tocObserver.disconnect(); tocObserver=null; }
  if(hs.length<2){ toc.innerHTML=''; return; }
  hs.forEach(function(h,i){ h.id='h-'+i; });
  toc.innerHTML='<h5>En esta página</h5>'+hs.map(function(h){
    return '<a href="#'+h.id+'" data-toc="'+h.id+'" class="'+(h.tagName==='H3'?'lvl3':'')+'">'+esc(h.textContent)+'</a>';
  }).join('');
  tocObserver=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(en.isIntersecting){
        $$('#toc a').forEach(function(x){ x.classList.remove('on'); });
        var link=$('#toc a[data-toc="'+en.target.id+'"]'); if(link) link.classList.add('on');
      }
    });
  },{rootMargin:'-80px 0px -70% 0px',threshold:0});
  hs.forEach(function(h){ tocObserver.observe(h); });
}
function enhance(){
  requestAnimationFrame(function(){ $$('.bar>i').forEach(function(b){ b.style.width=b.getAttribute('data-w')+'%'; }); });
  $$('[data-count]').forEach(function(el){
    if(el.dataset.bound) return; el.dataset.bound='1';
    var to=parseFloat(el.getAttribute('data-count')); if(isNaN(to)) return;
    var dec=+(el.getAttribute('data-dec')||0), pre=el.getAttribute('data-pre')||'', suf=el.getAttribute('data-suf')||'', t0=performance.now();
    (function frame(t){ var k=clamp((t-t0)/900,0,1), e=1-Math.pow(1-k,3), v=to*e;
      el.textContent=pre+(dec?v.toFixed(dec):Math.round(v).toLocaleString('es-MX'))+suf;
      if(k<1) requestAnimationFrame(frame); })(t0);
  });
  $$('[data-copy]').forEach(function(b){
    if(b.dataset.bound) return; b.dataset.bound='1';
    b.addEventListener('click',function(){

      else{ var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
        try{ document.execCommand('copy'); toast('Código copiado.','ok','Copiado'); }catch(e){ toast('No se pudo copiar.','warn'); } ta.remove(); }
    });
  });
  $$('[data-ck]').forEach(function(cb){
    if(cb.dataset.bound) return; cb.dataset.bound='1';
    cb.addEventListener('change',function(){
      var listId=cb.getAttribute('data-ck'), i=cb.getAttribute('data-i');
      HELP.checks[listId]=HELP.checks[listId]||{};
      HELP.checks[listId][i]=cb.checked; LS.set('cbhelp-checks',HELP.checks);
      cb.closest('.ck').classList.toggle('done',cb.checked);
      var box=cb.closest('[data-cklist]');
      if(box){ var all=$$('[data-ck]',box), dn=all.filter(function(x){return x.checked;}).length;
        if(dn===all.length&&all.length) toast('Checklist completado al 100 %.','ok','¡Bien!'); }
    });
  });
  $$('[data-mark-read]').forEach(function(b){
    if(b.dataset.bound) return; b.dataset.bound='1';
    b.addEventListener('click',function(){
      var id=b.getAttribute('data-mark-read'), i=HELP.read.indexOf(id);
      if(i>=0) HELP.read.splice(i,1); else HELP.read.push(id);
      LS.set('cbhelp-read',HELP.read); render();
    });
  });
  $$('[data-toggle-grp]').forEach(function(b){
    if(b.dataset.bound) return; b.dataset.bound='1';
    b.addEventListener('click',function(){
      var g=b.getAttribute('data-toggle-grp'), box=b.closest('.grp');
      box.classList.toggle('closed'); LS.set('cbhelp-grp-'+g,box.classList.contains('closed'));
    });
  });
  $$('[data-nav]').forEach(function(a){
    if(a.dataset.bound) return; a.dataset.bound='1';
    a.addEventListener('click',function(e){ e.preventDefault(); document.body.classList.remove('nav-open'); go('/'+a.getAttribute('data-nav')); });
  });
  $$('#toc a').forEach(function(a){
    if(a.dataset.bound) return; a.dataset.bound='1';
    a.addEventListener('click',function(e){ e.preventDefault();
      var el=document.getElementById(a.getAttribute('data-toc'));
      if(el){ var sc=$('#scroll'); sc.scrollTo({top:el.offsetTop-90,behavior:'smooth'}); } });
  });
}

var SEARCH_INDEX=null;
function buildIndex(){
  if(SEARCH_INDEX) return SEARCH_INDEX;
  SEARCH_INDEX=INDEX.map(function(it){
    var div=document.createElement('div'); div.innerHTML=it.art.body;
    var text=(div.textContent||'').replace(/\s+/g,' ').trim();
    return {id:it.id,title:it.art.title,lead:(it.art.lead||'').replace(/<[^>]+>/g,''),group:it.group,icon:it.icon,
      text:text.toLowerCase(),heads:$$('h2,h3',div).map(function(h){return h.textContent.trim();})};
  });
  return SEARCH_INDEX;
}
function searchDocs(q){
  var idx=buildIndex(); q=String(q||'').trim().toLowerCase();
  if(q.length<2) return [];
  var terms=q.split(/\s+/);
  return idx.map(function(d){
    var score=0,pos=-1;
    terms.forEach(function(t){
      if(d.title.toLowerCase().indexOf(t)>=0) score+=60;
      if(d.lead.toLowerCase().indexOf(t)>=0) score+=18;
      if(d.heads.some(function(h){return h.toLowerCase().indexOf(t)>=0;})) score+=22;
      var p=d.text.indexOf(t);
      if(p>=0){ score+=10+Math.max(0,10-Math.floor(p/400)); if(pos<0) pos=p; }
    });
    if(score<=0) return null;
    var snippet;
    if(pos>=0){ var s=Math.max(0,pos-70); snippet=(s>0?'…':'')+d.text.substr(s,190)+'…'; }
    else snippet=d.lead.slice(0,170)+'…';
    terms.forEach(function(t){ if(t.length>1){ var re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'); snippet=snippet.replace(re,'<mark>$1</mark>'); } });
    return {d:d,score:score,snippet:snippet};
  }).filter(Boolean).sort(function(a,b){return b.score-a.score;}).slice(0,22);
}
function openSearch(){
  var sel=0, results=INDEX.slice(0,10).map(function(it){return {id:it.id,d:it};}), q='';
  var ov=document.createElement('div');
  ov.innerHTML='<div class="scrim" data-close></div><div class="modal" data-close-wrap><div class="cmdk" role="dialog" aria-modal="true">'+
    '<div class="in-w">'+IC.search+'<input id="s-in" placeholder="Buscar en la documentación: módulos, flujos, API, backlog…" aria-label="Buscar"></div>'+
    '<div class="cmdk-list" id="s-list"></div>'+
    '<div class="spread xs muted" style="padding:11px 16px;border-top:1px solid var(--border)"><span class="row" style="gap:8px"><kbd>↑</kbd><kbd>↓</kbd> navegar · <kbd>Enter</kbd> abrir · <kbd>Esc</kbd> cerrar</span><span>'+INDEX.length+' artículos indexados</span></div></div></div>';
  document.body.appendChild(ov);
  var input=$('#s-in',ov), list=$('#s-list',ov);
  function close(){ if(ov.parentNode) ov.parentNode.removeChild(ov); }
  function paint(){
    if(!q){
      results=INDEX.slice(0,10).map(function(it){ return {id:it.id,d:it,snippet:it.art.lead.replace(/<[^>]+>/g,'').slice(0,150)+'…'}; });
    } else { results=searchDocs(q).map(function(r){ return {id:r.d.id,d:r.d,snippet:r.snippet}; }); }
    list.innerHTML=results.length?results.map(function(r,i){
      return '<div class="ck-i '+(i===sel?'sel':'')+'" data-i="'+i+'"><span class="ic">'+(IC[r.d.icon]||IC.book)+'</span>'+
        '<div style="min-width:0"><span class="gp">'+esc(r.d.group)+'</span><b>'+esc(r.d.title)+'</b><div class="sn">'+r.snippet+'</div></div></div>'; }).join('')
      :'<div style="padding:30px;text-align:center;color:var(--muted)"><b>Sin resultados para “'+esc(q)+'”</b><p class="sm">Prueba con “facturación”, “eventos”, “backlog”, “PAC”, “JWT” o “POS”.</p></div>';
    $$('.ck-i',list).forEach(function(el){
      el.onclick=function(){ var r=results[+el.getAttribute('data-i')]; close(); if(r) go('/'+r.id); };
      el.onmouseenter=function(){ sel=+el.getAttribute('data-i'); $$('.ck-i',list).forEach(function(x){x.classList.remove('sel');}); el.classList.add('sel'); };
    });
  }
  function scrollSel(){ var el=$('.ck-i.sel',list); if(el) el.scrollIntoView({block:'nearest'}); }
  ov.addEventListener('click',function(e){ if(e.target.hasAttribute('data-close')||e.target.hasAttribute('data-close-wrap')) close(); });
  input.addEventListener('input',function(){ q=input.value; sel=0; paint(); });
  input.addEventListener('keydown',function(e){
    if(e.key==='ArrowDown'){ e.preventDefault(); sel=Math.min(results.length-1,sel+1); paint(); scrollSel(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); sel=Math.max(0,sel-1); paint(); scrollSel(); }
    else if(e.key==='Enter'){ e.preventDefault(); var r=results[sel]; close(); if(r) go('/'+r.id); }
    else if(e.key==='Escape'){ close(); }
  });
  paint(); setTimeout(function(){ input.focus(); },50);
}

 ['Backlog','Lista priorizada de lo que falta por hacer. En este proyecto usa prioridades P0, P1 y P2.'],
 ['Blue-green','Despliegue con dos ambientes idénticos: se publica en el verde, se valida y el proxy mueve el tráfico. Rollback en segundos.'],
 ['BullMQ','Librería de colas sobre Redis. Ejecuta tareas pesadas fuera de la petición HTTP (emails, timbrado, reportes).'],
 ['CFDI','Comprobante Fiscal Digital por Internet: la factura electrónica mexicana. Versión vigente 4.0.'],
 ['Complemento de pago','CFDI que ampara un pago recibido cuando la factura original fue a crédito (PPD).'],
 ['Corte de caja','Cierre de un turno: fondo inicial + ventas − retiros = efectivo esperado.'],
 ['CSP','Content Security Policy. Cabecera HTTP que restringe qué recursos puede cargar la página; principal defensa contra XSS.'],
 ['Definition of Done','Lista de condiciones que debe cumplir una tarea para considerarse terminada.'],
 ['DLQ','Dead Letter Queue. Cola donde terminan los eventos que fallaron tras todos los reintentos, para revisión manual.'],
 ['Docker Compose','Herramienta que levanta varios contenedores definidos en un YAML. Suficiente para las primeras fases.'],
 ['ERD','Entity Relationship Diagram: diagrama de entidades y sus relaciones.'],
 ['Feature flag','Interruptor que activa o desactiva una función sin desplegar código. Permite liberar por tenant o por porcentaje.'],
 ['Idempotencia','Propiedad de una operación que produce el mismo resultado aunque se ejecute varias veces. Clave en pagos y eventos.'],
 ['INP','Interaction to Next Paint: métrica de capacidad de respuesta ante interacciones. Objetivo &lt; 200 ms.'],
 ['ISR','Incremental Static Regeneration de Next.js: páginas estáticas que se regeneran en segundo plano tras un TTL.'],
 ['JWT','JSON Web Token: token firmado que lleva la identidad y los permisos del usuario durante la petición.'],
 ['Kárdex','Historial cronológico de entradas y salidas de un producto, con saldos después de cada movimiento.'],
 ['LCP','Largest Contentful Paint: cuándo se pinta el elemento más grande de la página. Objetivo &lt; 1.5 s.'],

 ['MFA','Multi-Factor Authentication: segundo factor (app autentificadora) además de la contraseña.'],
 ['Monolito modular','Una sola aplicación desplegable, dividida internamente en módulos con fronteras estrictas.'],
 ['Outbox','Patrón que guarda los eventos en la misma transacción que el cambio de datos y los publica después, de forma fiable.'],
 ['Overselling','Vender más unidades de las que hay en stock. Se evita con reserva atómica y transacciones.'],
 ['P0 / P1 / P2','Prioridades del backlog: P0 bloquea la operación, P1 bloquea la venta, P2 es mejora.'],
 ['PAC','Proveedor Autorizado de Certificación: empresa que timbra los CFDI ante el SAT.'],
 ['PITR','Point-In-Time Recovery: restaurar la base de datos a un instante concreto usando archivos WAL.'],
 ['Punto de reorden','Existencia que dispara la alerta de reabasto: consumo diario × lead time del proveedor + stock de seguridad.'],
 ['PWA','Progressive Web App: sitio instalable con ícono, offline básico y notificaciones push.'],
 ['RACI','Matriz que indica quién es Responsable, Aprobador, Consultado e Informado en cada actividad.'],
 ['RBAC','Role-Based Access Control: permisos asignados por rol, no por usuario individual.'],
 ['Read-model','Tabla o vista precalculada para reportes, alimentada por eventos. Evita consultas pesadas en vivo.'],
 ['Refresh token','Token de larga vida para obtener un access token nuevo sin pedir contraseña. Debe ser rotativo.'],
 ['RLS','Row-Level Security de PostgreSQL: políticas que filtran filas por tenant dentro del motor.'],
 ['Sandbox','Ambiente de pruebas de un proveedor externo donde nada tiene efectos reales (ni cobros ni timbrados).'],

var FAQS=[
 ['¿El prototipo que ya existe funciona de verdad?','Sí, pero solo en el navegador. Toda la lógica (carrito, validaciones, POS, descuentos, stock, exportaciones CSV e impresión) se ejecuta en JavaScript con datos en memoria. No hay servidor ni base de datos: al recargar, los datos vuelven a su estado inicial. Es una maqueta de altísima fidelidad que sirve para validar la experiencia y como especificación ejecutable.'],
 ['¿Puedo cobrarle ya a un cliente real con esto?','No. Faltan backend persistente, pagos reales, timbrado con PAC, autenticación real, backups y hosting. Por eso existen el backlog P0 y el Sprint 1.'],
 ['¿Por qué un monolito modular y no microservicios?','Porque el equipo y el volumen iniciales no justifican operar 15 servicios. El monolito modular mantiene fronteras claras (contratos, tablas con prefijo y eventos) para que un módulo pueda extraerse después sin reescribirlo.'],
 ['¿Qué pasa si el PAC de facturación se cae?','La venta no se detiene. La factura entra en una cola con reintentos y se timbra cuando el servicio regresa; el panel muestra el estado “pendiente” y alerta al equipo.'],
 ['¿Cómo evitamos vender lo que no hay?','Con reserva atómica de stock: al iniciar el checkout se apartan las piezas con TTL de 20 minutos dentro de una transacción. Hay una prueba de concurrencia obligatoria en cada release.'],
 ['¿Sirve para varios negocios a la vez?','Sí. El modelo multi-tenant con <span class="mono">tenant_id</span> y Row-Level Security está diseñado desde el inicio, aunque la primera instalación sea de un solo negocio.'],
 ['¿Cuánto tarda estar operativo con el primer cliente real?','Con 3 desarrolladores de tiempo completo: unas 12 semanas (6 sprints) para el piloto y 6 meses para un producto comercial estable con facturación, pagos y CRM completos.'],
 ['¿Qué necesita el cliente para arrancar?','Dominio, datos fiscales (RFC, régimen y CSD), catálogo inicial (CSV o captura asistida), cuenta en la pasarela de pagos y contrato con el PAC. El onboarding guiado dura menos de 45 minutos con el inventario cargado.'],
 ['¿Por qué la tienda es la página principal y no el login?','Porque el negocio existe para vender. Storefront First obliga a que los datos del back-office sean correctos (el cliente los ve), aporta valor desde el día 1 y mejora el SEO. El panel es una puerta lateral para el equipo.'],
 ['¿Se puede usar sin internet en el mostrador?','En la versión final sí, para el POS: modo offline con cola local y sincronización al recuperar conexión (fase 3). El prototipo actual funciona 100 % local porque no hay servidor.'],
 ['¿Cómo se cobra el producto?','Suscripción mensual por plan (Base, Operación, Crecimiento, Enterprise) más módulos premium por separado. La base es barata a propósito: el crecimiento viene de los plugins.'],
 ['¿Qué pasa con los datos si el cliente se da de baja?','Se exportan en CSV/SQL junto con los XML de facturas y se eliminan de los servidores en 30 días, salvo obligación legal (los CFDI se conservan 5 años).'],
 ['¿Esta ayuda se le puede mostrar al cliente final?','Sí. Está pensada para dos audiencias: el equipo de desarrollo (arquitectura, API, backlog) y el usuario final (módulos, flujos, un día en la ferretería). Se puede publicar tal cual o recortar los bloques técnicos.']

var flowTimer=null;
function flowSteps(){ return FLOWS[HELP.flow].steps; }
function initFlowPlayer(){
  var sel=$('#flow-sel'); if(!sel) return;
  sel.innerHTML=Object.keys(FLOWS).map(function(k){ return '<option value="'+k+'" '+(HELP.flow===k?'selected':'')+'>'+FLOWS[k].name+'</option>'; }).join('');
  sel.addEventListener('change',function(){ HELP.flow=sel.value; HELP.flowStep=0; stopFlow(); paintFlow(); });
  $('#fp-play').addEventListener('click',function(){ if(HELP.flowPlaying) stopFlow(); else playFlow(); });
  $('#fp-prev').addEventListener('click',function(){ stopFlow(); HELP.flowStep=Math.max(0,HELP.flowStep-1); paintFlow(); });
  $('#fp-next').addEventListener('click',function(){ stopFlow(); HELP.flowStep=Math.min(flowSteps().length-1,HELP.flowStep+1); paintFlow(); });
  $('#fp-reset').addEventListener('click',function(){ stopFlow(); HELP.flowStep=0; paintFlow(); });
  HELP.flowStep=0; paintFlow();
}
function stopFlow(){
  HELP.flowPlaying=false;
  if(flowTimer){ clearInterval(flowTimer); flowTimer=null; }
  var b=$('#fp-play'); if(b) b.innerHTML=IC.play+' Reproducir';
}
function playFlow(){
  var b=$('#fp-play'); if(b) b.innerHTML=IC.pause+' Pausa';
  HELP.flowPlaying=true;
  if(HELP.flowStep>=flowSteps().length) HELP.flowStep=0;
  paintFlow();
  flowTimer=setInterval(function(){
    if(HELP.flowStep>=flowSteps().length-1){ stopFlow(); return; }
    HELP.flowStep++; paintFlow();
  },2200);
}
function paintFlow(){
  var box=$('#fp-steps'); if(!box) return;
  var st=flowSteps(), f=FLOWS[HELP.flow], cur=HELP.flowStep;
  var cnt=$('#flow-count');
  if(cnt) cnt.textContent=st.length+' pasos · '+(cur>=st.length-1?'completado':'paso '+(cur+1)+' de '+st.length);
  var barEl=$('#fp-bar'); if(barEl) barEl.style.width=(clamp(cur/Math.max(1,st.length-1),0,1)*100)+'%';
  var html='<p class="sm muted" style="margin-bottom:10px">'+f.desc+'</p>';
  html+=st.map(function(s,i){
    var cls=i<cur?'past':(i===cur?'on':'');
    return '<div class="fp-s '+cls+'" data-step="'+i+'"><div class="h"><span class="n">'+(i+1)+'</span>'+
      '<span class="lane" style="border-color:'+s.lane+';color:'+s.lane+'">'+esc(s.actor)+'</span>'+
      '<b>'+s.title+'</b>'+(i===cur?'<span class="pill p-acc" style="margin-left:auto">ahora</span>':'')+'</div>'+
      '<p>'+s.detail+'</p>'+
      '<div class="wrap-row" style="margin-top:9px"><span class="pill p-mut">'+IC.eye+' '+esc(s.screen)+'</span><span class="pill p-info">'+IC.box+' '+esc(s.mod)+'</span>'+
      s.events.map(function(e){ return '<span class="fp-ev">'+e+'</span>'; }).join('')+'</div></div>';
  }).join('');
  box.innerHTML=html;
  var log=$('#fp-log'), logHtml='';
  st.slice(0,cur+1).forEach(function(s,i){
    s.events.forEach(function(e){ logHtml+='<div><span class="t">'+String(i+1).padStart(2,'0')+'.</span> <span class="e">'+e+'</span> <span class="m">→ '+esc(s.mod)+'</span></div>'; });
  });
  log.innerHTML=logHtml||'<div><span class="t">—</span> pulsa <b>Reproducir</b> para ver los eventos del bus</div>';
  log.scrollTop=log.scrollHeight;
  $$('.fp-s',box).forEach(function(el){
    el.onclick=function(){ stopFlow(); HELP.flowStep=+el.getAttribute('data-step'); paintFlow(); };
  });
  var on=$('.fp-s.on',box); if(on) on.scrollIntoView({block:'nearest',behavior:'smooth'});
}

 {s:'#nav',t:'Menú por bloques',d:'12 bloques temáticos con el estado de cada artículo. Los grupos se colapsan al hacer clic en su título.'},
 {s:'#btn-search',t:'Búsqueda global',d:'Ctrl K busca en títulos, subtítulos y cuerpo de los 55 artículos, con el fragmento resaltado.'},

 {s:'#btn-theme',t:'Tema e impresión',d:'Claro u oscuro, y botón Imprimir para guardar el artículo actual en PDF.'}
];
var tourI=0;
function startTour(){ tourI=0; drawTourStep(); }
function drawTourStep(){
  endTour();
  var s=TOURS[tourI]; if(!s) return;
  var t=$(s.s); if(!t){ tourI++; if(tourI<TOURS.length) drawTourStep(); return; }
  var r=t.getBoundingClientRect();
  var spot=document.createElement('div'); spot.className='spot';
  spot.style.cssText='left:'+(r.left-6)+'px;top:'+(r.top-6)+'px;width:'+(r.width+12)+'px;height:'+(r.height+12)+'px';
  var card=document.createElement('div'); card.className='tour-card';
  card.innerHTML='<span class="pill p-acc" style="margin-bottom:9px">Paso '+(tourI+1)+' de '+TOURS.length+'</span><h4 style="font-size:16px;margin-bottom:6px">'+s.t+'</h4><p class="sm muted">'+s.d+'</p>'+
    '<div class="row" style="margin-top:14px;gap:8px"><button class="btn btn-sm btn-ghost" type="button" data-t="skip">Omitir</button><div style="flex:1"></div>'+
    '<button class="btn btn-sm btn-primary" type="button" data-t="next">'+(tourI===TOURS.length-1?'Terminar':'Siguiente')+'</button></div>';
  document.body.appendChild(spot); document.body.appendChild(card);
  var below=r.bottom+210<innerHeight;
  card.style.left=clamp(r.left,14,Math.max(14,innerWidth-360))+'px';
  card.style.top=(below?r.bottom+14:Math.max(14,r.top-card.offsetHeight-14))+'px';
  card.onclick=function(e){
    var b=e.target.closest?e.target.closest('[data-t]'):null; if(!b) return;
    if(b.getAttribute('data-t')==='skip'){ endTour(); return; }
    tourI++;
    if(tourI>=TOURS.length){ endTour(); toast('Tour terminado. Todo lo demás está en el menú lateral.','ok','Guía'); }
    else drawTourStep();
  };
}
function endTour(){ $$('.spot,.tour-card').forEach(function(n){ if(n.parentNode) n.parentNode.removeChild(n); }); }

});
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openSearch(); return; }
  if(e.key==='Escape'){ endTour(); var m=$('.modal'); if(m&&m.parentNode) m.parentNode.removeChild(m); var sc=$('.scrim'); if(sc&&sc.parentNode) sc.parentNode.removeChild(sc); return; }
  var tag=document.activeElement?document.activeElement.tagName:'';
  if(e.key==='/'&&!/input|textarea|select/i.test(tag)){ e.preventDefault(); openSearch(); return; }
  if(e.altKey&&e.key==='ArrowRight'){ var i=posOf(HELP.path.replace(/^\//,'')); if(i>=0&&i<INDEX.length-1) go('/'+INDEX[i+1].id); }
  if(e.altKey&&e.key==='ArrowLeft'){ var j=posOf(HELP.path.replace(/^\//,'')); if(j>0) go('/'+INDEX[j-1].id); }
});
window.addEventListener('error',function(ev){
  var a=$('#article');
  if(a && !a.innerHTML.trim()){
    a.innerHTML='<div class="fatal"><h1 style="font-size:22px;margin-bottom:8px">La ayuda no pudo iniciar</h1>'+
      '<p class="sm">Se capturó un error al construir la documentación. Detalle técnico:</p><pre>'+esc((ev.message||'Error')+'\n'+(ev.filename||'')+':'+(ev.lineno||''))+'</pre></div>';
  } else { toast((ev.message||'Error').toString().slice(0,100),'err','Error capturado'); }
});

/* ════════════════════════════════════════════════════════════════════════════
   11. ARRANQUE
   ════════════════════════════════════════════════════════════════════════════ */
(function boot(){
  try{
    paintChrome();
    render();
  }catch(err){
    var a=$('#article');
    if(a) a.innerHTML='<div class="fatal"><h1 style="font-size:22px;margin-bottom:8px">La ayuda no pudo iniciar</h1>'+
      '<p class="sm">Detalle técnico del fallo (red de seguridad v1.1):</p><pre>'+esc(err&&err.stack?err.stack:String(err))+'</pre></div>';
    if(window.console) console.error(err);
  }
})();
</script>
</body>
</html>
