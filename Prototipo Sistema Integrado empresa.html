<!--
════════════════════════════════════════════════════════════════════════════
  CORE-BUSINESS SUITE · v1.1 (build corregido)
════════════════════════════════════════════════════════════════════════════
  CHANGELOG v1.1 — bugs reportados y corregidos:

  [CRÍTICO] Login no permitía entrar con los 3 roles.
     Causa raíz 1: la navegación dependía 100% de `location.hash`. En entornos
                   sandbox/iframe o con permisos restringidos, asignar el hash
                   lanza SecurityError y la app quedaba "congelada" en /login.
     Causa raíz 2: el botón "Entrar" solo funcionaba por `submit` nativo del
                   form; si el handler no llegaba a bindearse, no pasaba nada.
     Causa raíz 3: al entrar se lanzaba un TOUR automático con un foco oscuro
                   (box-shadow 9999px) que cubría todo el panel → se percibía
                   como "no me dejó entrar".
     Fix: router interno con estado (go()) + try/catch sobre el hash,
          botones de acceso rápido por rol (1 clic, sin contraseña),
          handler de click Y submit, tour solo manual.

  [CRÍTICO] Módulo "API & DevOps" no renderizaba (pantalla en skeleton).
     Causa: `Views.devops = () => `...`,` terminaba en COMA en vez de punto y
            coma, por lo que `function containerRow(){}` siguiente se parseaba
            como *expresión* de función y nunca quedaba definida en el scope
            → ReferenceError al pintar la tabla de contenedores.
     Fix: todas las sentencias terminadas en `;` + funciones declaradas aparte.

  [ALTO] handleAction() reventaba al llamarse sin elemento (paleta Ctrl+K).
     Fix: `const D = (el && el.dataset) || {}`.

  [ALTO] "Descargar PDF" de una factura abría otro modal en vez de imprimir.
     Fix: print-invoice → imprime de verdad (iframe); view-invoice → modal.

  [MEDIO] KPI "Uptime 99.98%" se mostraba como "100".
     Fix: kpi() recibe decimales y prefijo explícitos.

  [QA] Añadido Error Boundary por módulo + window.onerror con toast visible:
       ningún módulo puede volver a quedarse colgado en silencio.
       Añadido badge de stock bajo en el menú Inventario.
════════════════════════════════════════════════════════════════════════════
-->

.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:14px}

.p-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:20px}

.p-body{padding:15px 16px 17px;display:flex;flex-direction:column;gap:8px;flex:1}

.p-buy{display:flex;gap:8px;margin-top:6px}.p-buy .btn{flex:1}

.banner{background:linear-gradient(120deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#0b1120));border-radius:var(--r-xl);padding:44px;color:#fff;display:grid;grid-template-columns:1.2fr .8fr;gap:32px;align-items:center;position:relative;overflow:hidden}

.coupon{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.16);border:1px dashed rgba(255,255,255,.6);padding:11px 16px;border-radius:12px;font-family:var(--font-mono);font-weight:600;margin-top:18px}

.foot{background:var(--surface);border-top:1px solid var(--border);margin-top:40px}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:var(--surface);z-index:210;display:flex;flex-direction:column;box-shadow:var(--sh-3);transform:translateX(100%);animation:slideIn .34s var(--ease) forwards}

@keyframes slideInL{to{transform:none}}
.dr-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.dr-body{flex:1;overflow-y:auto;padding:18px 20px}
.dr-foot{padding:18px 20px;border-top:1px solid var(--border);background:var(--surface-2)}
.modal{position:fixed;inset:0;z-index:220;display:grid;place-items:center;padding:20px;overflow-y:auto}
.modal-box{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--sh-3);width:min(720px,100%);max-height:92vh;overflow:hidden;display:flex;flex-direction:column;animation:pop .3s var(--ease);border:1px solid var(--border)}
.modal-box.wide{width:min(1000px,100%)}.modal-box.narrow{width:min(480px,100%)}

.toasts{position:fixed;bottom:22px;right:22px;z-index:400;display:flex;flex-direction:column;gap:10px;max-width:370px}
.toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:14px;padding:13px 16px;box-shadow:var(--sh-3);display:flex;gap:12px;align-items:flex-start;animation:toastIn .35s var(--ease)}

@keyframes toastOut{to{opacity:0;transform:translateX(40px) scale(.96)}}
.toast.ok{border-left-color:var(--ok)}.toast.err{border-left-color:var(--danger)}.toast.warn{border-left-color:var(--warn)}
.toast .ic{width:22px;height:22px;flex:none;margin-top:1px}.toast .ic svg{width:22px;height:22px}

#print-frame{position:fixed;width:0;height:0;border:0;opacity:0;pointer-events:none}
.ci{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid var(--border);animation:fadeUp .3s var(--ease)}

.steps{display:flex;gap:8px;margin-bottom:22px}

.feat-list{margin-top:30px;display:flex;flex-direction:column;gap:15px}

.login-form{display:flex;align-items:center;justify-content:center;padding:44px 30px;background:var(--bg);overflow-y:auto}
.lf-box{width:min(430px,100%)}

.main{min-width:0;display:flex;flex-direction:column}

.icon-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--muted);border:1px solid transparent;transition:.2s;position:relative;flex:none}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 20px;position:relative;overflow:hidden;transition:.25s var(--ease)}

.pos-tile .st{font-size:11px;color:var(--muted-2)}
.pos-ticket{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);position:sticky;top:calc(var(--topbar) + 20px);overflow:hidden}
.pt-body{max-height:min(46vh,420px);overflow-y:auto;padding:8px 16px}
.pt-empty{text-align:center;padding:44px 20px;color:var(--muted)}
.pt-empty svg{width:46px;height:46px;margin:0 auto 12px;color:var(--border-strong)}
.pay-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pay-btn{padding:11px 6px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--muted);transition:.2s;display:flex;flex-direction:column;gap:5px;align-items:center}
.pay-btn svg{width:19px;height:19px}
.pay-btn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
[data-theme="dark"] .pay-btn.on{color:var(--accent-2)}
.tl{position:relative;padding-left:30px}
.tl::before{content:'';position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tl-item{position:relative;padding-bottom:26px}
.tl-item::before{content:'';position:absolute;left:-26px;top:4px;width:16px;height:16px;border-radius:50%;background:var(--surface);border:3px solid var(--border-strong)}
.tl-item.done::before{background:var(--ok);border-color:var(--ok)}
.tl-item.now::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.task{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13.5px;cursor:pointer}
.task input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.task.done span{text-decoration:line-through;color:var(--muted-2)}
.plug-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:16px}
.plug{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:12px;transition:.25s var(--ease)}
.plug:hover{transform:translateY(-3px);box-shadow:var(--sh-2)}
.plug .pi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none}.plug .pi svg{width:23px;height:23px}
.pipe{display:flex;align-items:stretch;overflow-x:auto;padding-bottom:6px}
.stage{flex:1;min-width:140px;background:var(--surface-2);border:1px solid var(--border);padding:13px 15px}
.stage:first-child{border-radius:14px 0 0 14px}.stage:last-child{border-radius:0 14px 14px 0}
.stage+.stage{border-left:0}
.stage .st-t{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.stage .st-s{font-size:11.5px;color:var(--muted);margin-top:3px}
.stage.run{border-color:var(--accent);background:var(--accent-soft)}
.stage.ok{border-color:var(--ok)}
.term{background:#070c12;color:#c9d6e3;border-radius:14px;padding:16px;font-family:var(--font-mono);font-size:12.3px;line-height:1.75;max-height:260px;overflow-y:auto;border:1px solid #1b2836}
.term .ok{color:#4ade80}.term .dim{color:#5b7186}.term .warn{color:#fbbf24}.term .acc{color:#2dd4bf}
.gauge{position:relative;width:170px;height:170px;margin:0 auto}
.gauge svg{transform:rotate(-90deg)}
.gauge .gv{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.gauge .gv b{font-family:var(--font-display);font-size:38px;display:block;line-height:1}
.matrix td,.matrix th{text-align:center}.matrix td:first-child,.matrix th:first-child{text-align:left}
.matrix input{width:16px;height:16px;accent-color:var(--accent)}
.cmdk{width:min(620px,100%);background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-3);border:1px solid var(--border);overflow:hidden;animation:pop .25s var(--ease)}
.cmdk .search-wrap svg{width:18px;height:18px}
.cmdk input{width:100%;padding:17px 20px 17px 42px;border:0;border-bottom:1px solid var(--border);background:transparent;font-size:16px}
.cmdk input:focus{outline:none}
.cmdk-list{max-height:370px;overflow-y:auto;padding:8px}
.cmdk-item{display:flex;align-items:center;gap:12px;padding:10px 13px;border-radius:11px;cursor:pointer;font-size:14px}
.cmdk-item svg{width:17px;height:17px;color:var(--muted);flex:none}
.cmdk-item.sel{background:var(--accent-soft)}
.spot{position:fixed;z-index:600;border-radius:14px;box-shadow:0 0 0 9999px rgba(6,12,20,.55);pointer-events:none;transition:all .38s var(--ease)}
.tour-card{position:fixed;z-index:601;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-3);padding:20px;width:min(340px,90vw)}
.tour-card h4{font-size:16px;margin-bottom:7px}.tour-card p{font-size:13.5px;color:var(--muted)}
.arch{width:100%;height:auto;overflow:visible}
.arch .flow{stroke-dasharray:6 8;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-28}}
.empty{text-align:center;padding:56px 24px;color:var(--muted)}
.empty>svg{width:52px;height:52px;margin:0 auto 14px;color:var(--border-strong)}
.empty b{display:block;font-size:17px;color:var(--text);margin-bottom:6px;font-family:var(--font-display)}
.locked-panel{text-align:center;padding:70px 24px}
.locked-panel .ic{width:64px;height:64px;border-radius:20px;background:var(--warn-soft);color:var(--warn);display:grid;place-items:center;margin:0 auto 18px}
.locked-panel .ic svg{width:30px;height:30px}
.err-panel{text-align:center;padding:56px 24px}
.err-panel .ic{width:64px;height:64px;border-radius:20px;background:var(--danger-soft);color:var(--danger);display:grid;place-items:center;margin:0 auto 18px}
.err-panel .ic svg{width:30px;height:30px}
.err-panel pre{text-align:left;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px;font-family:var(--font-mono);font-size:12px;overflow-x:auto;margin-top:16px;color:var(--danger)}
.mob-only{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
/* ══════════════════════════════════════════════════════════════════════════
   SISTEMA RESPONSIVO TOTAL (Laptops, Tablets, Móviles y Resoluciones Escaladas)
   ══════════════════════════════════════════════════════════════════════════ */

/* 1. Protección Universal contra Desbordamientos (Blowout Protection) */
.admin, .main, .page, .card, .grid, .row, .wrap-row, .spread {
  min-width: 0;
}
.grid > *, .row > *, .wrap-row > *, .spread > * {
  min-width: 0;
}
img, canvas {
  max-width: 100%;
}

/* 1.1 Blindaje Universal de Iconos SVG (Prevención de iconos gigantes en móvil) */
svg[viewBox="0 0 24 24"] {
  width: 1.15em !important;
  height: 1.15em !important;
  max-width: 1.15em !important;
  max-height: 1.15em !important;
  display: inline-block !important;
  vertical-align: -0.16em !important;
  flex-shrink: 0 !important;
}

/* Botones, Enlaces, Tabs y Pestañas */
.btn svg, button svg, .tab-btn svg, .tabs button svg, .nlink svg, a svg {
  width: 17px !important;
  height: 17px !important;
  max-width: 17px !important;
  max-height: 17px !important;
  display: inline-block !important;
  vertical-align: -0.16em !important;
  flex-shrink: 0 !important;
}

/* Iconos de botones cuadrados / redondos */
.icon-btn svg {
  width: 19px !important;
  height: 19px !important;
  max-width: 19px !important;
  max-height: 19px !important;
  display: inline-block !important;
  vertical-align: middle !important;
  flex-shrink: 0 !important;
}

/* Iconos de tarjetas KPI y métricas */
.kpi .ic svg {
  width: 19px !important;
  height: 19px !important;
  max-width: 19px !important;
  max-height: 19px !important;
}

/* Iconos en chips, badges, notas y deltas */
.chip svg, .badge svg, .delta svg, .stars svg {
  width: 13px !important;
  height: 13px !important;
  max-width: 13px !important;
  max-height: 13px !important;
  vertical-align: -0.12em !important;
  flex-shrink: 0 !important;
}
.sec-note svg {
  width: 16px !important;
  height: 16px !important;
  max-width: 16px !important;
  max-height: 16px !important;
  flex-shrink: 0 !important;
}
.brand-mark svg {
  width: 20px !important;
  height: 20px !important;
  max-width: 20px !important;
  max-height: 20px !important;
}

/* Iconos en buscador (Search Bar) */
.search-wrap svg,
div[style*="position:relative"] > span > svg {
  width: 16px !important;
  height: 16px !important;
  max-width: 16px !important;
  max-height: 16px !important;
  display: inline-block !important;
}

/* Iconos grandes de estados vacíos (Empty states) */
.empty > svg, .pt-empty > svg {
  width: 46px !important;
  height: 46px !important;
  max-width: 46px !important;
  max-height: 46px !important;
  display: block !important;
  margin: 0 auto 12px !important;
}
div[style*="border-radius:50%"] > svg {
  width: 26px !important;
  height: 26px !important;
  max-width: 26px !important;
  max-height: 26px !important;
}

/* Iconos en paneles de bloqueo y error */
.locked-panel .ic svg, .err-panel .ic svg {
  width: 30px !important;
  height: 30px !important;
  max-width: 30px !important;
  max-height: 30px !important;
}

/* Gráficas SVG y arte de producto mantienen su escalabilidad */
svg[data-chart], .spark svg, .chart-wrap svg, .pos-tile .art svg, .p-art > svg, .ci-art svg, .hp-cell .art svg, .pd-main svg, .login-art svg {
  width: 100% !important;
  max-width: 100% !important;
  height: auto;
}
.input, input, select, textarea {
  max-width: 100%;
  box-sizing: border-box;
}

/* 2. Topbar Flexible y Adaptativa */
.top {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 18px;
  min-width: 0;
  max-width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
}
.top::-webkit-scrollbar {
  display: none;
}
.top-search-btn {
  min-width: 200px;
  max-width: 260px;
  justify-content: flex-start;
  color: var(--muted);
}

/* 3. Clases de Cuadrículas Semánticas Responsivas */
.grid-split-admin {
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
  gap: 20px;
  align-items: start;
}
.grid-split-3col {
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) minmax(0, 1fr);
  gap: 18px;
  align-items: start;
}
.grid-form-2col {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 14px;
}

/* 4. Tablas Responsivas con Desplazamiento Horizontal Fluido */
.tbl-scroll {
  width: 100% !important;
  max-width: 100% !important;
  overflow-x: auto !important;
  -webkit-overflow-scrolling: touch;
  display: block;
}
.tbl {
  width: 100%;
  min-width: 560px; /* Evita que columnas se aplasten */
  border-collapse: separate;
  border-spacing: 0;
}

/* 5. Modales Fluidos */
.modal {
  padding: 16px;
}
.modal-box {
  width: min(720px, calc(100vw - 32px)) !important;
  max-height: calc(100vh - 40px) !important;
  overflow-y: auto !important;
}
.modal-box.wide {
  width: min(1040px, calc(100vw - 32px)) !important;
}
.modal-box.narrow {
  width: min(480px, calc(100vw - 32px)) !important;
}

/* ══════════════════════════════════════════════════════════════════════════
   BREAKPOINTS DE RESOLUCIÓN
   ══════════════════════════════════════════════════════════════════════════ */

/* A. Laptops comunes (1366x768, 1280x800, 1080p con 125%/150% de escala) <= 1260px */
@media (max-width: 1366px) {
  .card, .grid > * { min-width: 0; }
  /* Todas las divisiones forzadas en el panel administrativo se apilan a 1 sola columna
     para dar 100% de ancho a cada tarjeta y evitar que se desborden a la derecha */
  .grid-split-admin,
  .grid-split-3col,
  .page .grid[style*="1.2fr 1fr"],
  .page .grid[style*="1.4fr 1fr"],
  .page .grid[style*="1.5fr 1fr"],
  .page .grid[style*="1.55fr 1fr"],
  .page .grid[style*="1.62fr 1fr"],
  .page .grid[style*="320px 1fr"],
  .page .grid[style*="1.25fr 1fr 1fr"],
  .page .grid[style*="grid-template-columns:1fr 1fr;margin-top"],
  .pos-layout {
    grid-template-columns: 1fr !important;
    gap: 20px !important;
  }
  .pos-ticket {
    position: static !important;
    max-width: 100% !important;
  }
  
  /* Ajustes en el encabezado superior */
  .top {
    padding: 0 14px;
    gap: 8px;
  }
  .top-search-btn {
    min-width: 140px !important;
    max-width: 180px !important;
  }
  .top-help-text, .top-store-label {
    display: none !important;
  }
}

/* B. Laptops pequeñas y Tablets grandes <= 1100px */
@media (max-width: 1100px) {
  .nav-links { display: none !important; }
  .head-search { min-width: 160px !important; }
  .hero-in { grid-template-columns: 1fr; gap: 38px; }
  .hero-art { min-height: auto; max-width: 520px; margin: 0 auto 36px !important; width: 100%; position: relative; }
  .float-card.f1 { left: 4px; top: 12px; } .float-card.f2 { right: 4px; bottom: -12px; }
  .pd { grid-template-columns: 1fr; gap: 26px; } .pd-gal { position: static; }
  .banner { grid-template-columns: 1fr; padding: 32px; }
  
  /* Ocultar barra lateral a off-canvas */
  .admin {
    grid-template-columns: 1fr !important;
  }
  .side {
    position: fixed !important;
    left: 0; top: 0; bottom: 0;
    width: 280px !important;
    max-width: 85vw !important;
    transform: translateX(-100%);
    transition: transform .3s var(--ease);
    box-shadow: var(--sh-3);
    z-index: 250 !important;
  }
  .admin.mob-open .side {
    transform: none !important;
    z-index: 250 !important;
  }
  .mob-only {
    display: grid !important;
  }
  .hide-md {
    display: none !important;
  }
  
  .top-user-info {
    display: none !important;
  }
}

/* C. Tablets y pantallas medianas <= 860px */
@media (max-width: 860px) {
  .cat-layout { grid-template-columns: 1fr; }
  .filters { position: static; }
  .nav-links { display: none; }
  .hide-sm { display: none !important; }
  .login-wrap { grid-template-columns: 1fr; }
  .login-art { display: none; }
  .foot-in { grid-template-columns: 1fr 1fr; }
  .page { padding: 18px 14px 60px !important; }
  
  /* Los formularios de 2 columnas se apilan a 1 sola columna cómoda */
  .grid-form-2col,
  .page .grid[style*="grid-template-columns:1fr 1fr"],
  .modal .grid[style*="grid-template-columns:1fr 1fr"],
  .modal-box .grid[style*="grid-template-columns:1fr 1fr"],
  form .grid[style*="grid-template-columns:1fr 1fr"],
  .card-pad .grid[style*="grid-template-columns:1fr 1fr"] {
    grid-template-columns: 1fr !important;
    gap: 12px !important;
  }
  
  .page-head {
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
  }
  .page-head h1 {
    font-size: 24px;
  }
}

/* D. Teléfonos móviles <= 640px */
@media (max-width: 640px) {
  .store-topbar { height: 35px !important; }
  .store-topbar-in { padding: 0 10px !important; }
  .topbar-rate { font-size: 12.5px !important; gap: 5px !important; }
  .topbar-rate .rate-val { font-size: 12.5px !important; padding: 1px 6px !important; }
  .topbar-theme-btn { right: 10px !important; width: 26px !important; height: 26px !important; }
  .topbar-theme-btn svg { width: 13.5px !important; height: 13.5px !important; }
  .head-in { height: 56px !important; gap: 6px !important; padding: 0 10px !important; }

  .float-card { display: none !important; }

  .brand { font-size: 15.5px !important; gap: 6px !important; min-width: 0 !important; max-width: calc(100% - 150px) !important; flex-shrink: 1 !important; }
  .brand-line { gap: 6px !important; max-width: 100% !important; }
  .brand-title { font-size: 15.5px !important; overflow: hidden !important; text-overflow: ellipsis !important; white-space: nowrap !important; }
  .brand-mark { width: 30px !important; height: 30px !important; border-radius: 8px !important; flex-shrink: 0 !important; }
  .brand-mark svg { width: 17px !important; height: 17px !important; }
  .head-actions { gap: 6px !important; flex-shrink: 0 !important; }
  .cart-btn { width: 36px !important; height: 36px !important; border-radius: 10px !important; flex-shrink: 0 !important; }
  .cart-btn svg { width: 17px !important; height: 17px !important; }
  .head-panel-btn { padding: 6px 11px !important; font-size: 12.5px !important; gap: 5px !important; white-space: nowrap !important; border-radius: 8px !important; flex-shrink: 0 !important; }
  .head-panel-btn svg { width: 14px !important; height: 14px !important; }
  .hero { padding: 32px 14px 22px; }
  .sec { padding: 36px 14px; }
  .foot-in { grid-template-columns: 1fr; }
  .p-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .toasts { left: 12px; right: 12px; bottom: 12px; max-width: none; }
  
  .top {
    height: 56px !important;
    padding: 0 10px !important;
  }
  
  .card-pad {
    padding: 14px 12px !important;
  }
  .card-head {
    padding: 14px 12px !important;
    flex-direction: column !important;
    align-items: flex-start !important;

  }

  /* En móviles, las filas de empleados y roles envuelven sus botones abajo sin truncarse */
  .card-pad .row {
    flex-wrap: wrap !important;
  }
  
  .plug-grid {
    grid-template-columns: 1fr !important;
  }
  .grid[style*="repeat(3,1fr)"],
  .grid[style*="repeat(auto-fit,minmax(190px,1fr))"] {
    grid-template-columns: 1fr !important;
  }
  
  .kpi-grid {
    grid-template-columns: 1fr 1fr !important;
    gap: 10px !important;
  }
  .kpi {
    padding: 14px 12px !important;
  }
  .kpi b.val {
    font-size: 22px !important;
  }
  .pay-grid {
    grid-template-columns: 1fr 1fr;
  }
  
  /* Modales en móviles */

    padding: 8px !important;
  }
  .modal-box {

    max-height: 95vh !important;
    border-radius: 14px !important;
  }
  .modal-box .card-pad,
  .modal-box form > div,
  .modal-box > div[style*="padding:22px"] {
    padding: 14px 12px !important;
  }
}

@media (max-width: 420px) {
  .kpi-grid {
    grid-template-columns: 1fr !important;
  }
  .pay-grid {
    grid-template-columns: 1fr !important;
  }
  .page-head h1 {

  }

  }
}
.card-pad b.sm {
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-pad .mono {

}

<script>

/* ══════════════════════════════════════════════════════════════════════════
   0. CONFIG · banderas de diagnóstico (QA)
   ══════════════════════════════════════════════════════════════════════════ */
var DEV_ERRORS = true;   // muestra toast cuando algo falla (para reportar bugs)

function hexToRgb(h){ h=String(h).replace('#',''); if(h.length===3) h=h.split('').map(function(x){return x+x;}).join('');

  return 'rgb('+Math.round(c.r+(255-c.r)*f)+','+Math.round(c.g+(255-c.g)*f)+','+Math.round(c.b+(255-c.b)*f)+')'; }

  el.querySelector('[data-close]').onclick=kill;

}
var scrimStack=[];
function openOverlay(html,opt){
  opt=opt||{};
  var root=$('#overlay-root'), wrap=document.createElement('div');
  wrap.innerHTML=(opt.scrim===false?'':'<div class="scrim" data-action="close-overlay"></div>')+html;
  var nodes=Array.prototype.slice.call(wrap.children);
  nodes.forEach(function(n){ root.appendChild(n); });
  var entry={nodes:nodes,onClose:opt.onClose};
  scrimStack.push(entry);
  return entry;
}
function closeOverlay(entry){
  if(!entry) entry=scrimStack.pop(); else scrimStack=scrimStack.filter(function(e){return e!==entry;});
  if(!entry) return;
  entry.nodes.forEach(function(n){ n.style.transition='opacity .2s'; n.style.opacity='0';
    setTimeout(function(){ if(n.parentNode) n.parentNode.removeChild(n); },200); });
  if(entry.onClose) entry.onClose();
}
function closeAllOverlays(){ var guard=0; while(scrimStack.length && guard++<20) closeOverlay(); }
function openModal(inner,size){ return openOverlay('<div class="modal" data-action="modal-scrim"><div class="modal-box '+(size||'')+'" role="dialog" aria-modal="true">'+inner+'</div></div>'); }

var hideTipTimer = null;
function hideTooltip(){
  if(hideTipTimer){ clearTimeout(hideTipTimer); hideTipTimer = null; }
  var tip = document.getElementById('tooltip');
  if(tip) tip.classList.remove('show');
}
(function tooltipInit(){
  var tip = document.getElementById('tooltip');
  if(!tip) return;
  document.addEventListener('mouseover', function(e){
    if(window.matchMedia && window.matchMedia('(pointer: coarse)').matches) return;
    var el = e.target.closest ? e.target.closest('[data-tip]') : null;
    if(!el) return;
    if(!State.ui.help && !el.hasAttribute('data-tip-force')) return;
    tip.textContent = el.getAttribute('data-tip');
    tip.classList.add('show');
    var r = el.getBoundingClientRect();
    tip.style.left = clamp(r.left + r.width/2 - tip.offsetWidth/2, 10, innerWidth - tip.offsetWidth - 10) + 'px';
    tip.style.top = (r.top - tip.offsetHeight - 9 < 8 ? r.bottom + 9 : r.top - tip.offsetHeight - 9) + 'px';
    if(hideTipTimer) clearTimeout(hideTipTimer);
    hideTipTimer = setTimeout(hideTooltip, 2800);
  });
  document.addEventListener('mouseout', function(e){
    if(e.target.closest && e.target.closest('[data-tip]')) hideTooltip();
  });
  document.addEventListener('click', hideTooltip, {capture: true, passive: true});
  document.addEventListener('touchstart', hideTooltip, {capture: true, passive: true});
  document.addEventListener('scroll', hideTooltip, {capture: true, passive: true});
})();

var chartGeo={};
function smooth(pts){
  if(!pts.length) return '';
  if(pts.length<2) return 'M'+pts[0].x+','+pts[0].y;
  var d='M'+pts[0].x+','+pts[0].y, i;
  for(i=0;i<pts.length-1;i++){
    var p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    d+=' C'+(p1.x+(p2.x-p0.x)/6)+','+(p1.y+(p2.y-p0.y)/6)+' '+(p2.x-(p3.x-p1.x)/6)+','+(p2.y-(p3.y-p1.y)/6)+' '+p2.x+','+p2.y;
  }
  return d;
}
function areaChart(id,labels,values,h){
  h=h||240;
  var W=760,PADL=46,PADR=14,PADT=16,PADB=26;
  var max=(Math.max.apply(null,values)||1)*1.15;
  function x(i){ return PADL+(i*(W-PADL-PADR)/Math.max(1,values.length-1)); }
  function y(v){ return PADT+((max-v)/max)*(h-PADT-PADB); }
  var pts=values.map(function(v,i){ return {x:x(i),y:y(v),v:v,l:labels[i]}; });
  chartGeo[id]={pts:pts,W:W,h:h};
  var grid='',g;
  for(g=0;g<=4;g++){ var yy=PADT+g*((h-PADT-PADB)/4), val=max-(g*(max/4));
    grid+='<line x1="'+PADL+'" y1="'+yy+'" x2="'+(W-PADR)+'" y2="'+yy+'" stroke="var(--border)" stroke-dasharray="3 5"/>'+
      '<text x="'+(PADL-9)+'" y="'+(yy+4)+'" text-anchor="end" font-size="10" fill="var(--muted-2)" font-family="monospace">'+(val>=1000?(val/1000).toFixed(0)+'k':val.toFixed(0))+'</text>'; }
  var step=Math.ceil(pts.length/6);
  var xl=pts.filter(function(_,i){ return i%step===0||i===pts.length-1; })
    .map(function(p){ return '<text x="'+p.x+'" y="'+(h-6)+'" text-anchor="middle" font-size="10" fill="var(--muted-2)">'+esc(p.l)+'</text>'; }).join('');
  return '<svg viewBox="0 0 '+W+' '+h+'" data-chart="'+id+'" style="width:100%;height:'+h+'px;overflow:visible">'+
    '<defs><linearGradient id="grad-'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent-2)" stop-opacity=".38"/><stop offset="1" stop-color="var(--accent-2)" stop-opacity="0"/></linearGradient></defs>'+
    grid+'<path d="'+smooth(pts)+' L'+pts[pts.length-1].x+','+(h-PADB)+' L'+pts[0].x+','+(h-PADB)+' Z" fill="url(#grad-'+id+')"/>'+
    '<path d="'+smooth(pts)+'" fill="none" stroke="var(--accent-2)" stroke-width="2.6" stroke-linecap="round" class="draw"/>'+
    '<g class="chart-markers"></g>'+xl+'</svg>';
}
function sparkline(values,color){
  var W=120,H=34,max=Math.max.apply(null,values),min=Math.min.apply(null,values);
  var pts=values.map(function(v,i){ return {x:i*(W/(values.length>1?(values.length-1):1)),y:H-((v-min)/((max-min)||1))*(H-6)-3}; });
  return '<svg viewBox="0 0 '+W+' '+H+'"><path d="'+smooth(pts)+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" class="draw"/>'+
    '<circle cx="'+pts[pts.length-1].x+'" cy="'+pts[pts.length-1].y+'" r="2.6" fill="'+color+'"/></svg>';
}
function donut(data,size){
  size=size||168; var thick=22, total=data.reduce(function(a,b){return a+b.v;},0)||1, r=(size-thick)/2, c=2*Math.PI*r, off=0;
  var arcs=data.map(function(d){ var frac=d.v/total, s='<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+d.c+'" stroke-width="'+thick+'" stroke-dasharray="'+(frac*c)+' '+c+'" stroke-dashoffset="'+(-off*c)+'"/>'; off+=frac; return s; }).join('');
  return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--surface-3)" stroke-width="'+thick+'"/>'+arcs+
    '<text x="50%" y="47%" text-anchor="middle" font-size="12" fill="var(--muted)">Total</text>'+
    '<text x="50%" y="63%" text-anchor="middle" font-size="16" font-weight="700" fill="var(--text)" font-family="var(--font-display)">'+money(total)+'</text></svg>';
}

function initCharts(root){

  $$('.draw',root).forEach(function(p){
    var len=0; try{ len=p.getTotalLength()||300; }catch(e){ len=300; }
    p.style.strokeDasharray=len; p.style.strokeDashoffset=len; p.getBoundingClientRect();

    var markers=$('.chart-markers',svg);
    svg.addEventListener('mousemove',function(ev){
      var r=svg.getBoundingClientRect(), scale=r.width/geo.W, xm=(ev.clientX-r.left)/scale, best=0, bd=1e9;
      geo.pts.forEach(function(p,i){ var d=Math.abs(p.x-xm); if(d<bd){bd=d;best=i;} });

function animateNum(el){

  var sub=cartSub(), dsc=discount(sub), iva=Math.round((sub-dsc.amt)*0.16*100)/100;
  var shipCost=D.ship==='express'?299:(D.ship==='pickup'?0:((sub-dsc.amt>=1500)?0:149));
  var isDivisa = State.checkout.pay === 'cash';
  var igtf = isDivisa ? Math.round((sub - dsc.amt + iva) * 0.03 * 100) / 100 : 0;
  var total=Math.round((sub-dsc.amt+iva+shipCost+igtf)*100)/100;
  var bcv = BCV_RATE || 877.90;
  var totalBs = Math.round(total * bcv * 100) / 100;
  var folio='FM-'+(1001+DB.orders.length);
  var custName=D.name||'Cliente web';

  var mappedMethod = 'PAGO_MOVIL';
  if(State.checkout.pay==='cash') mappedMethod = 'EFECTIVO_USD';
  else if(State.checkout.pay==='card') mappedMethod = 'PUNTO_DEBITO';
  else if(State.checkout.pay==='transf') mappedMethod = 'TRANSFERENCIA';

  try{
    var orderPayload={
      items:State.cart.map(function(l){ return {productId:l.id,quantity:l.qty}; }),
      customer:{
        name:custName,
        docNumber:D.rfc||'V-12345678',
        docType:'V',
        phone:D.phone||'',
        email:D.email||''
      },
      deliveryType:D.ship==='pickup'?'PICKUP':'DELIVERY',
      deliveryAddress:(D.addr||'')+(D.city?', '+D.city:''),
      paymentMethod:mappedMethod,
      paymentReference:D.ref||('WEB-'+Date.now().toString().slice(-4)),
      notes:D.notes||'Pedido web FerreMax'
    };
    var resp=await fetch(API_URL+'/storefront/checkout',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(orderPayload)
    });
    if(resp.ok){
      var rData=await resp.json();
      if(rData.order&&rData.order.orderNumber){
        folio=rData.order.orderNumber;
        total=rData.order.totalUsd;
      }
      API_ONLINE=true;
    }
  }catch(e){
    console.warn('Backend checkout no disponible, guardando en local:',e);
  }

  var cust=DB.customers.filter(function(c){return c.email===D.email;})[0];
  if(!cust){ cust={id:'c'+(DB.customers.length+1),name:custName,email:D.email,phone:D.phone,rfc:D.rfc||'',city:D.city||'Caracas',since:new Date().toISOString().slice(0,10),seg:'Nuevo',tags:['Online']};
    DB.customers.unshift(cust); Bus.emit('crm.cliente.creado',custName+' · alta automática desde checkout',{module:'crm'}); }
  DB.orders.unshift({folio:folio,customerId:cust.id,customer:custName,items:items,sub:sub-dsc.amt,iva:iva,total:total,ship:shipCost,
    status:'preparando',channel:'Tienda online',date:new Date(),pay:{card:'Punto Débito',cash:'Efectivo USD',spei:'Pago Móvil'}[State.checkout.pay]||'Pago Móvil',coupon:dsc.label});
  items.forEach(function(i){ var p=byId(i.id); if(p) p.stock=Math.max(0,p.stock-i.qty); });
  Bus.emit('ventas.orden.creada',folio+' · '+money(total)+' · '+custName,{module:'ventas'});
  Bus.emit('inventario.descontar',items.length+' SKU actualizados',{module:'inventario'});
  D.folio=folio; D.total=total; State.checkout.lastItems=items;
  State.cart=[]; State.coupon=null; syncCartUI(); refreshBadges();
  State.checkout.step=4; renderCheckout();
  showToast('Pedido '+folio+' registrado por '+money(total)+'. Guardado en la base de datos.','ok','¡Pedido guardado!');
}

async function doLogin(role,email,pass){
  var creds={
    'Administrador':{email:'admin@ferremax.ve',pass:'Admin1234!'},
    'Cajero':{email:'caja1@ferremax.ve',pass:'Caja1234!'},
    'Almacén':{email:'almacen@ferremax.ve',pass:'Almacen1234!'},
    'Contabilidad':{email:'contabilidad@ferremax.ve',pass:'Conta1234!'},
    'Encargado de Tienda':{email:'gerente@ferremax.ve',pass:'Gerente1234!'}
  };

  var targetRole = role || State.loginRole || 'Administrador';
  var targetCred = creds[targetRole] || creds['Administrador'];
  var mailToSend = (email || targetCred.email).trim().toLowerCase();
  var passToSend = pass || targetCred.pass;

  try{
    var resp = await fetch(API_URL + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: mailToSend, password: passToSend })
    });

    if (resp.ok) {
      var data = await resp.json();
      AUTH_TOKEN = data.token;
      localStorage.setItem('ferremax_token', data.token);

      var userRoleCode = data.user.role;
      var roleDisplay = ROLE_MAP[userRoleCode] || userRoleCode;

      State.session = {
        id: data.user.id,
        name: data.user.name,
        email: data.user.email,
        role: userRoleCode,
        roleDisplayName: roleDisplay,
        token: data.token,
        since: new Date()
      };
      localStorage.setItem('ferremax_session', JSON.stringify(State.session));
      State.loginRole = roleDisplay;
      API_ONLINE = true;

      Bus.emit('auth.login', State.session.email + ' · ' + roleDisplay + ' · JWT firmado verificado', { module: 'core' });
      Bus.emit('auth.permisos', 'scope=' + (DB.perms[userRoleCode] ? DB.perms[userRoleCode].length : 0) + ' módulos', { module: 'core' });

      showToast('Autenticado como ' + roleDisplay + '. Bienvenido, ' + data.user.name.split(' ')[0] + '.', 'ok', 'Sesión JWT Iniciada');
      syncFromBackend().catch(function(err){ console.warn('sync error:', err); });

      var home = getRoleHome(userRoleCode);
      go(home);
      return;
    } else {
      var errData = await resp.json().catch(function(){ return {}; });
      var errMsg = errData.error || 'Credenciales inválidas (código ' + resp.status + ')';
      showToast(errMsg, 'err', 'Acceso denegado');
      return;
    }
  }catch(e){
    if (State.session && API_ONLINE) {
      console.error('Error post-login:', e);
      return;
    }
    console.warn('Backend auth no disponible o fuera de línea, usando fallback local:', e);
  }

  // Fallback offline
  var fallbackRole = role || 'Administrador';
  var fallbackCode = ROLE_CODE[fallbackRole] || 'ADMIN';
  var payload = { sub: 1, role: fallbackCode, email: mailToSend, iat: Date.now() };
  var b64 = ''; try { b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload)))).slice(0, 28); } catch(ex){ b64 = 'eyJkZW1vIjoidG9rZW4i'; }
  var demoToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.' + b64 + '.demoSignature';

  AUTH_TOKEN = demoToken;
  localStorage.setItem('ferremax_token', demoToken);
  State.session = {
    id: 'local-' + Date.now(),
    name: ROLE_NAME[fallbackRole] || 'Usuario FerreMax',
    email: mailToSend,
    role: fallbackCode,
    roleDisplayName: fallbackRole,
    token: demoToken,
    since: new Date()
  };
  localStorage.setItem('ferremax_session', JSON.stringify(State.session));
  State.loginRole = fallbackRole;

  Bus.emit('auth.login', State.session.email + ' · ' + fallbackRole + ' · Fallback offline', { module: 'core' });
  showToast('Modo de contingencia offline. Sesión local como ' + fallbackRole + '.', 'warn', 'Acceso local');

  var fallbackHome = getRoleHome(fallbackCode);
  go(fallbackHome);
}

function metrics(){
  var now=new Date();
  function age(d){ return (now-new Date(d))/864e5; }
  var ords=Array.isArray(DB.orders)?DB.orders:[]; var prods=Array.isArray(DB.products)?DB.products:[]; var invs=Array.isArray(DB.invoices)?DB.invoices:[]; var today=ords.filter(function(o){return age(o.date)<1&&o.status!=='cancelada';});
  var last30=ords.filter(function(o){return age(o.date)<=30&&o.status!=='cancelada';});
  var sum=function(a){return a.reduce(function(x,y){return x+y.total;},0);};
  var sales30=sum(last30)||1, prev=sum(ords.filter(function(o){return age(o.date)>30;}))||1;
  return {today:sum(today),todayN:today.length,sales30:sales30,salesPrev:prev,growth:((sales30-prev)/prev)*100,
    ticket:last30.length?sales30/last30.length:0,orders30:last30.length,
    low:prods.filter(function(p){return p.stock>0&&p.stock<=p.min;}),
    out:prods.filter(function(p){return p.stock===0;}),
    stockValue:prods.reduce(function(a,p){return a+(Number(p.cost)||0)*(Number(p.stock)||0);},0),
    pend:invs.filter(function(i){return i.status!=='timbrada';})};
}
function salesSeries(range){
  var r=seeded(range==='7d'?11:(range==='30d'?22:33)), out=[], lab=[], i, n, d;
  if(range==='12m'){ for(i=11;i>=0;i--){ d=new Date(); d.setMonth(d.getMonth()-i);
      lab.push(d.toLocaleDateString('es-MX',{month:'short'}).replace('.','')); out.push(Math.round(78000+r()*64000+(11-i)*2600)); }
    return {labels:lab,values:out}; }
  n=range==='7d'?7:30;
  for(i=n-1;i>=0;i--){ d=daysAgo(i); lab.push(d.toLocaleDateString('es-MX',{day:'2-digit',month:'short'}).replace('.',''));
    out.push(Math.round(3200+r()*7400+(i<2?2600:0))); }
  return {labels:lab,values:out};
}

function topProducts(n){
  var map={};
  (DB.orders||[]).forEach(function(o){ (o.items||[]).forEach(function(i){ var k=i.id||i.sku||i.name; map[k]=(map[k]||0)+i.price*i.qty; }); });

    .filter(function(x){return x.p;}).sort(function(a,b){return b.v-a.v;}).slice(0,n||5); if(!res.length&&DB.products&&DB.products.length){ res=DB.products.slice(0,n||5).map(function(p,idx){ return {id:p.id,v:Math.round(p.price*(24-idx*3)),p:p}; }); } return res;

var posCart=[]; var posPay='Efectivo USD'; var posClient=(DB.customers && DB.customers[0]) ? DB.customers[0].id : '';
function posTotals(){
  var sub=posCart.reduce(function(a,b){
    var p=byId(b.id);
    if(!p) return a + ((b.price || 0) * (b.qty || 1));
    var isPurchaseUnit = b.unitSold && p.purchaseUnit && b.unitSold === p.purchaseUnit;
    var price = isPurchaseUnit ? (p.price * (p.unitRatio || 1)) : p.price;
    return a + (price * b.qty);
  },0);
  var d=posCart.reduce(function(a,b){return a+(b.disc||0);},0);
  var iva=Math.round((sub-d)*getIvaRate()*100)/100;
  return {sub:sub,d:d,iva:iva,total:Math.round((sub-d+iva)*100)/100};
}

    if(!p) return '';

              '<td data-l="Ruta"><div class="row xs" style="gap:6px"><span class="badge b-mut">' + esc(fromName) + '</span> ➔ <span class="badge b-ok">' + esc(toName) + '</span></div></td>' +
              '<td data-l="Ítems"><span class="sm font-medium">' + esc(itemsSummary || 'Sin ítems') + '</span></td>' +
              '<td data-l="Responsable"><span class="xs muted">' + esc(t.userCreated || 'Encargado') + '</span></td>' +
              '<td data-l="Notas"><span class="xs muted">' + esc(t.notes || '—') + '</span></td>' +
              '<td data-l="Estado"><span class="badge b-ok">COMPLETADO</span></td>' +

          }).join('') : '<tr><td colspan="7" class="center muted" style="padding:24px">No hay traslados registrados aún. Haz clic en "Nuevo Traslado Interno" para realizar el primero.</td></tr>') +

function openNewWarehouseModal() {
  openModal(
    '<div class="card-head"><div><h3>Registrar Nuevo Almacén / Depósito</h3><p class="card-sub">Gestión multi-depósito para ferretería</p></div>' +
    '<button class="icon-btn" type="button" data-action="close-overlay">' + I.x + '</button></div>' +
    '<div style="padding:20px">' +
      '<div class="grid grid-form-2col" style="grid-template-columns:1fr 2fr;gap:14px;margin-bottom:14px">' +
        '<div><label class="lbl">Código Único *</label><input class="input mono font-bold" id="wh-modal-code" placeholder="Ej: PATIO-2, SUCR-1" style="text-transform:uppercase"></div>' +
        '<div><label class="lbl">Nombre del Almacén *</label><input class="input" id="wh-modal-name" placeholder="Ej: Galpón Este / Cemento y Cabillas"></div>' +
      '</div>' +
      '<div style="margin-bottom:14px">' +
        '<label class="lbl">Ubicación Física / Dirección</label>' +
        '<input class="input" id="wh-modal-location" placeholder="Ej: Zona Industrial Los Cortijos, Portón 3">' +
      '</div>' +
      '<label class="fcheck" style="margin-bottom:14px">' +
        '<input type="checkbox" id="wh-modal-default"> <span class="sm font-medium">Asignar como depósito de mostrador principal (Punto de Venta)</span>' +
      '</label>' +
    '</div>' +
    '<div class="dr-foot row" style="justify-content:flex-end;gap:10px">' +
      '<button class="btn btn-ghost" type="button" data-action="close-overlay">Cancelar</button>' +
      '<button class="btn btn-primary" type="button" id="btn-save-warehouse">' + I.check + ' Crear Almacén</button>' +
    '</div>'
  );

  var btn = $('#btn-save-warehouse');
  if (btn) {
    btn.onclick = async function() {
      var code = ($('#wh-modal-code').value || '').trim().toUpperCase();
      var name = ($('#wh-modal-name').value || '').trim();
      var loc = ($('#wh-modal-location').value || '').trim();
      var isDef = $('#wh-modal-default').checked;

      if (!code || !name) {
        showToast('El código y el nombre del almacén son obligatorios.', 'err');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Guardando...';

      try {
        var resp = await fetch(API_URL + '/warehouses', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + (AUTH_TOKEN || '')
          },
          body: JSON.stringify({ code: code, name: name, location: loc, isDefault: isDef })
        });
        var data = await resp.json();
        if (resp.ok) {
          showToast('Almacén ' + code + ' registrado exitosamente.', 'ok', 'Almacén Creado');
          closeOverlay();
          await syncFromBackend();
          render();
        } else {
          showToast(data.error || 'Error al crear almacén.', 'err');
          btn.disabled = false;
          btn.textContent = 'Crear Almacén';
        }
      } catch(e) {
        showToast('Error de conexión: ' + e.message, 'err');
        btn.disabled = false;
        btn.textContent = 'Crear Almacén';
      }
    };
  }
}

function openNewTransferModal(defaultFromId) {
  var whs = getWarehouseList();
  if (whs.length < 2) {
    showToast('Se requieren al menos 2 depósitos activos para realizar un traslado.', 'warn');
    return;
  }
  openModal(
    '<div class="card-head"><div><h3>Nuevo Traslado Interno de Mercancía</h3><p class="card-sub">Transferencia atómica auditable (TR-xxxx)</p></div>' +
    '<button class="icon-btn" type="button" data-action="close-overlay">' + I.x + '</button></div>' +
    '<div style="padding:20px">' +
      '<div class="grid grid-form-2col" style="grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">' +
        '<div><label class="lbl">Depósito Origen *</label>' +
          '<select class="input" id="tr-modal-from">' +
            whs.map(function(w){ return '<option value="' + w.id + '" ' + (w.id === defaultFromId ? 'selected' : '') + '>' + w.code + ' - ' + w.name + '</option>'; }).join('') +
          '</select>' +
        '</div>' +
        '<div><label class="lbl">Depósito Destino *</label>' +
          '<select class="input" id="tr-modal-to">' +
            whs.map(function(w, idx){ return '<option value="' + w.id + '" ' + (idx === 1 && !defaultFromId ? 'selected' : '') + '>' + w.code + ' - ' + w.name + '</option>'; }).join('') +
          '</select>' +
        '</div>' +
      '</div>' +
      '<div class="grid grid-form-2col" style="grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px">' +
        '<div><label class="lbl">Producto a Transferir *</label>' +
          '<select class="input" id="tr-modal-prod">' +
            DB.products.map(function(p){
              return '<option value="' + p.id + '">' + p.sku + ' - ' + p.name + ' (' + p.stock + ' ' + (p.unit||'UND') + ')</option>';
            }).join('') +
          '</select>' +
        '</div>' +
        '<div><label class="lbl">Cantidad *</label>' +
          '<input class="input mono font-bold" id="tr-modal-qty" type="number" step="any" min="0.01" value="1">' +
        '</div>' +
      '</div>' +
      '<div style="margin-bottom:14px">' +
        '<label class="lbl">Motivo / Notas de Auditoría</label>' +
        '<input class="input" id="tr-modal-notes" placeholder="Ej: Reabastecimiento de mostrador para ventas del fin de semana">' +
      '</div>' +
      '<div class="sec-note" style="margin-bottom:14px">' +
        I.info + '<span>Se descontará del stock del almacén origen y se sumará al destino en un movimiento atómico registrado con folio TR.</span>' +
      '</div>' +
    '</div>' +
    '<div class="dr-foot row" style="justify-content:flex-end;gap:10px">' +
      '<button class="btn btn-ghost" type="button" data-action="close-overlay">Cancelar</button>' +
      '<button class="btn btn-primary" type="button" id="btn-submit-transfer">' + I.check + ' Procesar Traslado Atómico</button>' +
    '</div>'
  );

  var btn = $('#btn-submit-transfer');
  if (btn) {
    btn.onclick = async function() {
      var fromId = $('#tr-modal-from').value;
      var toId = $('#tr-modal-to').value;
      var prodId = $('#tr-modal-prod').value;
      var qty = parseFloat($('#tr-modal-qty').value);
      var notes = ($('#tr-modal-notes').value || '').trim();

      if (fromId === toId) {
        showToast('El depósito origen y destino no pueden ser el mismo.', 'err', 'Traslado Inválido');
        return;
      }
      if (!qty || qty <= 0) {
        showToast('Ingresa una cantidad válida.', 'err');
        return;
      }

      var prod = byId(prodId);
      btn.disabled = true;
      btn.textContent = 'Procesando...';

      try {
        var resp = await fetch(API_URL + '/warehouses/transfers', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + (AUTH_TOKEN || '')
          },
          body: JSON.stringify({
            fromWarehouseId: fromId,
            toWarehouseId: toId,
            notes: notes || ('Traslado de ' + (prod ? prod.name : 'producto')),
            items: [{
              productId: prodId,
              quantity: qty,
              unit: prod ? prod.unit : 'UND'
            }]
          })
        });

        var data = await resp.json();
        if (resp.ok) {
          showToast('Traslado ' + (data.transferNumber || 'TR-OK') + ' registrado con éxito.', 'ok', 'Traslado Exitoso');
          closeOverlay();
          await syncFromBackend();
          render();
        } else {
          showToast(data.error || 'Error al procesar traslado.', 'err');
          btn.disabled = false;
          btn.textContent = 'Procesar Traslado Atómico';
        }
      } catch(e) {
        showToast('Error de conexión: ' + e.message, 'err');
        btn.disabled = false;
        btn.textContent = 'Procesar Traslado Atómico';
      }
    };
  }
}

Views.inventario=function(){
  var ui=State.ui, m=metrics();
  var invTab = ui.invTab || 'catalogo';
  var list=DB.products.filter(function(p){
    if(ui.invQ && (p.name+p.sku).toLowerCase().indexOf(ui.invQ.toLowerCase())<0) return false;
    if(ui.invCat!=='todos'&&p.cat!==ui.invCat) return false;
    if(ui.invState==='bajo'&&!(p.stock>0&&p.stock<=p.min)) return false;
    if(ui.invState==='agotado'&&p.stock!==0) return false;
    if(ui.invState==='ok'&&!(p.stock>p.min)) return false;
    return true; });

  var whs = getWarehouseList();
  var trs = getTransfersList();

  return '<div class="page-head"><div><h1>Inventario Multi-Depósito</h1><p>'+DB.products.length+' SKU activos · '+whs.length+' depósitos · valor a costo '+money(m.stockValue)+'</p></div>'+
    '<div class="wrap-row">'+
      '<button class="btn btn-primary btn-sm" type="button" data-action="open-ai-scanner" style="background:#003333;color:#fff;border:1px solid #CFB53B;gap:6px;font-weight:700"><span style="color:#CFB53B">📸</span> Escáner IA Móvil</button>'+
      '<button class="btn btn-ghost btn-sm" type="button" data-action="open-gsheets-sync" style="gap:6px;font-weight:600"><span style="color:#0F9D58">☁️</span> Google Drive / Sheets</button>'+
      '<button class="btn btn-ghost btn-sm" type="button" data-action="export-csv" data-what="inventario">'+I.dl+' Exportar CSV</button>'+
      '<button class="btn btn-ghost btn-sm" type="button" data-action="open-transfer-modal">'+I.refresh+' Traslado interno</button>'+
      '<button class="btn btn-soft btn-sm" type="button" data-action="new-product">'+I.plus+' Nuevo producto</button>'+
    '</div></div>'+

  /* Tabs de navegación */
  '<div class="tabs" style="margin-bottom:18px">'+
    '<button class="tab-btn '+(invTab==='catalogo'?'on':'')+'" type="button" data-action="inv-tab" data-tab="catalogo">'+I.box+' Catálogo y Unidades <span class="badge b-mut" style="margin-left:6px">'+DB.products.length+'</span></button>'+
    '<button class="tab-btn '+(invTab==='depositos'?'on':'')+'" type="button" data-action="inv-tab" data-tab="depositos">'+I.truck+' Depósitos y Almacenes <span class="badge b-mut" style="margin-left:6px">'+whs.length+'</span></button>'+
    '<button class="tab-btn '+(invTab==='traslados'?'on':'')+'" type="button" data-action="inv-tab" data-tab="traslados">'+I.refresh+' Traslados Auditados <span class="badge b-mut" style="margin-left:6px">'+trs.length+'</span></button>'+
  '</div>'+

  (invTab==='depositos'
    ? renderWarehouseSection()
    : invTab==='traslados'
    ? renderTransfersSection()
    : (
      '<div class="kpi-grid" style="margin-bottom:18px">'+
        kpiNum('Total SKU',DB.products.length,'+2','up','box','var(--info)','var(--info-soft)',[40,44,46,48,50,52,54],'')+
        kpiNum('Stock bajo',m.low.length,'requiere OC','down','alert','var(--warn)','var(--warn-soft)',[8,7,7,6,5,5,4],'')+
        kpiNum('Agotados',m.out.length,'-1','up','x','var(--danger)','var(--danger-soft)',[6,5,5,4,3,2,1],'')+
        kpiNum('Rotación 30 d',2.4,'+0.3×','up','refresh','var(--accent)','var(--accent-soft)',[40,46,44,52,58,60,66],'×','')+
      '</div>'+
      '<div class="card"><div class="card-head"><div class="row" style="gap:10px;flex-wrap:wrap">'+
          '<div class="search-wrap" style="width:min(250px,60vw)">'+I.search+'<input class="input" id="inv-q" placeholder="Buscar SKU o nombre…" value="'+esc(ui.invQ)+'"></div>'+
          '<select class="input" style="width:auto" id="inv-cat"><option value="todos">Todas las categorías</option>'+
            CATS.map(function(c){return '<option value="'+c.id+'" '+(ui.invCat===c.id?'selected':'')+'>'+c.name+'</option>';}).join('')+'</select>'+
          '<select class="input" style="width:auto" id="inv-state"><option value="todos">Todo el stock</option>'+
            [['ok','Saludable'],['bajo','Stock bajo'],['agotado','Agotado']].map(function(o){return '<option value="'+o[0]+'" '+(ui.invState===o[0]?'selected':'')+'>'+o[1]+'</option>';}).join('')+'</select></div>'+
          '<span class="xs muted">'+list.length+' resultado(s)</span></div>'+
        '<div class="tbl-scroll"><table class="tbl"><thead><tr><th>Producto & Unidades</th><th>Categoría</th><th>Precio Base</th><th>Costo</th><th>Margen</th><th>Existencia Tienda</th><th>Estado</th><th></th></tr></thead><tbody>'+
          list.map(function(p){
            var mar=(p.price-p.cost)/p.price*100;
            var st=p.stock===0?['b-bad','Agotado']:(p.stock<=p.min?['b-warn','Bajo']:['b-ok','Óptimo']);
            var w=clamp(p.stock/(p.min*4)*100,4,100);
            var hasConversion = p.unitRatio && p.unitRatio > 1 && p.purchaseUnit && p.purchaseUnit !== p.unit;
            return '<tr><td data-l="Producto"><span class="row" style="gap:11px">'+
              '<span style="width:42px;height:42px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;overflow:hidden;flex:none">'+

              '</span>'+
              '<span><b class="sm">'+esc(p.name)+'</b><br><span class="xs muted mono">'+p.sku+'</span>'+

                (p.hasSerial ? '<span class="badge b-info xs" style="margin-left:4px">Serial ('+(p.warrantyMonths||12)+'m Gar.)</span>' : '')+
                (p.location ? '<br><span class="xs muted">📍 '+esc(p.location)+'</span>' : '')+
              '</span></span></td>'+
              '<td data-l="Categoría"><span class="badge b-mut" style="color:'+catColor(p.cat)+'">'+catName(p.cat)+'</span></td>'+
              '<td data-l="Precio"><b class="mono sm">'+money(p.price)+'</b><br><span class="xs muted">/'+(p.unit||'UND')+'</span></td>'+
              '<td data-l="Costo"><span class="mono sm tip" data-tip="Dato sensible: cifrado en reposo (AES-256) y oculto para roles sin permiso." data-tip-force>'+money(p.cost)+'</span></td>'+
              '<td data-l="Margen"><span class="badge '+(mar>=30?'b-ok':(mar>=18?'b-warn':'b-bad'))+'">'+mar.toFixed(0)+'%</span></td>'+
              '<td data-l="Existencia" style="min-width:160px"><div class="row" style="gap:8px"><b class="mono sm">'+p.stock+' '+ (p.unit||'UND') +'</b>'+
                '<div class="bar" style="flex:1;min-width:50px"><i data-w="'+w+'" style="background:'+(p.stock===0?'var(--danger)':(p.stock<=p.min?'var(--warn)':'var(--ok)'))+'"></i></div>'+
                '</div>'+
                (hasConversion ? '<span class="xs muted mono">Equiv: '+(Math.round(p.stock/p.unitRatio*10)/10)+' '+p.purchaseUnit+'</span>' : '')+
              '</td>'+
              '<td data-l="Estado"><span class="badge '+st[0]+'">'+st[1]+'</span></td>'+
              '<td data-l=""><div class="row" style="gap:5px;justify-content:flex-end">'+
                '<button class="btn btn-sm btn-ghost" type="button" data-action="stock-adj" data-id="'+p.id+'" data-d="-1" aria-label="Restar">'+I.minus+'</button>'+
                '<button class="btn btn-sm btn-ghost" type="button" data-action="stock-adj" data-id="'+p.id+'" data-d="1" aria-label="Sumar">'+I.plus+'</button>'+
                '<button class="btn btn-sm btn-ghost" type="button" data-action="edit-product" data-id="'+p.id+'" aria-label="Editar">'+I.edit+'</button>'+
                '<button class="btn btn-sm btn-ghost" type="button" data-action="del-product" data-id="'+p.id+'" aria-label="Eliminar" style="color:var(--danger)">'+I.trash+'</button></div></td></tr>';
          }).join('')+'</tbody></table></div>'+

function filterDeliveryNotesByClient(val) {
  State.ui.pendingNotesClient = val;
  render();
}

function toggleSelectNoteItem(id, isChecked) {
  if (!FISCAL_STATE.selectedNoteIds) FISCAL_STATE.selectedNoteIds = [];
  var idx = FISCAL_STATE.selectedNoteIds.indexOf(id);
  if (isChecked && idx < 0) {
    FISCAL_STATE.selectedNoteIds.push(id);
  } else if (!isChecked && idx >= 0) {
    FISCAL_STATE.selectedNoteIds.splice(idx, 1);
  }
  render();
}

function toggleSelectAllNotes(isChecked) {
  var notes = getPendingDeliveryNotes();
  var clientsFilter = State.ui.pendingNotesClient || 'TODOS';
  var filtered = notes.filter(function(n) {
    if (clientsFilter !== 'TODOS' && n.customerDoc !== clientsFilter) return false;
    return true;
  });
  if (isChecked) {
    FISCAL_STATE.selectedNoteIds = filtered.map(function(n){ return n.id; });
  } else {
    FISCAL_STATE.selectedNoteIds = [];
  }
  render();
}

function getParetoAnalysisLocal() {
  if (BI_STATE.pareto) return BI_STATE.pareto;
  var bcv = BCV_RATE || 877.90;
  var products = DB.products || [];
  var orders = DB.orders || [];

  var stats = products.map(function(p) {
    var unitsSold = 0;
    var revenueUsd = 0;
    orders.forEach(function(o) {
      if (o.status !== 'cancelada') {
        (o.items || []).forEach(function(it) {
          if (it.id === p.id || it.sku === p.sku || it.name === p.name) {
            unitsSold += Number(it.qty || 0);
            revenueUsd += Number(it.price || p.price) * Number(it.qty || 0);
          }
        });
      }
    });

    var costUsd = Number(p.cost || p.price * 0.7);
    var totalCostUsd = unitsSold * costUsd;
    var grossProfitUsd = revenueUsd - totalCostUsd;
    var marginPct = revenueUsd > 0 ? (grossProfitUsd / revenueUsd) * 100 : 0;
    var stockVal = (p.stock || 0) * costUsd;

    return {
      id: p.id,
      sku: p.sku,
      name: p.name,
      category: p.cat || 'General',
      stock: p.stock || 0,
      unit: p.unit || 'UND',
      costUsd: costUsd,
      priceUsd: p.price,
      stockValueUsd: stockVal,
      unitsSold: unitsSold,
      revenueUsd: revenueUsd,
      revenueBs: revenueUsd * bcv,
      grossProfitUsd: grossProfitUsd,
      grossProfitBs: grossProfitUsd * bcv,
      marginPercent: Math.round(marginPct * 10) / 10,
      isDeadStock: (p.stock || 0) > 0 && unitsSold === 0
    };
  });

  stats.sort(function(a, b) { return b.grossProfitUsd - a.grossProfitUsd; });
  var totProfit = stats.reduce(function(a, b) { return a + Math.max(0, b.grossProfitUsd); }, 0) || 1.0;
  var run = 0;

  var classified = stats.map(function(p) {
    if (p.grossProfitUsd > 0) run += p.grossProfitUsd;
    var share = (Math.max(0, p.grossProfitUsd) / totProfit) * 100;
    var cum = (run / totProfit) * 100;

    var pClass = 'C';
    var action = '';
    if (cum <= 80 || (cum > 80 && (run - p.grossProfitUsd) < totProfit * 0.8)) {
      pClass = 'A';
      action = '⭐ Producto Estrella: Garantizar stock continuo y reposición prioritaria.';
    } else if (cum <= 95) {
      pClass = 'B';
      action = '🥈 Rotación Intermedia: Mantener margen estándar y combos.';
    } else {
      pClass = 'C';
      if (p.isDeadStock) {
        action = '⚠️ "Hueso" Inmovilizado: Descuento 15-25% o liquidación para recuperar capital.';
      } else {
        action = '📦 Baja rotación: Adquirir solo bajo pedido o stock mínimo.';
      }
    }

    return {
      id: p.id,
      sku: p.sku,
      name: p.name,
      category: p.category,
      stock: p.stock,
      unit: p.unit,
      costUsd: p.costUsd,
      priceUsd: p.priceUsd,
      stockValueUsd: p.stockValueUsd,
      unitsSold: p.unitsSold,
      revenueUsd: p.revenueUsd,
      revenueBs: p.revenueBs,
      grossProfitUsd: p.grossProfitUsd,
      grossProfitBs: p.grossProfitBs,
      marginPercent: p.marginPercent,
      profitSharePercent: Math.round(share * 10) / 10,
      cumulativeProfitPercent: Math.round(cum * 10) / 10,
      paretoClass: pClass,
      isDeadStock: p.isDeadStock,
      strategicAction: action
    };
  });

  var dead = classified.filter(function(p){ return p.isDeadStock; });
  return {
    summary: {
      totalProducts: classified.length,
      classACount: classified.filter(function(p){ return p.paretoClass === 'A'; }).length,
      classBCount: classified.filter(function(p){ return p.paretoClass === 'B'; }).length,
      classCCount: classified.filter(function(p){ return p.paretoClass === 'C'; }).length,
      deadStockCount: dead.length,
      deadStockValueUsd: dead.reduce(function(a,b){ return a + b.stockValueUsd; }, 0),
      totalRevenueUsd: classified.reduce(function(a,b){ return a + b.revenueUsd; }, 0),
      totalGrossProfitUsd: totProfit,
      averageMarginPercent: 38.5,
      bcvRate: bcv
    },
    products: classified
  };
}

function renderPredictiveStockSection() {
  var bcv = BCV_RATE || 877.90;
  var pData = BI_STATE.predictive;
  
  var summary = (pData && pData.summary) ? pData.summary : {
    totalProductsTracked: (DB.products || []).length,
    criticalCount: 0,
    warningCount: 0,
    healthyCount: (DB.products || []).length,
    overstockedCount: 0,
    totalInvestmentNeededUsd: 0,
    totalInvestmentNeededBs: 0,
    bcvRate: bcv
  };

  var items = (pData && pData.items) ? pData.items : (DB.products || []).map(function(p){
    var lead = p.leadTimeDays || 7;
    var dcr = 0.5;
    var rop = Math.ceil((dcr * lead) + (dcr * 5));
    var days = p.stock > 0 ? Math.round(p.stock / dcr) : 0;
    var risk = p.stock <= 0 || days <= 3 ? 'CRITICAL_DEPLETED' : (p.stock <= rop ? 'WARNING_REORDER_NOW' : 'HEALTHY');
    var sug = risk === 'CRITICAL_DEPLETED' || risk === 'WARNING_REORDER_NOW' ? (rop * 2) - p.stock : 0;
    return {
      productId: p.id,
      sku: p.sku,
      name: p.name,
      category: p.cat || 'General',
      currentStock: p.stock || 0,
      unit: p.unit || 'UND',
      dailyConsumptionRate: dcr,
      leadTimeDays: lead,
      safetyBufferDays: 5,
      reorderPointDynamic: rop,
      daysRemaining: days,
      riskStatus: risk,
      suggestedOrderQty: Math.max(0, sug),
      estimatedCostUsd: Number(p.cost || p.price * 0.7),
      totalInvestmentUsd: Math.max(0, sug) * Number(p.cost || p.price * 0.7),
      totalInvestmentBs: Math.max(0, sug) * Number(p.cost || p.price * 0.7) * bcv
    };
  });

  var filter = BI_STATE.predictiveFilter || 'ALL';
  var filtered = items.filter(function(it) {
    if (filter === 'CRITICAL') return it.riskStatus === 'CRITICAL_DEPLETED';
    if (filter === 'WARNING') return it.riskStatus === 'WARNING_REORDER_NOW';
    if (filter === 'HEALTHY') return it.riskStatus === 'HEALTHY';
    if (filter === 'OVERSTOCKED') return it.riskStatus === 'OVERSTOCKED';
    return true;
  });

  return '<div class="kpi-grid" style="margin-bottom:18px">' +
    kpiNum('🚨 Quiebre Crítico', summary.criticalCount, 'Stock agotado o <3 días', (summary.criticalCount > 0 ? 'down' : 'up'), 'alert', (summary.criticalCount > 0 ? 'var(--danger)' : 'var(--ok)'), (summary.criticalCount > 0 ? 'var(--danger-soft)' : 'var(--ok-soft)'), [3, 2, 2, 2, 2, summary.criticalCount], ' prod') +
    kpiNum('⚠️ Reorden Inmediato', summary.warningCount, 'Bajo el ROP dinámico', (summary.warningCount > 0 ? 'down' : 'up'), 'clock', (summary.warningCount > 0 ? 'var(--warn)' : 'var(--ok)'), (summary.warningCount > 0 ? 'var(--warn-soft)' : 'var(--ok-soft)'), [5, 4, 3, 3, summary.warningCount], ' prod') +
    kpiNum('🟢 Stock Saludable', summary.healthyCount, 'Cobertura óptima de ventas', 'up', 'check', 'var(--ok)', 'var(--ok-soft)', [10, 11, 12, summary.healthyCount], ' prod') +
    kpiMoney('💰 Inversión Sugerida', summary.totalInvestmentNeededUsd, 'Bs. ' + Number(summary.totalInvestmentNeededBs || (summary.totalInvestmentNeededUsd * bcv)).toLocaleString('es-VE', {minimumFractionDigits:2}), 'up', 'cart', 'var(--accent)', 'var(--accent-soft)', [500, 700, 900, summary.totalInvestmentNeededUsd], '') +
  '</div>' +

  '<div class="card">' +
    '<div class="card-head spread" style="flex-wrap:wrap;gap:12px">' +
      '<div>' +
        '<h3>⚡ Algoritmo Min/Max Predictivo & Tiempo de Entrega del Proveedor</h3>' +
        '<p class="card-sub">Punto de Reorden Dinámico: ROP = (Consumo Diario × Días Proveedor) + Colchón de Contingencia</p>' +
      '</div>' +
      '<div class="wrap-row" style="gap:6px">' +
        '<button class="chip ' + (filter === 'ALL' ? 'on' : '') + '" type="button" data-action="filter-predictive" data-f="ALL">Todos (' + items.length + ')</button>' +
        '<button class="chip ' + (filter === 'CRITICAL' ? 'on' : '') + '" type="button" data-action="filter-predictive" data-f="CRITICAL">🚨 Críticos (' + summary.criticalCount + ')</button>' +
        '<button class="chip ' + (filter === 'WARNING' ? 'on' : '') + '" type="button" data-action="filter-predictive" data-f="WARNING">⚠️ Por Ordenar (' + summary.warningCount + ')</button>' +
        '<button class="chip ' + (filter === 'HEALTHY' ? 'on' : '') + '" type="button" data-action="filter-predictive" data-f="HEALTHY">🟢 Óptimos (' + summary.healthyCount + ')</button>' +
        '<button class="btn btn-sm btn-ghost" type="button" data-action="recalculate-predictive">' + I.refresh + ' Recalcular</button>' +
      '</div>' +
    '</div>' +

    '<div class="tbl-scroll">' +
      '<table class="tbl">' +
        '<thead>' +
          '<tr>' +
            '<th>Estado de Riesgo</th>' +

          (filtered.map(function(it) {
            var riskBadge = '';
            if (it.riskStatus === 'CRITICAL_DEPLETED') {
              riskBadge = '<span class="badge b-bad font-bold">🚨 CRÍTICO</span>';
            } else if (it.riskStatus === 'WARNING_REORDER_NOW') {
              riskBadge = '<span class="badge b-warn font-bold">⚠️ ORDENAR YA</span>';

                '<div style="line-height:1.6;font-size:13px">' +

                  '<div><b>Precio Base:</b> $' + Number(result.product.priceUsd).toFixed(2) + ' (Bs. ' + (result.product.priceUsd * bcv).toLocaleString('es-VE', {minimumFractionDigits:2}) + ')</div>' +

                '<div style="line-height:1.6;font-size:13px">' +
                  '<div><b>Proveedor:</b> ' + esc(result.acquisition ? result.acquisition.supplierName : 'Mayorista de Ferretería') + '</div>' +
                  '<div><b>Factura Proveedor:</b> <span class="mono">' + esc(result.acquisition ? result.acquisition.purchaseBillNumber : 'N/A') + '</span></div>' +
                  '<div><b>Fecha Recepción:</b> ' + (result.acquisition && result.acquisition.receivedAt ? fmtDateTime(result.acquisition.receivedAt) : 'Registrado en almacén') + '</div>' +

              '</div>' +

              '<div style="background:var(--surface);padding:14px;border-radius:10px;border:1px solid var(--border)">' +
                '<h4 style="margin-bottom:10px;display:flex;align-items:center;gap:6px">' + I.cart + ' Venta en POS & Cliente</h4>' +
                (result.sale
                  ? '<div style="line-height:1.6;font-size:13px">' +
                      '<div><b>Cliente:</b> ' + esc(result.sale.customerName) + '</div>' +
                      '<div><b>Cédula / RIF:</b> <span class="mono font-bold">' + esc(result.sale.customerDoc) + '</span></div>' +
                      '<div><b>Orden POS / Factura:</b> <span class="mono">' + esc(result.sale.orderNumber) + '</span></div>' +
                      '<div><b>Fecha de Venta:</b> ' + fmtDateTime(result.sale.soldAt) + '</div>' +
                      '<div><b>Precio Facturado:</b> $' + Number(result.sale.salePriceUsd || result.product.priceUsd).toFixed(2) + '</div>' +
                    '</div>'
                  : '<div class="muted xs" style="padding:10px 0">Este equipo aún no ha sido facturado a ningún cliente. Permanece en el almacén disponible para despacho.</div>') +

                '<h4 style="margin:14px 0 8px 0;display:flex;align-items:center;gap:6px">' + I.shield + ' Estado de Garantía</h4>' +
                '<div style="line-height:1.6;font-size:13px">' +
                  '<div><b>Cobertura:</b> ' + (result.warranty ? result.warranty.warrantyMonths : 12) + ' Meses Oficiales</div>' +
                  '<div><b>Estatus:</b> <span class="badge ' + (result.warranty && result.warranty.isWarrantyActive ? 'b-ok' : (result.sale ? 'b-bad' : 'b-mut')) + '">' + esc(result.warranty ? result.warranty.warrantyStatusLabel : 'En Stock') + '</span></div>' +
                  (result.warranty && result.warranty.isWarrantyActive
                    ? '<div style="margin-top:8px">' +
                        '<div class="spread xs" style="margin-bottom:4px"><span>Días de garantía restantes</span><b>' + result.warranty.daysRemaining + ' días</b></div>' +
                        '<div class="bar"><i data-w="' + Math.min(100, Math.round((result.warranty.daysRemaining / ((result.warranty.warrantyMonths || 12) * 30)) * 100)) + '"></i></div>' +
                      '</div>'
                    : '') +
                '</div>' +
              '</div>' +
            '</div>' +

            (result.rma
              ? '<div style="margin-top:14px;padding:12px;background:rgba(245,158,11,0.08);border:1px dashed var(--warn);border-radius:8px">' +
                  '<div class="spread">' +
                    '<b>🛡️ Historial de Devolución / RMA: ' + esc(result.rma.rmaNumber) + '</b>' +
                    '<span class="badge b-warn xs">' + esc(result.rma.rmaResolution || 'TRAMITADO') + '</span>' +
                  '</div>' +
                  '<div class="xs muted" style="margin-top:4px">' +
                    '<b>Fecha:</b> ' + fmtDateTime(result.rma.rmaDate) + ' · <b>Diagnóstico / Notas:</b> ' + esc(result.rma.rmaNotes || 'Sin notas adicionales') +
                  '</div>' +
                '</div>'
              : '') +
          '</div>'
        : '') +

      '<div class="tbl-scroll">' +
        '<table class="tbl">' +
          '<thead>' +
            '<tr>' +
              '<th>Número de Serie</th>' +
              '<th>Producto / SKU</th>' +
              '<th>Lote</th>' +
              '<th>Estado</th>' +
              '<th>Cliente Destino</th>' +
              '<th>Garantía</th>' +
              '<th>RMA / Caso</th>' +
              '<th>Acciones</th>' +
            '</tr>' +
          '</thead>' +
          '<tbody>' +
            (serials.map(function(s) {
              var stBadge = s.status === 'IN_STOCK' ? '<span class="badge b-info xs">📦 EN STOCK</span>' :
                            s.status === 'SOLD' ? '<span class="badge b-ok xs">✔️ VENDIDO</span>' :
                            s.status === 'REPLACED' ? '<span class="badge b-acc xs">🔄 REEMPLAZO</span>' :
                            '<span class="badge b-warn xs">' + esc(s.status) + '</span>';

              var rmaLabel = s.rmaNumber ? '<b class="mono xs" style="color:var(--warn)">' + esc(s.rmaNumber) + ' (' + esc(s.rmaResolution || 'RMA') + ')</b>' : '<span class="xs muted">-</span>';

              return '<tr>' +
                '<td data-l="Serial"><b class="mono sm" style="color:var(--accent)">' + esc(s.serialNumber) + '</b></td>' +
                '<td data-l="Producto"><b>' + esc(s.product ? s.product.name : 'Herramienta') + '</b><br><span class="xs muted mono">' + (s.product ? s.product.sku : '') + '</span></td>' +
                '<td data-l="Lote"><span class="mono xs">' + esc(s.lotNumber || 'GENERAL') + '</span></td>' +
                '<td data-l="Estado">' + stBadge + '</td>' +
                '<td data-l="Cliente"><span class="sm font-medium">' + esc(s.customerName || (s.status === 'IN_STOCK' ? 'Almacén Central' : 'Cliente Mostrador')) + '</span><br><span class="xs muted mono">' + esc(s.customerDoc || '') + '</span></td>' +
                '<td data-l="Garantía"><span class="mono xs">' + (s.warrantyMonths || 12) + ' meses</span></td>' +
                '<td data-l="RMA">' + rmaLabel + '</td>' +
                '<td data-l="Acciones">' +
                  '<div class="wrap-row" style="gap:4px">' +
                    '<button class="btn btn-xs btn-ghost" type="button" data-action="lookup-serial-action" data-sn="' + esc(s.serialNumber) + '">🔍 Ficha 360°</button>' +
                    (s.status === 'SOLD' ? '<button class="btn btn-xs btn-soft" type="button" data-action="open-rma-modal" data-sn="' + esc(s.serialNumber) + '">🛡️ RMA</button>' : '') +
                  '</div>' +
                '</td>' +
              '</tr>';
            }).join('') || '<tr><td colspan="8" class="center muted" style="padding:24px">No hay equipos serializados registrados.</td></tr>') +
          '</tbody>' +
        '</table>' +
      '</div>' +
    '</div>' +
  '</div>';
}
