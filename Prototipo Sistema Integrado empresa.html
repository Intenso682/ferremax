/* ---- Facturación & Gestión de Caja (Cortes X y Z + Comprobantes + Notas de Entrega a Factura + Libro SENIAT) ---- */
Views.facturacion=function(){
  var bcv = BCV_RATE || 877.90;
  var currentTab = State.ui.billingTab || 'cortes';
  var zList = CASH_CLOSES_LIST.filter(function(c){ return c.type === 'Z'; });
  var xList = CASH_CLOSES_LIST.filter(function(c){ return c.type === 'X'; });
  var totUsd = CASH_CLOSES_LIST.reduce(function(a,b){ return a + (Number(b.totalSalesUsd) || 0); }, 0);
  var totBs = CASH_CLOSES_LIST.reduce(function(a,b){ return a + (Number(b.totalSalesBs) || 0); }, 0);
  var diffCount = zList.filter(function(c){ return Math.abs(Number(c.diffUsd || 0)) > 0.01; }).length;
  var cuadrePct = zList.length ? Math.round(((zList.length - diffCount) / zList.length) * 100) : 100;

  var ordersList = DB.orders || [];
  var ordersTotUsd = ordersList.reduce(function(a,b){ return a + (Number(b.total) || 0); }, 0);
  var ordersTotBs = Math.round(ordersTotUsd * bcv * 100) / 100;

  var pendingNotes = getPendingDeliveryNotes();
  var fiscalInvoices = getFiscalInvoices();

  return '<div class="page-head">' +
    '<div>' +
      '<h1>Facturación & Gestión de Caja</h1>' +
      '<p>Auditoría contable (Cortes X y Z) · Notas de Entrega a Factura · Libro Especial de Ventas SENIAT</p>' +
    '</div>' +
    '<div class="wrap-row" style="gap:8px">' +
      '<button class="btn btn-ghost btn-sm" type="button" data-action="refresh-billing-module">' + I.refresh + ' Actualizar</button>' +
      '<a class="btn btn-ghost btn-sm" href="' + API_URL + '/fiscal/sales-book/export-csv" target="_blank" download="Libro_Ventas_SENIAT.csv">' + I.dl + ' Libro SENIAT CSV</a>' +
      '<button class="btn btn-soft btn-sm" type="button" data-action="open-corte-x-modal">' + I.clock + ' Auditoría (Corte X)</button>' +
      '<button class="btn btn-primary btn-sm" type="button" data-action="open-corte-modal">' + I.lock + ' Cierre (Corte Z)</button>' +
    '</div>' +
  '</div>' +

  /* Tabs de navegación */
  '<div class="tabs" style="margin-bottom:18px">' +
    '<button class="tab-btn ' + (currentTab === 'cortes' ? 'on' : '') + '" type="button" data-action="switch-billing-tab" data-tab="cortes">' + I.lock + ' Auditoría Cortes (X y Z) <span class="badge b-mut" style="margin-left:6px">' + CASH_CLOSES_LIST.length + '</span></button>' +
    '<button class="tab-btn ' + (currentTab === 'comprobantes' ? 'on' : '') + '" type="button" data-action="switch-billing-tab" data-tab="comprobantes">' + I.receipt + ' Comprobantes Emitidos <span class="badge b-mut" style="margin-left:6px">' + ordersList.length + '</span></button>' +
    '<button class="tab-btn ' + (currentTab === 'notas_entrega' ? 'on' : '') + '" type="button" data-action="switch-billing-tab" data-tab="notas_entrega">📝 Notas de Entrega a Factura <span class="badge b-mut" style="margin-left:6px">' + pendingNotes.length + '</span></button>' +
    '<button class="tab-btn ' + (currentTab === 'libro_seniat' ? 'on' : '') + '" type="button" data-action="switch-billing-tab" data-tab="libro_seniat">📖 Libro de Ventas SENIAT <span class="badge b-mut" style="margin-left:6px">' + fiscalInvoices.length + '</span></button>' +
    '<button class="tab-btn ' + (currentTab === 'conciliacion' ? 'on' : '') + '" type="button" data-action="switch-billing-tab" data-tab="conciliacion">🏦 Conciliación Bancaria TXT/CSV</button>' +
  '</div>' +

  (currentTab === 'cortes'
    ? (
      '<div class="kpi-grid" style="margin-bottom:18px">' +
        kpiNum('Cierres Registrados', zList.length, xList.length + ' auditorías X activas', 'up', 'lock', 'var(--accent)', 'var(--accent-soft)', [30, 42, 50, 60, 68, 75, 82], '') +
        kpiMoney('Total Recaudado ($)', totUsd, 'En turnos cerrados', 'up', 'receipt', 'var(--ok)', 'var(--ok-soft)', [40, 48, 55, 62, 70, 78, 86], '') +
        kpiMoney('Equivalente Bolívares', totBs, 'Tasa BCV: Bs. ' + bcv.toFixed(2), 'up', 'chart', 'var(--info)', 'var(--info-soft)', [40, 46, 52, 60, 68, 74, 80], '', 'Bs. ') +
        kpiNum('Confiabilidad Arqueo', cuadrePct, (diffCount === 0 ? 'Sin descuadres' : diffCount + ' con discrepancias'), (diffCount === 0 ? 'up' : 'down'), 'shield', (diffCount === 0 ? 'var(--ok)' : 'var(--warn)'), (diffCount === 0 ? 'var(--ok-soft)' : 'var(--warn-soft)'), [90, 92, 95, 96, 98, 99, 100], '%', '') +
      '</div>' +

      '<div class="card" style="margin-bottom:20px">' +
        '<div class="card-head" style="flex-wrap:wrap;gap:12px">' +
          '<div>' +
            '<h3>Historial y Auditoría de Gaveta</h3>' +
            '<p class="card-sub">Consulta balances históricos, arqueos físicos de efectivo y pagos electrónicos multimoneda</p>' +
          '</div>' +
          '<div class="wrap-row" style="gap:8px">' +
            '<div class="filter-chips">' +
              '<button class="chip ' + (State.ui.cashHistoryType === 'ALL' && !State.ui.cashHistoryDiffOnly ? 'on' : '') + '" type="button" data-action="filter-corte-type" data-t="ALL">Todos (' + CASH_CLOSES_LIST.length + ')</button>' +
              '<button class="chip ' + (State.ui.cashHistoryType === 'Z' && !State.ui.cashHistoryDiffOnly ? 'on' : '') + '" type="button" data-action="filter-corte-type" data-t="Z">Solo Cortes Z (' + zList.length + ')</button>' +
              '<button class="chip ' + (State.ui.cashHistoryType === 'X' && !State.ui.cashHistoryDiffOnly ? 'on' : '') + '" type="button" data-action="filter-corte-type" data-t="X">Solo Cortes X (' + xList.length + ')</button>' +
              '<button class="chip ' + (State.ui.cashHistoryDiffOnly ? 'on' : '') + '" type="button" data-action="filter-corte-diff">⚠️ Con Descuadre (' + diffCount + ')</button>' +
            '</div>' +
            '<div style="position:relative;min-width:240px">' +
              '<input class="input sm" id="corte-search-q" placeholder="Buscar folio, cajero o notas…" value="' + esc(State.ui.cashHistoryQ || '') + '" style="padding-left:32px">' +
              '<span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none">' + I.search + '</span>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div id="cash-close-table-container">' +
          renderCashCloseTableRows() +
        '</div>' +
      '</div>'
    )
    : currentTab === 'notas_entrega'
    ? renderDeliveryNotesSection()
    : currentTab === 'libro_seniat'
    ? renderSeniatSalesBookSection()
    : currentTab === 'conciliacion'
    ? renderBankReconciliationSection()
    : (
      '<div class="kpi-grid" style="margin-bottom:18px">' +
        kpiMoney('Facturado en Órdenes ($)', ordersTotUsd, ordersList.length + ' comprobantes emitidos', 'up', 'receipt', 'var(--accent)', 'var(--accent-soft)', [44, 52, 60, 58, 70, 76, 84], '') +
        kpiMoney('En Bolívares (BCV)', ordersTotBs, 'Tasa oficial BCV: Bs. ' + bcv.toFixed(2), 'up', 'chart', 'var(--info)', 'var(--info-soft)', [40, 46, 52, 60, 68, 74, 80], '', 'Bs. ') +
        kpiNum('Entregados / Pagados', ordersList.length, '100% digital sin papel fiscal', 'up', 'check', 'var(--ok)', 'var(--ok-soft)', [50, 54, 58, 60, 64, 68, 72], '') +
        kpiNum('WhatsApp Directo', ordersList.length, 'Comprobante y QR al instante', 'up', 'wa', 'var(--ok)', 'var(--ok-soft)', [80, 78, 76, 74, 72, 70, 68], '') +
      '</div>' +

      '<div class="card">' +
        '<div class="card-head">' +
          '<div>' +
            '<h3>Comprobantes Electrónicos de Entrega</h3>' +
            '<p class="card-sub">Historial de notas de entrega y facturas digitales generadas por el POS</p>' +
          '</div>' +
          '<span class="badge b-ok"><i class="dot pulse"></i> Sistema Digital Activo</span>' +
        '</div>' +
        '<div class="tbl-scroll">' +
          '<table class="tbl">' +
            '<thead>' +
              '<tr>' +
                '<th>Folio</th>' +
                '<th>Cliente / Identificación</th>' +
                '<th>Fecha & Hora</th>' +
                '<th>Método de Pago</th>' +
                '<th>Total USD</th>' +
                '<th>Total Bs. (BCV)</th>' +
                '<th>Estado</th>' +
                '<th style="text-align:right">Acciones</th>' +
              '</tr>' +
            '</thead>' +
            '<tbody>' +
              (ordersList.map(function(o) {
                var oBs = Math.round(o.total * bcv * 100) / 100;
                return '<tr>' +
                  '<td data-l="Folio"><b class="mono">' + esc(o.folio) + '</b><br><span class="xs muted mono">ID ' + esc(o.id) + '</span></td>' +
                  '<td data-l="Cliente"><b>' + esc(o.customer) + '</b><br><span class="xs muted mono">' + esc(o.customerDoc || 'V-00000000') + '</span></td>' +
                  '<td data-l="Fecha"><span class="xs muted">' + fmtDateTime(o.date) + '</span></td>' +
                  '<td data-l="Pago"><span class="badge b-info">' + esc(o.pay || 'Efectivo USD') + '</span></td>' +
                  '<td data-l="Total USD"><b class="mono sm" style="color:var(--accent)">$ ' + Number(o.total || 0).toFixed(2) + '</b></td>' +
                  '<td data-l="Total Bs."><b class="mono sm" style="color:var(--ok)">Bs. ' + oBs.toLocaleString('es-VE', {minimumFractionDigits:2}) + '</b></td>' +
                  '<td data-l="Estado"><span class="badge b-ok">' + (o.status || 'pagada') + '</span></td>' +
                  '<td data-l="Acciones" style="text-align:right">' +
                    '<div class="row" style="gap:5px;justify-content:flex-end">' +
                      '<button class="btn btn-sm btn-ghost" type="button" data-action="view-receipt" data-folio="' + esc(o.folio) + '" title="Ver Comprobante Digital">' + I.eye + '</button>' +
                      '<button class="btn btn-sm btn-ghost" type="button" data-action="wa-ticket" data-folio="' + esc(o.folio) + '" title="Enviar WhatsApp">' + I.wa + '</button>' +
                      '<button class="btn btn-sm btn-ghost" type="button" data-action="dl-receipt-png" data-folio="' + esc(o.folio) + '" title="Descargar Imagen PNG">' + I.download + '</button>' +
                      '<button class="btn btn-sm btn-ghost" type="button" data-action="print-ticket" data-folio="' + esc(o.folio) + '" title="Imprimir Comprobante">' + I.print + '</button>' +
                    '</div>' +
                  '</td>' +
                '</tr>';
              }).join('') || '<tr><td colspan="8" style="text-align:center;padding:30px" class="muted">No se registran comprobantes de entrega aún.</td></tr>') +
            '</tbody>' +
          '</table>' +
        '</div>' +
      '</div>'
    )
  );
};

function openConsolidateNotesModal(selectedIds) {
  var bcv = BCV_RATE || 877.90;
  var notes = getPendingDeliveryNotes();
  var ids = (selectedIds && selectedIds.length) ? selectedIds : (FISCAL_STATE.selectedNoteIds || []);
  var targetNotes = notes.filter(function(n){ return ids.indexOf(n.id) >= 0; });

  if (!targetNotes.length) {
    showToast('Selecciona al menos una nota de entrega para consolidar.', 'warn', 'Notas Requeridas');
    return;
  }

  var firstClient = targetNotes[0].customerName;
  var firstDoc = targetNotes[0].customerDoc;
  var totUsd = targetNotes.reduce(function(a, b){ return a + (b.totalUsd || b.total || 0); }, 0);
  var totBs = Math.round(totUsd * bcv * 100) / 100;

  openModal(
    '<div class="card-head"><div><h3>Consolidar Notas de Entrega a Factura Fiscal</h3><p class="card-sub">Emisión legal SENIAT con correlativo y número de control automático</p></div>' +
    '<button class="icon-btn" type="button" data-action="close-overlay">' + I.x + '</button></div>' +
    '<div style="padding:20px">' +
      '<div style="background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:16px">' +
        '<div class="spread" style="margin-bottom:6px"><span>Cliente Facturación:</span><b>' + esc(firstClient) + '</b></div>' +
        '<div class="spread" style="margin-bottom:6px"><span>RIF / Cédula:</span><b class="mono">' + esc(firstDoc) + '</b></div>' +
        '<div class="spread" style="margin-bottom:6px"><span>Despachos a Consolidar:</span><b class="mono">' + targetNotes.map(function(n){ return n.orderNumber || n.folio; }).join(', ') + '</b></div>' +
        '<div class="spread" style="border-top:1px dashed var(--border);padding-top:8px;margin-top:8px">' +
          '<span><b>Monto Total a Facturar:</b></span>' +
          '<b class="mono sm" style="color:var(--accent)">$ ' + totUsd.toFixed(2) + ' (Bs. ' + totBs.toLocaleString('es-VE', {minimumFractionDigits:2}) + ')</b>' +
        '</div>' +
      '</div>' +

      '<div class="grid grid-form-2col" style="grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">' +
        '<div><label class="lbl">Método de Pago Final</label>' +
          '<select class="input" id="cf-modal-pay">' +
            '<option value="TRANSFERENCIA">Transferencia Bancaria Nacional</option>' +
            '<option value="PAGO_MOVIL">Pago Móvil Interbancario</option>' +
            '<option value="EFECTIVO_USD">Efectivo Divisas ($)</option>' +
            '<option value="CREDITO">Crédito Comercial (Cuentas por Cobrar)</option>' +
          '</select>' +
        '</div>' +
        '<div><label class="lbl">Retención de IVA (Si es Agente)</label>' +
          '<select class="input" id="cf-modal-ret">' +
            '<option value="0">Sin retención (0%)</option>' +
            '<option value="75" selected>Agente de Retención 75%</option>' +
            '<option value="100">Agente de Retención 100%</option>' +
          '</select>' +
        '</div>' +
      '</div>' +

      '<div style="margin-bottom:14px">' +
        '<label class="lbl">N° Comprobante de Retención (Si aplica)</label>' +
        '<input class="input mono" id="cf-modal-ret-no" placeholder="Ej: 20261000000045">' +
      '</div>' +

      '<div style="margin-bottom:14px">' +
        '<label class="lbl">Notas / Observaciones en Factura</label>' +
        '<input class="input" id="cf-modal-notes" placeholder="Despachos consolidados obra...">' +
      '</div>' +

      '<div class="sec-note">' +
        I.shield + '<span>Esta acción generará el correlativo oficial <b>FAC-xxxx</b>, creará el asiento en el <b>Libro Especial de Ventas</b> y cambiará el estado de los despachos a FACTURADO.</span>' +
      '</div>' +
    '</div>' +
    '<div class="dr-foot row" style="justify-content:flex-end;gap:10px">' +
      '<button class="btn btn-ghost" type="button" data-action="close-overlay">Cancelar</button>' +
      '<button class="btn btn-primary" type="button" id="btn-submit-consolidate">' + I.check + ' Emitir Factura Fiscal SENIAT</button>' +
    '</div>'
  );

  var btn = $('#btn-submit-consolidate');
  if (btn) {
    btn.onclick = async function() {
      var pay = $('#cf-modal-pay').value;
      var retPct = parseFloat($('#cf-modal-ret').value || '0');
      var retNo = ($('#cf-modal-ret-no').value || '').trim();
      var notesTxt = ($('#cf-modal-notes').value || '').trim();

      btn.disabled = true;
      btn.textContent = 'Generando Factura SENIAT...';

      try {
        var resp = await fetch(API_URL + '/fiscal/consolidate-notes', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + (AUTH_TOKEN || '')
          },
          body: JSON.stringify({
            orderIds: ids,
            paymentMethod: pay,
            withholdingPercent: retPct,
            withholdingReceiptNo: retNo,
            notes: notesTxt
          })
        });

        var data = await resp.json();
        if (resp.ok) {
          showToast('Factura Fiscal ' + (data.invoiceNumber || 'FAC') + ' emitida exitosamente.', 'ok', 'Factura SENIAT');
          FISCAL_STATE.selectedNoteIds = [];
          closeOverlay();
          await loadFiscalData();
          render();
        } else {
          showToast(data.error || 'Error al consolidar factura.', 'err');
          btn.disabled = false;
          btn.textContent = 'Emitir Factura Fiscal SENIAT';
        }
      } catch(e) {
        showToast('Error de conexión: ' + e.message, 'err');
        btn.disabled = false;
        btn.textContent = 'Emitir Factura Fiscal SENIAT';
      }
    };
  }
}

      var whId = $('#np-modal-wh').value;

      var prodId = $('#np-modal-prod').value;
      var unit = ($('#np-modal-unit').value || 'UND').trim();

      var cost = parseFloat($('#np-modal-cost').value || '0');
      var freight = parseFloat($('#np-modal-freight').value || '0');
      var notes = ($('#np-modal-notes').value || '').trim();

      if (!billNo) {
        showToast('El N° de Factura del proveedor es obligatorio.', 'err');
        return;
      }

      var subtotal = qty * cost;
      var tax = Math.round(subtotal * 0.16 * 100) / 100;
      var total = subtotal + tax + freight;

      btn.disabled = true;
      btn.textContent = 'Procesando entrada...';

      try {
        var resp = await fetch(API_URL + '/purchases/bills', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + (AUTH_TOKEN || '')
          },
          body: JSON.stringify({
            supplierId: supId,
            billNumber: billNo,
            controlNumber: ctrlNo || '00-000000',
            subtotalUsd: subtotal,
            taxUsd: tax,
            totalUsd: total,
            freightCostUsd: freight,
            ivaWithholdingPercent: retPct,
            notes: notes,
            items: [{
              productId: prodId,
              purchaseUnit: unit,
              unitRatio: ratio,
              quantity: qty,
              unitCostUsd: cost,
              warehouseId: whId
            }]
          })
        });

        var data = await resp.json();
        if (resp.ok) {
          showToast('Factura de compra ' + billNo + ' guardada. Stock sumado al inventario.', 'ok', 'Compra Registrada');
          closeOverlay();
          await loadPurchasesData();
          await syncFromBackend();
          render();

          btn.disabled = false;
          btn.textContent = 'Procesar Entrada de Stock';
        }
      } catch(e) {
        showToast('Error de conexión: ' + e.message, 'err');
        btn.disabled = false;
        btn.textContent = 'Procesar Entrada de Stock';
      }
    };
  }
}

Views.nomina = function() {
  var bcv = BCV_RATE || 877.90;
  var currentTab = State.ui.payrollTab || 'personal';
  var employees = getEmployeesList();
  var periods = getPayrollPeriodsList();
  var audits = getPassiveAuditsList();

  var activeEmps = employees.filter(function(e){ return e.active !== false; });
  var totBaseUsd = activeEmps.reduce(function(a, b){ return a + Number(b.baseSalaryUsd || 0); }, 0);
  var totCestaUsd = activeEmps.reduce(function(a, b){ return a + Number(b.cestaTicketUsd || 40); }, 0);
  var quincenaEstUsd = (totBaseUsd + totCestaUsd) / 2;
  var quincenaEstBs = Math.round(quincenaEstUsd * bcv * 100) / 100;

  var totPassivesUsd = audits.reduce(function(a, b){ return a + Number(b.totalPassivesUsd || 0); }, 0);
  if (!totPassivesUsd && activeEmps.length) {
    // Estimación preliminar en base a antigüedad promedio
    totPassivesUsd = totBaseUsd * 2.5;
  }
  var totPassivesBs = Math.round(totPassivesUsd * bcv * 100) / 100;

  // Aportes Patronales Mensuales Estimados: FAOV (2%) + INCES (2%) + IVSS (~10%)
  var aportesPatronalesBs = Math.round((totBaseUsd * bcv * 0.14) * 100) / 100;

  return '<div class="page-head">' +
    '<div>' +
      '<h1>Personal & Nómina LOTTT</h1>' +
      '<p>Pasivos laborales bajo Art. 142 LOTTT, nómina quincenal cruzada con ventas POS y TXT oficiales (FAOV, INCES, IVSS)</p>' +
    '</div>' +
    '<div class="wrap-row" style="gap:8px">' +
      '<button class="btn btn-ghost btn-sm" type="button" data-action="refresh-payroll">' + I.refresh + ' Actualizar</button>' +
      '<button class="btn btn-soft btn-sm" type="button" data-action="open-calc-passive-modal">' + I.shield + ' Calcular Pasivo LOTTT</button>' +
      '<button class="btn btn-soft btn-sm" type="button" data-action="open-generate-payroll-modal">' + I.receipt + ' Generar Nómina Quincenal</button>' +
      '<button class="btn btn-primary btn-sm" type="button" data-action="open-new-employee-modal">' + I.plus + ' Registrar Empleado</button>' +
    '</div>' +
  '</div>' +

  /* Tabs de navegación */
  '<div class="tabs" style="margin-bottom:18px">' +
    '<button class="tab-btn ' + (currentTab === 'personal' ? 'on' : '') + '" type="button" data-action="switch-payroll-tab" data-tab="personal">' + I.users + ' Personal & Asistencia <span class="badge b-mut" style="margin-left:6px">' + activeEmps.length + '</span></button>' +
    '<button class="tab-btn ' + (currentTab === 'nomina_quincenal' ? 'on' : '') + '" type="button" data-action="switch-payroll-tab" data-tab="nomina_quincenal">' + I.receipt + ' Nómina Quincenal & Recibos <span class="badge b-mut" style="margin-left:6px">' + periods.length + '</span></button>' +
    '<button class="tab-btn ' + (currentTab === 'pasivos_lottt' ? 'on' : '') + '" type="button" data-action="switch-payroll-tab" data-tab="pasivos_lottt">' + I.shield + ' Prestaciones LOTTT (Art. 142) <span class="badge b-mut" style="margin-left:6px">' + audits.length + '</span></button>' +

    kpiMoney('Pasivo LOTTT Acumulado', totPassivesUsd, 'Provisión legal prestaciones', 'down', 'shield', 'var(--warn)', 'var(--warn-soft)', [1500, 1800, 2000, 2200, 2400, 2500, totPassivesUsd], '') +

  '</div>' +

  (currentTab === 'personal'
    ? renderEmployeesTab(activeEmps)

    ? renderPayrollPeriodsTab(periods, activeEmps)
    : currentTab === 'pasivos_lottt'
    ? renderLaborPassivesTab(audits, activeEmps)

};

/* ── TAB 1: Personal & Ficha de Trabajadores ── */
function renderEmployeesTab(employees) {
  var bcv = BCV_RATE || 877.90;
  if (!employees.length) {
    return '<div class="card" style="padding:32px;text-align:center">' +
      '<div style="font-size:36px;margin-bottom:8px">👥</div>' +
      '<h3>No hay empleados registrados</h3>' +

      '<button class="btn btn-primary" type="button" data-action="open-new-employee-modal">' + I.plus + ' Registrar Primer Empleado</button>' +
    '</div>';
  }

  return '<div class="card">' +
    '<div class="card-head spread">' +
      '<div><h3>Ficha de Personal & Condiciones Salariales</h3><p class="card-sub">Control de cargos, salarios de referencia en USD, comisiones POS y cuentas bancarias</p></div>' +

        '<span class="badge b-ok">' + employees.length + ' Activos</span>' +
      '</div>' +
    '</div>' +
    '<div class="table-wrap"><table class="tbl">' +
      '<thead><tr>' +
        '<th>Trabajador</th>' +
        '<th>Cargo & Departamento</th>' +
        '<th>Fecha Ingreso / Antigüedad</th>' +
        '<th>Sueldo Base ($ / Bs)</th>' +
        '<th>Cesta Ticket</th>' +
        '<th>Comisión POS</th>' +
        '<th>Banco & Cobro</th>' +
        '<th>Estado</th>' +
        '<th style="text-align:right">Acciones</th>' +
      '</tr></thead>' +
      '<tbody>' +
        employees.map(function(emp) {
          var hire = new Date(emp.hireDate);
          var now = new Date();
          var diffMonths = Math.max(0, Math.floor((now.getTime() - hire.getTime()) / (1000 * 60 * 60 * 24 * 30.4375)));

          var months = diffMonths % 12;
          var antLabel = (years > 0 ? years + 'a ' : '') + months + 'm';

          var sueldoBs = Math.round(emp.baseSalaryUsd * bcv * 100) / 100;
          var cestaBs = Math.round((emp.cestaTicketUsd || 40) * bcv * 100) / 100;
          var initials = ((emp.firstName || '').charAt(0) + (emp.lastName || '').charAt(0)).toUpperCase();

          return '<tr>' +
            '<td>' +
              '<div class="row" style="gap:10px">' +
                '<span class="avatar-sm" style="background:var(--surface-3);color:var(--text);font-weight:700;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:12px">' + initials + '</span>' +
                '<div>' +
                  '<b>' + esc(emp.firstName + ' ' + emp.lastName) + '</b>' +
                  '<div class="mono xs muted">' + esc(emp.docNumber) + '</div>' +
                '</div>' +
              '</div>' +
            '</td>' +
            '<td>' +
              '<b>' + esc(emp.position) + '</b>' +
              '<div class="xs muted">' + esc(emp.department) + '</div>' +
            '</td>' +
            '<td>' +
              '<span class="mono">' + hire.toLocaleDateString('es-VE') + '</span>' +
              '<span class="badge b-mut xs" style="margin-left:6px">' + antLabel + '</span>' +
            '</td>' +
            '<td>' +
              '<b class="mono" style="color:var(--accent)">$' + emp.baseSalaryUsd.toFixed(2) + '</b>' +
              '<div class="mono xs muted">Bs. ' + sueldoBs.toLocaleString('es-VE', {minimumFractionDigits:2}) + '</div>' +
            '</td>' +
            '<td>' +
              '<span class="mono">$' + (emp.cestaTicketUsd || 40).toFixed(2) + '</span>' +
              '<div class="mono xs muted">Bs. ' + cestaBs.toLocaleString('es-VE', {minimumFractionDigits:2}) + '</div>' +
            '</td>' +
            '<td>' +
              (emp.commissionPercent > 0
                ? '<span class="badge b-ok font-weight-bold">' + emp.commissionPercent.toFixed(1) + '% POS</span>'
                : '<span class="badge b-mut">0%</span>') +
            '</td>' +
            '<td>' +
              '<div><b>' + esc(emp.bankName || 'No asignado') + '</b></div>' +
              '<div class="mono xs muted">' + (emp.pagoMovilPhone ? 'PM: ' + esc(emp.pagoMovilPhone) : (emp.accountNumber ? 'Cta: ...' + emp.accountNumber.slice(-4) : '—')) + '</div>' +
            '</td>' +
            '<td><span class="badge b-ok">Activo</span></td>' +
            '<td style="text-align:right">' +
              '<div class="wrap-row" style="justify-content:flex-end;gap:6px">' +
                '<button class="btn btn-ghost btn-xs" type="button" data-action="open-calc-passive-modal" data-id="' + emp.id + '" title="Calcular Pasivos LOTTT Art. 142">⚖️ Pasivo</button>' +
                '<button class="btn btn-ghost btn-xs" type="button" data-action="open-edit-employee-modal" data-id="' + emp.id + '" title="Editar ficha de personal">✏️ Editar</button>' +
              '</div>' +
            '</td>' +

        }).join('') +

    '</table></div>' +

/* ── TAB 3: Prestaciones & Pasivos Laborales LOTTT (Art. 142) ── */

/* ---- Clientes & Cuentas por Cobrar (Crédito Comercial / Fiar) ---- */
function renderCustomersKpisHtml(isUpdate) {
  var bcv = BCV_RATE || 877.90;
  var list = DB.customers || [];
  var debtors = list.filter(function(c) {
    return (Number(c.currentDebt !== undefined ? c.currentDebt : c.currentDebtUsd) || 0) > 0.01;
  });
  var totalDebtUsd = debtors.reduce(function(acc, c) {
    return acc + (Number(c.currentDebt !== undefined ? c.currentDebt : c.currentDebtUsd) || 0);
  }, 0);
  var totalDebtBs = Math.round(totalDebtUsd * bcv * 100) / 100;
  var totalLimitUsd = list.reduce(function(acc, c) {
    return acc + (Number(c.creditLimitUsd !== undefined ? c.creditLimitUsd : c.creditLimit) || 0);
  }, 0);

  var html = kpiMoney('Deuda Total por Cobrar ($)', totalDebtUsd, debtors.length + ' clientes con saldo pendiente', (totalDebtUsd > 0 ? 'down' : 'up'), 'users', 'var(--warn)', 'var(--warn-soft)', [60, 68, 75, 78, 85, 90, 95], '') +
    kpiMoney('Equivalente Bolívares', totalDebtBs, 'Tasa BCV: Bs. ' + bcv.toFixed(2), 'up', 'chart', 'var(--accent)', 'var(--accent-soft)', [50, 56, 62, 70, 78, 84, 90], '', 'Bs. ') +
    kpiNum('Clientes con Deuda', debtors.length, debtors.length + ' de ' + list.length + ' clientes activos', (debtors.length > 0 ? 'down' : 'up'), 'clock', (debtors.length > 0 ? 'var(--danger)' : 'var(--ok)'), (debtors.length > 0 ? 'var(--danger-soft)' : 'var(--ok-soft)'), [10, 15, 20, 25, 30, 35, 40], '') +
    kpiMoney('Límites de Crédito Total', totalLimitUsd, 'Cupo autorizado de financiamiento', 'up', 'shield', 'var(--info)', 'var(--info-soft)', [70, 75, 80, 85, 90, 95, 100], '');

  if (isUpdate) {
    html = html.replace(/class="kpi rv"/g, 'class="kpi rv in"');
  }
  return html;
}

async function loadBannersFromAPI(){
  try{
    var r = await fetch(API_URL + '/marketing/banners');
    if(r.ok){
      var d = await r.json();
      if(Array.isArray(d) && d.length){
        MARKETING_STATE.banners = d;
      }
    }
    var rm = await fetch(API_URL + '/marketing/metrics');
    if(rm.ok){
      MARKETING_STATE.metrics = await rm.json();
    }
  }catch(e){
    console.warn('API de Marketing no responde, utilizando catálogo comercial local:', e);
  }
}

async function trackBannerClick(id, linkUrl){
  try{
    fetch(API_URL + '/marketing/banners/' + id + '/click', { method: 'POST' }).catch(function(){});
    var banner = (MARKETING_STATE.banners || []).find(function(b){ return b.id === id; });
    if(banner) banner.clicksCount = (banner.clicksCount || 0) + 1;
  }catch(e){}
  if(linkUrl){
    if(linkUrl.indexOf('http://') === 0 || linkUrl.indexOf('https://') === 0){
      window.open(linkUrl, '_blank');
    } else {
      go(linkUrl.replace(/^#/, ''));
    }
  }
}

async function saveBannerToAPI(bannerData, id){
  try{
    var url = id ? (API_URL + '/marketing/banners/' + id) : (API_URL + '/marketing/banners');
    var method = id ? 'PUT' : 'POST';
    var resp = await fetch(url, {
      method: method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(bannerData)
    });
    if(resp.ok){
      showToast(id ? 'Banner actualizado exitosamente' : 'Nuevo espacio publicitario creado', 'ok', 'Publicidad');
      closeOverlay();
      await loadBannersFromAPI();
      render();
    } else {
      var err = await resp.json().catch(function(){ return {}; });
      showToast(err.error || 'Error al guardar banner', 'err', 'Publicidad');
    }
  }catch(e){
    showToast('Error de conexión: ' + e.message, 'err', 'Publicidad');
  }
}

async function toggleBannerActive(id, active){
  try{
    var resp = await fetch(API_URL + '/marketing/banners/' + id, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ active: active })
    });
    if(resp.ok){
      showToast(active ? 'Banner comercial activado' : 'Banner comercial pausado', 'ok', 'Publicidad');
    }
  }catch(e){
    console.warn('Error al actualizar estado:', e);
  }
}

async function deleteBannerFromAPI(id){
  try{
    var resp = await fetch(API_URL + '/marketing/banners/' + id, { method: 'DELETE' });
    if(resp.ok){
      showToast('Banner comercial eliminado', 'ok', 'Publicidad');
      await loadBannersFromAPI();
      render();
    }
  }catch(e){
    showToast('Error al eliminar banner: ' + e.message, 'err', 'Publicidad');
  }
}

var timers=[], ignoreHash=false;
function clearTimers(){ timers.forEach(function(t){ clearTimeout(t); clearInterval(t); }); timers=[]; }
function go(path){
  if(typeof path!=='string') path='/';
  if(path.charAt(0)!=='/') path='/'+path;
  State.path=path;
  try{ ignoreHash=true; location.hash='#'+path; }catch(e){ /* sandbox: seguimos con routing interno */ }
  setTimeout(function(){ ignoreHash=false; },80);
  render();
}
window.addEventListener('hashchange',function(){
  if(ignoreHash) return;
  State.path=(location.hash||'#/').replace(/^#/,'')||'/';
  render();
});
function parsePath(){
  var h=(State.path||'/').replace(/^\//,'');
  var parts=h.split('?'), qs=parts[1]||'';
  return {parts:parts[0].split('/').filter(Boolean), params:new URLSearchParams(qs)};
}
function render(){
  hideTooltip();
  var r=parsePath(), parts=r.parts, app=$('#app');
  clearTimers(); endTour(true);
  if(parts[0]==='admin'){
    if(!State.session){ go('/login'); return; }
    var mid=parts[1]||'';
    if(!mid){
      go(getRoleHome(State.session.role));
      return;
    }
    if(!MOD_LABEL[mid]) mid='dashboard';
    if(!canAccess(mid)){
      var userRoleLabel = State.session.roleDisplayName || ROLE_MAP[State.session.role] || State.session.role;
      var moduleLabel = MOD_LABEL[mid] ? MOD_LABEL[mid].label : mid;
      showToast('Acceso restringido: el rol ' + userRoleLabel + ' no tiene permiso para ingresar a ' + moduleLabel + '.', 'warn', 'Permiso denegado');
      go(getRoleHome(State.session.role));
      return;
    }
    State.module=mid;
    setSEO({title:(MOD_LABEL[mid].label)+' · Panel FerreMax'});
    app.innerHTML=adminShell(skeletonPage(),mid);
    refreshBadges();
    timers.push(setTimeout(function(){
      var page=$('#page'); if(!page) return;
      var body;
      try{ body=canAccess(mid)?Views[mid]():viewLocked(mid); }
      catch(err){ body=viewModuleError(mid,err); if(DEV_ERRORS) showToast('Fallo en módulo '+mid+': '+err.message,'err','Error boundary'); }
      page.innerHTML=body;
      afterAdminRender(mid);
    },220));
    return;
  }
  if(parts[0]==='login'){ app.innerHTML=viewLogin(); afterStoreRender(); return; }
  if(parts[0]==='productos'){
    if(r.params.get('ofertas')) State.ui.onlyOffers=true;
    app.innerHTML=parts[1]?viewProduct(parts[1]):viewCatalog();
    afterStoreRender(); return;
  }
  if(['nosotros','envios','devoluciones','faq','facturacion','aviso','terminos','seguridad-info','sitemap'].indexOf(parts[0])>=0){
    app.innerHTML=viewStatic(parts[0]); afterStoreRender(); return; }
  app.innerHTML=viewHome(); afterStoreRender();
}

    '<div class="kpi-grid">'+[0,1,2,3].map(function(){return '<div class="sk" style="height:112px"></div>';}).join('')+'</div>'+
    '<div class="sk" style="height:280px"></div></div>';
}

  if(hs){ var onScroll=function(){ hs.classList.toggle('scrolled',scrollY>10); }; onScroll(); window.addEventListener('scroll',onScroll,{passive:true}); }
  var gq=$('#global-q');
  if(gq){
    gq.addEventListener('input',function(e){ State.ui.q=e.target.value; liveSearch(e.target.value); });
    gq.addEventListener('focus',function(e){ if(e.target.value) liveSearch(e.target.value); });
    gq.addEventListener('keydown',function(e){

        var i=items.findIndex(function(x){return x.classList.contains('sel');});

        items.forEach(function(x){x.classList.remove('sel');}); if(items[i]) items[i].classList.add('sel'); }
      if(e.key==='Enter'){ e.preventDefault(); var sel=$('.sd-item.sel')||items[0]; if(sel) sel.click(); else go('/productos'); }
      if(e.key==='Escape'){ var b=$('#search-results'); if(b) b.innerHTML=''; }

  }
  var cq=$('#cat-q'); if(cq) cq.addEventListener('input',function(e){ State.ui.q=e.target.value; rerenderKeep(); });
  var pr=$('#price-range'); if(pr) pr.addEventListener('input',function(e){ State.ui.priceMax=+e.target.value; $('#price-out').textContent=money(State.ui.priceMax); clearTimeout(window.__pr); window.__pr=setTimeout(rerenderKeep,260); });

  var pq=$('#pos-q'); if(pq) pq.addEventListener('input',function(e){ State.ui.posQ=e.target.value; refreshPosGrid(); });

  var ic=$('#inv-cat'); if(ic) ic.addEventListener('change',function(e){ State.ui.invCat=e.target.value; render(); });
  var ist=$('#inv-state'); if(ist) ist.addEventListener('change',function(e){ State.ui.invState=e.target.value; render(); });
  bindForms();

function rerenderKeep(){

    :'<div class="sd-item"><div style="flex:1"><b class="sm">No encontramos “'+esc(q)+'”</b><span class="xs muted">¿Lo pedimos por WhatsApp?</span></div>'+

function bindForms(){
  $$('[data-form]').forEach(function(f){
    if(f.dataset.bound) return; f.dataset.bound='1';
    f.addEventListener('submit',function(e){
      e.preventDefault();
      var kind=f.getAttribute('data-form'), data={};
      new FormData(f).forEach(function(v,k){ data[k]=String(v).trim(); });
      if(kind==='login'){
        if(!data.email || !data.password){ showToast('Por favor ingresa correo y contraseña.','err','Campos requeridos'); return; }
        if(data.password.length<6){ showToast('La contraseña debe tener al menos 6 caracteres.','err','Acceso denegado'); return; }
        doLogin(null, data.email, data.password);
        return;
      }
      if(kind==='newsletter'){
        if(!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(data.email)){ showToast('Ese correo no parece válido.','err','Revisa el dato'); return; }
        Bus.emit('crm.suscripcion',data.email,{module:'marketing'});
        showToast('¡Listo! Te enviaremos ofertas y fichas técnicas.','ok','Suscripción confirmada'); f.reset();
      }
      if(kind==='product') saveProduct(data);
      if(kind==='customer') newCustomer(data);
      if(kind==='coupon') newCoupon(data);
    });
  });
}

document.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('[data-action]'):null; if(!t) return;
  var a=t.getAttribute('data-action');
  if(a==='modal-scrim'){ if(e.target.classList.contains('modal')) closeOverlay(); return; }
  try{ handleAction(a,t,e); }
  catch(err){ if(DEV_ERRORS) showToast(err.message,'err','Acción fallida'); }
});
function handleAction(a,el,e){
  hideTooltip();
  var D=(el&&el.dataset)||{};
  switch(a){
    /* navegación */
    case 'go': if(e) e.preventDefault(); endTour(true); go(D.to||'/'); break;
    case 'nav-cat': if(e) e.preventDefault(); State.ui.onlyOffers=false; State.ui.catFilter=[D.cat]; State.ui.q=''; go('/productos'); break;
    case 'nav-ofertas': if(e) e.preventDefault(); State.ui.onlyOffers=true; State.ui.catFilter=[]; State.ui.q=''; go('/productos'); break;
    case 'search-all': State.ui.q=($('#global-q')||{}).value||''; var sr=$('#search-results'); if(sr) sr.innerHTML=''; go('/productos'); break;
    case 'admin-nav': if(e) e.preventDefault(); var root=$('#admin-root'); if(root) root.classList.remove('mob-open');
      closeAllOverlays();
      if(!canAccess(D.m)){
        var navRole = State.session ? (State.session.roleDisplayName || ROLE_MAP[State.session.role] || State.session.role) : 'Invitado';
        var navMod = MOD_LABEL[D.m] ? MOD_LABEL[D.m].label : D.m;
        showToast('Acceso restringido: el rol ' + navRole + ' no tiene permisos para el módulo ' + navMod + '.', 'warn', 'Módulo Bloqueado');
        return;
      }
      if(('/admin/'+D.m)===State.path) render(); else go('/admin/'+D.m); break;
    case 'scroll-to': var tgt=document.getElementById(D.to); if(tgt) tgt.scrollIntoView({behavior:'smooth',block:'start'}); break;
    case 'render': render(); break;
    case 'refresh-bcv':
      showToast('Sincronizando tasa oficial con el BCV...', 'info', 'Banco Central de Venezuela');
      var reqH = AUTH_TOKEN ? { 'Authorization': 'Bearer ' + AUTH_TOKEN } : {};
      fetch(API_URL + '/rates/bcv/sync', { method: 'POST', headers: reqH })
        .then(function(res){
          if(res.ok) return res.json();
          return fetch(API_URL + '/rates/bcv').then(function(r2){ return r2.json(); });
        })
        .then(function(data){
          if(data && data.rate && data.rate >= 100){
            BCV_RATE = data.rate;
            render();
            showToast('Tasa Oficial BCV actualizada: Bs. ' + BCV_RATE.toFixed(2) + ' / USD', 'ok', 'BCV en Línea');
          } else {
            showToast('Tasa activa: Bs. ' + BCV_RATE.toFixed(2) + ' / USD', 'info', 'Tasa BCV');
          }
        })
        .catch(function(){
          showToast('Tasa activa: Bs. ' + BCV_RATE.toFixed(2) + ' / USD', 'info', 'Tasa BCV');
        });
      break;
    /* tema / ui */
    case 'toggle-theme': State.theme=State.theme==='light'?'dark':'light'; LS.set('cb-theme',State.theme); applyThemeTokens(); closeAllOverlays(); hideTooltip(); render(); break;
    case 'set-accent': State.accent=D.c; LS.set('cb-accent',D.c); applyThemeTokens();
      Bus.emit('ajustes.token','color de marca → '+D.c,{module:'core'});
      showToast('Token de color actualizado en tienda y panel.','ok','Design system'); render(); break;
    case 'toggle-help': State.ui.help=!State.ui.help; LS.set('cb-help',State.ui.help);
      showToast(State.ui.help?'Tooltips activados: pasa el cursor sobre los elementos con línea punteada.':'Tooltips desactivados.','info','Guías'); render(); break;
    case 'toggle-dev-modules': State.ui.showDevModules = !State.ui.showDevModules; LS.set('cb-show-dev', State.ui.showDevModules);
      showToast(State.ui.showDevModules ? 'Modo Desarrollador activado: maquetas técnicas visibles en el menú lateral.' : 'Modo Producción activo: menú limpio con herramientas operativas.', 'info', 'Entorno'); render(); break;
    case 'toggle-generic': el.classList.toggle('on'); el.setAttribute('aria-checked',el.classList.contains('on'));
      showToast('Preferencia guardada.','ok','Ajustes'); break;
    case 'toggle-dense': el.classList.toggle('on');
      $$('.tbl td').forEach(function(td){ td.style.padding=el.classList.contains('on')?'7px 14px':''; });
      showToast(el.classList.contains('on')?'Densidad compacta activada.':'Densidad normal.','info','Ajustes'); break;
    case 'toggle-mini': State.ui.sidebar=!State.ui.sidebar; LS.set('cb-mini',State.ui.sidebar);
      var ar=$('#admin-root'); if(ar) ar.classList.toggle('mini',State.ui.sidebar); break;
    case 'open-mob-side': var r2=$('#admin-root'); if(r2) r2.classList.add('mob-open');
      openOverlay('',{onClose:function(){ var r=$('#admin-root'); if(r) r.classList.remove('mob-open'); }}); break;
    case 'close-mob-side': var r3=$('#admin-root'); if(r3) r3.classList.remove('mob-open'); closeOverlay(); break;
    case 'cmdk': openCmdk(); break;
    case 'start-tour': startTour(); break;
    case 'open-notifs': openNotifs(); break;
    /* auth */
    case 'quick-login': doLogin(D.role); break;
    case 'show-pass': var ip=$('#lg-pass'); if(ip) ip.type=ip.type==='password'?'text':'password'; break;
    case 'recover': showToast('Te enviamos un enlace de recuperación válido por 15 minutos a tu correo.','ok','Contraseña'); break;
    case 'logout':
      State.session=null;
      AUTH_TOKEN=null;
      localStorage.removeItem('ferremax_token');
      localStorage.removeItem('ferremax_session');
      posCart.length=0;
      closeAllOverlays();
      showToast('Sesión cerrada y token revocado correctamente.','info','Hasta pronto');
      go('/login');
      break;
    /* storefront */
    case 'open-cart': openCart(); break;

        }catch(e){ showToast('Error al restablecer: ' + e.message, 'err'); }
      }, false);
      break;
    /* Respaldos de Base de Datos y Seguridad */
    case 'refresh-backup-stats':
      initBackupCard();
      showToast('Estadísticas de la base de datos actualizadas.', 'ok', 'Respaldos');
      break;
    case 'download-db-backup':
      downloadDatabaseBackup();
      break;
    case 'download-json-backup':
      downloadJsonBackup();
      break;
    case 'create-server-snapshot':
      createServerSnapshot();
      break;
    case 'download-snapshot-file':
      downloadSnapshotFile(D.file);
      break;
    case 'restore-snapshot-file':
      restoreSnapshotByName(D.file);
      break;
    case 'open-restore-modal':
      openRestoreModal();
      break;
    case 'open-reset-operations-modal':
      openResetOperationsModal();
      break;
    case 'toggle-coupon': var cp=DB.coupons.filter(function(x){return x.code===D.code;})[0];
      if(cp){ cp.active=!cp.active; el.classList.toggle('on',cp.active); el.setAttribute('aria-checked',cp.active);
        showToast('Cupón '+cp.code+' '+(cp.active?'activado':'desactivado')+'.',cp.active?'ok':'warn','Marketing'); } break;
    case 'new-coupon': openCouponModal(); break;
    /* Publicidad y Banners Comerciales */
    case 'switch-marketing-tab':
      MARKETING_STATE.tab = D.tab;
      render();
      break;
    case 'filter-banner-slot':
      MARKETING_STATE.filterSlot = D.slot;
      render();
      break;
    case 'refresh-banners':
      loadBannersFromAPI().then(function(){
        render();
        showToast('Espacios publicitarios y métricas actualizadas', 'ok', 'Publicidad');
      });
      break;
    case 'new-banner':
      openBannerModal();
      break;
    case 'edit-banner':
      var eb = (MARKETING_STATE.banners || []).find(function(x){ return x.id === D.id; });
      if(eb) openBannerModal(eb);
      break;
    case 'toggle-banner-active':
      var tb = (MARKETING_STATE.banners || []).find(function(x){ return x.id === D.id; });
      if(tb){
        var newSt = !tb.active;
        tb.active = newSt;
        el.classList.toggle('on', newSt);
        el.setAttribute('aria-checked', newSt);
        toggleBannerActive(tb.id, newSt);
      }
      break;
    case 'del-banner':
      if(confirm('¿Seguro que deseas eliminar este banner comercial del sistema?')){
        deleteBannerFromAPI(D.id);
      }
      break;
    case 'banner-click':
      trackBannerClick(D.id, D.link);
      break;
    case 'submit-banner':
      var bId = D.id || '';
      var bSlot = ($('#b-slot') || {}).value || 'home_hero';
      var bTitle = ($('#b-title') || {}).value || '';
      var bSubtitle = ($('#b-subtitle') || {}).value || '';
      var bBrand = ($('#b-brand') || {}).value || '';
      var bBadge = ($('#b-badge') || {}).value || '';
      var bBtn = ($('#b-btn-text') || {}).value || '';
      var bImg = ($('#b-img') || {}).value || '';
      var bLink = ($('#b-link') || {}).value || '';
      var bGrad = ($('#b-gradient') || {}).value || '';
      var bOrder = parseInt(($('#b-order') || {}).value, 10) || 0;
      var bActive = ($('#b-active-switch') && $('#b-active-switch').classList.contains('on')) ? true : false;
      if(!bTitle.trim()){
        showToast('El título del banner es obligatorio', 'err', 'Publicidad');
        return;
      }
      saveBannerToAPI({
        slot: bSlot,
        title: bTitle.trim(),
        subtitle: bSubtitle.trim(),
        brandName: bBrand.trim(),
        badgeText: bBadge.trim(),
        buttonText: bBtn.trim(),
        imageUrl: bImg.trim(),
        linkUrl: bLink.trim(),
        bgGradient: bGrad.trim(),
        order: bOrder,
        active: bActive
      }, bId);
      break;
    /* reportes */
    case 'run-report': var rt=$('#rp-type'); if(rt){ var ti=$('#rp-title'); if(ti) ti.textContent=rt.value+' · '+$('#rp-from').value+' a '+$('#rp-to').value;
        Bus.emit('reportes.generar',rt.value,{module:'reportes'}); showToast('Reporte “'+rt.value+'” regenerado con datos en vivo.','ok','Reportes'); } break;
    case 'print-report': printHTML(buildReportHTML()); showToast('Vista de impresión abierta.','ok','Reportes'); break;
    case 'schedule': showToast('Reporte programado: cada lunes a las 7:00 a tu correo.','ok','Automatización'); break;
    case 'export-csv':
      if (D.what === 'inventario' && API_ONLINE) {
        var aExp = document.createElement('a');
        aExp.href = API_URL + '/products/export-csv';
        aExp.download = 'catalogo_ferremax.csv';
        document.body.appendChild(aExp);
        aExp.click();
        aExp.remove();
        showToast('Descargando catálogo completo desde base de datos SQLite...', 'ok', 'Exportación');
      } else {
        exportCSV(D.what);
      }
      break;
    /* plugins / devops */
    case 'plugin-install': installPlugin(DB.plugins.filter(function(x){return x.id===D.id;})[0],el); break;
    case 'plugin-toggle': var pl=DB.plugins.filter(function(x){return x.id===D.id;})[0];
      if(pl){ pl.status=pl.status==='installed'?'available':'installed';
        Bus.emit(pl.status==='installed'?'plugin.activar':'plugin.desactivar',pl.name+' v'+pl.v,{module:'plugins'});
        render(); showToast(pl.name+' '+(pl.status==='installed'?'activado':'desactivado')+'. Los demás módulos siguen funcionando.','ok','Plugins'); } break;
    case 'plugin-update': deploySim(el,'actualizando '+(DB.plugins.filter(function(x){return x.id===D.id;})[0]||{name:'plugin'}).name); break;
    case 'plugin-docs': openDocsModal(DB.plugins.filter(function(x){return x.id===D.id;})[0]); break;
    case 'upload-plugin': showToast('Empaqueta tu módulo como imagen Docker y súbelo al registry privado.','info','SDK'); break;
    case 'deploy': runPipeline(); break;
    case 'run-tests': runTests(); break;
    case 'restore': showToast('Restaurando backup '+D.d+' en entorno aislado antes de aplicar.','warn','Backups'); break;
    case 'rescan': deploySim(el,'re-escaneo de postura'); setTimeout(function(){ showToast('Escaneo completado: 39 controles OK, 2 en advertencia.','ok','Seguridad'); },1600); break;
    case 'pentest': showToast('Solicitud enviada al equipo de seguridad ofensiva. Informe en 5 días hábiles.','ok','Pentest'); break;
    case 'revoke': showToast('Se revocaron 3 sesiones activas. Tu token actual sigue válido.','warn','Seguridad'); break;
    case 'toggle-perm': var role=D.role, mid2=D.m;
      if(el.checked && DB.perms[role].indexOf(mid2)<0) DB.perms[role].push(mid2);
      if(!el.checked) DB.perms[role]=DB.perms[role].filter(function(x){return x!==mid2;});
      Bus.emit('auth.permisos.cambio',role+' → '+mid2+' '+(el.checked?'grant':'revoke'),{module:'seguridad'});
      showToast('Permiso '+mid2+' '+(el.checked?'otorgado':'revocado')+' a '+role+'.','ok','RBAC'); break;
    /* roadmap */
    case 'task-toggle': var ph=DB.roadmap[+D.p], tk=ph.tasks[+D.t]; tk[1]=tk[1]?0:1;
      Bus.emit('roadmap.task',ph.phase+' · '+tk[0],{module:'core'}); render();
      showToast('Avance de '+ph.phase+': '+Math.round(ph.tasks.filter(function(t){return t[1];}).length/ph.tasks.length*100)+'%.','ok','Roadmap'); break;
    case 'danger-reset': confirmAction('Restablecer la demo','Se borrará lo creado en esta sesión (pedidos, productos, cupones) y volveremos a los datos de fábrica.','Restablecer',function(){
        location.reload(); },true); break;
    case 'request-access': showToast('Solicitud enviada a Ricardo Núñez (Administrador).','ok','Permisos'); break;
    case 'open-ai-chat': openAdminAIModal(); break;
    case 'open-gemini-config': openGeminiKeyModal(); break;
    default: return false;
  }
  return true;
}

  var items=posCart.map(function(l){
    var p=byId(l.id);
    var currentUnit = l.unitSold || (p ? p.unit : 'UND');
    var isPurchaseUnit = p && p.purchaseUnit && currentUnit === p.purchaseUnit;
    var unitPrice = isPurchaseUnit ? (p.price * (p.unitRatio || 1)) : (p ? p.price : 0);
    return {
      id: p ? p.id : l.id,
      sku: p ? p.sku : '',
      name: p ? p.name : 'Producto',
      price: unitPrice,
      qty: l.qty,
      unitSold: currentUnit,
      serialNumber: l.serialNumber ? l.serialNumber.trim() : null
    };
  });
  var folio='POS-'+(1001+DB.orders.length);
  var refInput = $('#pos-pay-ref');
  var refVal = refInput ? refInput.value.trim() : ('POS-'+Date.now().toString().slice(-4));
  var isDivisa = posPay === 'Efectivo USD' || posPay === 'Efectivo';
  var igtf = isDivisa ? Math.round(t.total * getIgtfRate() * 100) / 100 : 0;
  var finalTotalUsd = Math.round((t.total + igtf) * 100) / 100;
  var bcv = BCV_RATE || 877.90;
  var finalTotalBs = Math.round(finalTotalUsd * bcv * 100) / 100;

  var mappedMethod = 'EFECTIVO_USD';
  if(posPay==='Pago Móvil') mappedMethod = 'PAGO_MOVIL';
  else if(posPay==='Punto Débito') mappedMethod = 'PUNTO_DEBITO';
  else if(posPay==='Transferencia') mappedMethod = 'TRANSFERENCIA';
  else if(posPay==='Zelle') mappedMethod = 'ZELLE';
  else if(posPay==='Crédito Comercial') mappedMethod = 'CREDITO';
  else if(posPay==='Efectivo Bs' || posPay==='Efectivo Bolívares') mappedMethod = 'EFECTIVO_BS';

  if(posPay==='Crédito Comercial'){
    var curDebt = Number(cust ? cust.currentDebt || 0 : 0);
    var limit = Number(cust ? cust.creditLimit || 0 : 0);
    if(limit <= 0){
      showToast('El cliente ' + cust.name + ' no tiene cupo de crédito comercial autorizado.', 'err', 'Crédito Denegado');
      return;
    }
    if(cust.creditStatus === 'BLOCKED'){
      showToast('El crédito del cliente ' + cust.name + ' se encuentra bloqueado por morosidad.', 'err', 'Crédito Bloqueado');
      return;
    }
    if(curDebt + finalTotalUsd > limit){
      if(!confirm('El pedido ($ ' + finalTotalUsd.toFixed(2) + ') supera el límite disponible de ' + cust.name + ' ($ ' + Math.max(0, limit - curDebt).toFixed(2) + '). ¿Deseas autorizar la venta de todos modos?')){
        return;
      }
    }
  }

  var serverReceipt = null;
  try{
    var salePayload={
      items:posCart.map(function(l){
        var pr=byId(l.id);
        return {
          productId: l.id,
          quantity: l.qty,
          unitSold: l.unitSold || (pr ? pr.unit : 'UND'),
          serialNumber: l.serialNumber ? l.serialNumber.trim() : undefined
        };
      }),
      customerDoc:cust.rfc||'V-00000000',
      customerName:cust.name||'CLIENTE MOSTRADOR',
      paymentMethod:mappedMethod,
      amountUsdPaid:isDivisa?finalTotalUsd:0,
      paymentReference:refVal || ('POS-'+Date.now().toString().slice(-4))
    };

    var resp=await fetch(API_URL+'/pos/sale',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer '+(AUTH_TOKEN||'')
      },
      body:JSON.stringify(salePayload)
    });

    if(resp.ok){
      var rData=await resp.json();
      if(rData.sale&&rData.sale.orderNumber){
        folio=rData.sale.orderNumber;
      }
      if(rData.receipt){
        serverReceipt=rData.receipt;
      }
      API_ONLINE=true;
    }
  }catch(e){
    console.warn('Backend POS sale no disponible, guardando en local:',e);
  }

  var isCreditSale = posPay === 'Crédito Comercial';
  if(isCreditSale){
    cust.currentDebt = Math.round(((Number(cust.currentDebt) || 0) + finalTotalUsd) * 100) / 100;
  }

  DB.orders.unshift({
    folio:folio,
    customerId:cust.id,
    customer:cust.name,
    customerDoc:cust.rfc||'V-00000000',
    items:items,
    sub:t.sub,
    iva:t.iva,
    igtf:igtf,
    total:finalTotalUsd,
    totalBs:finalTotalBs,
    status: isCreditSale ? 'a credito' : 'pagada',
    channel:'POS mostrador',
    date:new Date(),
    pay:posPay,
    ref:refVal
  });
  posCart.forEach(function(l){
    var p=byId(l.id);
    if(p){
      var factor = (l.unitSold && p.unitRatio && p.purchaseUnit && l.unitSold === p.purchaseUnit) ? p.unitRatio : 1;
      p.stock = Math.max(0, Math.round((p.stock - (l.qty * factor)) * 100) / 100);
    }
  });
  Bus.emit('ventas.orden.creada',folio+' · $'+finalTotalUsd.toFixed(2)+' (Bs. '+finalTotalBs.toLocaleString('es-VE')+') · '+posPay,{module:'ventas'});
  Bus.emit('inventario.descontar',items.map(function(i){return i.sku;}).join(', '),{module:'inventario'});
  closeAllOverlays(); posCart.length=0; refreshBadges();
  openDigitalReceiptModal(serverReceipt || {
    folio: folio,
    subtotalUsd: t.sub,
    taxUsd: t.iva,
    igtfUsd: igtf,
    totalUsd: finalTotalUsd,
    totalBs: finalTotalBs,
    items: items,
    customerName: cust.name,
    customerDoc: cust.rfc || 'V-00000000',
    customerPhone: cust.phone || '',
    paymentMethod: posPay,
    paymentReference: refVal
  });
  showToast(isCreditSale ? 'Venta a crédito '+folio+' registrada en la cuenta de '+cust.name+'.' : 'Venta '+folio+' cobrada por $'+finalTotalUsd.toFixed(2)+' (Bs. '+finalTotalBs.toLocaleString('es-VE')+').','ok', isCreditSale ? 'Crédito Comercial' : '¡Cobro exitoso!');
}

// --- COMPROBANTES DIGITALES Y GESTIÓN DE CAJA (FERREMAX) ---

function normalizeReceiptData(folioOrData, t, items, cust, payMethod) {
  if (folioOrData && typeof folioOrData === 'object' && folioOrData.folio) {
    var obj = folioOrData;
    var bcv = obj.bcvRate || BCV_RATE || 877.90;
    var totUsd = Number(obj.totalUsd || obj.total || 0);
    var totBs = Number(obj.totalBs || Math.round(totUsd * bcv * 100) / 100);
    return {
      folio: obj.folio,
      date: obj.date || obj.createdAt || new Date(),
      storeName: obj.storeName || STORE_CONFIG.storeName || 'FERREMAX VENEZUELA, C.A.',
      storeRif: obj.storeRif || STORE_CONFIG.storeRif || 'J-50123456-7',
      storeAddress: obj.storeAddress || STORE_CONFIG.address || 'Av. Principal Los Cortijos, Caracas',
      storePhone: obj.storePhone || STORE_CONFIG.phone || '(0212) 555-MAX1',
      cashier: obj.cashier || (State.session ? State.session.name : 'Cajero Mostrador (Caja 02)'),
      customerName: obj.customerName || obj.customer || 'Cliente Mostrador',
      customerDoc: obj.customerDoc || (obj.customerDocNumber ? (obj.customerDocType ? obj.customerDocType + '-' + obj.customerDocNumber : obj.customerDocNumber) : 'V-00000000'),
      customerPhone: obj.customerPhone || (obj.customerObj ? obj.customerObj.phone : ''),
      customerEmail: obj.customerEmail || '',
      paymentMethod: obj.paymentMethod || obj.pay || 'Efectivo USD',
      paymentReference: obj.paymentReference || obj.ref || '',
      bcvRate: bcv,
      subtotalUsd: Number(obj.subtotalUsd !== undefined ? obj.subtotalUsd : (obj.sub !== undefined ? obj.sub : totUsd)),
      taxUsd: Number(obj.taxUsd !== undefined ? obj.taxUsd : (obj.iva !== undefined ? obj.iva : 0)),
      igtfUsd: Number(obj.igtfUsd !== undefined ? obj.igtfUsd : (obj.igtf !== undefined ? obj.igtf : 0)),
      totalUsd: totUsd,
      totalBs: totBs,
      items: (obj.items || []).map(function(i) {
        var pPrice = Number(i.price || i.priceUsd || 0);
        var q = Number(i.qty || i.quantity || 1);
        var lineUsd = Number(i.subtotalUsd !== undefined ? i.subtotalUsd : (pPrice * q));
        var lineBs = Math.round(lineUsd * bcv * 100) / 100;
        return {
          id: i.id || i.productId,
          sku: i.sku || 'SKU',
          name: i.name || i.productName || 'Artículo',
          qty: q,
          price: pPrice,
          subtotalUsd: lineUsd,
          subtotalBs: lineBs
        };
      })
    };
  }

  var folio = folioOrData || ('POS-' + Date.now().toString().slice(-4));
  payMethod = payMethod || posPay || 'Efectivo USD';
  cust = cust || { name: 'Cliente Mostrador', rfc: 'V-00000000' };
  t = t || { sub: 0, iva: 0, d: 0 };
  items = items || [];
  var bcvRate = BCV_RATE || 877.90;
  var subUsd = t.sub - (t.d || 0);
  var ivaUsd = t.iva;
  var isDivisa = payMethod === 'Efectivo USD' || payMethod === 'Efectivo';
  var igtfUsd = isDivisa ? Math.round((subUsd + ivaUsd) * 0.03 * 100) / 100 : 0;
  var totalUsd = Math.round((subUsd + ivaUsd + igtfUsd) * 100) / 100;
  var totalBs = Math.round(totalUsd * bcvRate * 100) / 100;

  return {
    folio: folio,
    date: new Date(),
    storeName: STORE_CONFIG.storeName || 'FERREMAX VENEZUELA, C.A.',
    storeRif: STORE_CONFIG.storeRif || 'J-50123456-7',
    storeAddress: STORE_CONFIG.address || 'Av. Principal Los Cortijos, Caracas',
    storePhone: STORE_CONFIG.phone || '(0212) 555-MAX1',
    cashier: State.session ? State.session.name : 'Caja 02 · Turno Matutino',
    customerName: cust.name,
    customerDoc: cust.rfc || 'V-00000000',
    customerPhone: cust.phone || '',
    customerEmail: cust.email || '',
    paymentMethod: payMethod,
    paymentReference: '',
    bcvRate: bcvRate,
    subtotalUsd: subUsd,
    taxUsd: ivaUsd,
    igtfUsd: igtfUsd,
    totalUsd: totalUsd,
    totalBs: totalBs,
    items: items.map(function(i) {
      var price = Number(i.price || 0);
      var q = Number(i.qty || 1);
      return {
        id: i.id,
        sku: i.sku || '',
        name: i.name,
        qty: q,
        price: price,
        subtotalUsd: price * q,
        subtotalBs: Math.round(price * q * bcvRate * 100) / 100
      };
    })
  };
}

function buildReceiptWhatsAppText(r) {
  var bcv = r.bcvRate || BCV_RATE || 877.90;
  var itemsTxt = (r.items || []).map(function(i){
    var itemTot = Number(i.subtotalUsd || (i.price * i.qty));
    var itemBs = (Math.round(itemTot * bcv * 100) / 100).toLocaleString('es-VE', {minimumFractionDigits:2, maximumFractionDigits:2});
    return '• ' + i.qty + 'x ' + i.name + ' - $' + itemTot.toFixed(2) + ' (Bs. ' + itemBs + ')';
  }).join('\n');

  var msg = '🛠️ *' + (r.storeName || 'FERREMAX VENEZUELA') + '*\n' +
    '📋 *COMPROBANTE ELECTRÓNICO DE ENTREGA*\n' +
    '🆔 *Folio:* ' + r.folio + '\n' +
    '📅 *Fecha:* ' + fmtDateTime(r.date) + '\n' +
    '👤 *Cliente:* ' + r.customerName + ' (' + r.customerDoc + ')\n' +
    '💳 *Método de Pago:* ' + r.paymentMethod + (r.paymentReference ? ' · Ref: ' + r.paymentReference : '') + '\n\n' +
    '*Artículos Comprados:*\n' + itemsTxt + '\n' +
    '-----------------------------------\n' +
    '💵 *Subtotal:* $' + r.subtotalUsd.toFixed(2) + '\n' +
    '📊 *IVA (16%):* $' + r.taxUsd.toFixed(2) + '\n' +
    (r.igtfUsd > 0 ? '⚠️ *IGTF (3% Divisas):* $' + r.igtfUsd.toFixed(2) + '\n' : '') +
    '-----------------------------------\n' +
    '💰 *TOTAL A PAGAR:*\n' +
    '👉 *USD: $' + r.totalUsd.toFixed(2) + '*\n' +
    '👉 *Bolívares (Tasa BCV ' + bcv.toFixed(2) + '): Bs. ' + r.totalBs.toLocaleString('es-VE', {minimumFractionDigits:2, maximumFractionDigits:2}) + '*\n' +
    '-----------------------------------\n' +
    '📍 ' + (r.storeAddress || 'Caracas, Venezuela') + '\n' +
    '📞 ' + (r.storePhone || '(0212) 555-MAX1') + '\n' +
    '🛡️ *Garantía de 30 días con este comprobante de entrega.*\n' +
    '¡Gracias por preferir a FerreMax!';
  return msg;
}

function sendReceiptViaWhatsApp(receiptData, customPhone) {
  var r = normalizeReceiptData(receiptData);
  var msg = buildReceiptWhatsAppText(r);
  var phone = (customPhone || r.customerPhone || '').replace(/\D/g, '');
  
  if (navigator.clipboard) {
    navigator.clipboard.writeText(msg).catch(function(){});
  }
  
  var url = 'https://api.whatsapp.com/send?' + (phone ? 'phone=' + phone + '&' : '') + 'text=' + encodeURIComponent(msg);
  window.open(url, '_blank');
  showToast('Comprobante copiado al portapapeles y listo para enviar por WhatsApp.', 'ok', 'WhatsApp');
}

function drawReceiptToCanvas(r) {
  var bcv = r.bcvRate || BCV_RATE || 877.90;
  var items = r.items || [];
  var scale = 2;
  var width = 640;
  var contentHeight = 175 + 105 + 36 + (Math.max(1, items.length) * 30) + 165 + 90;
  
  var canvas = document.createElement('canvas');
  canvas.width = width * scale;
  canvas.height = contentHeight * scale;
  var ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, width, contentHeight);
  ctx.strokeStyle = '#e2e8f0';
  ctx.lineWidth = 1;
  ctx.strokeRect(10, 10, width - 20, contentHeight - 20);

  ctx.fillStyle = '#0f766e';
  ctx.fillRect(10, 10, width - 20, 10);

  ctx.fillStyle = '#0f172a';
  ctx.font = 'bold 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(r.storeName, width / 2, 50);

  ctx.fillStyle = '#64748b';
  ctx.font = '12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.fillText('RIF: ' + r.storeRif + ' · Telf: ' + r.storePhone, width / 2, 72);
  ctx.fillText(r.storeAddress, width / 2, 90);

  ctx.fillStyle = '#f0fdfa';
  ctx.strokeStyle = '#0f766e';
  var bw = 330, bh = 26;
  ctx.fillRect((width - bw) / 2, 104, bw, bh);
  ctx.strokeRect((width - bw) / 2, 104, bw, bh);
  ctx.fillStyle = '#0f766e';
  ctx.font = 'bold 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.fillText('COMPROBANTE ELECTRÓNICO DE ENTREGA', width / 2, 121);

  var my = 145;
  ctx.fillStyle = '#f8fafc';
  ctx.strokeStyle = '#e2e8f0';
  ctx.fillRect(25, my, width - 50, 90);
  ctx.strokeRect(25, my, width - 50, 90);

  ctx.textAlign = 'left';
  ctx.font = 'bold 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.fillStyle = '#1e293b';
  ctx.fillText('Folio: ' + r.folio, 40, my + 24);
  ctx.font = '11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.fillStyle = '#475569';
  ctx.fillText('Fecha: ' + fmtDateTime(r.date), 40, my + 46);
  ctx.fillText('Cajero: ' + r.cashier, 40, my + 68);

  ctx.font = 'bold 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.fillStyle = '#1e293b';
  ctx.fillText('Cliente: ' + r.customerName, width / 2 + 10, my + 24);
  ctx.font = '11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.fillStyle = '#475569';
  ctx.fillText('Doc / RIF: ' + r.customerDoc, width / 2 + 10, my + 46);
  ctx.fillText('Pago: ' + r.paymentMethod + (r.paymentReference ? ' (Ref: ' + r.paymentReference + ')' : ''), width / 2 + 10, my + 68);

  var ty = my + 105;
  ctx.fillStyle = '#f1f5f9';
  ctx.fillRect(25, ty, width - 50, 26);
  ctx.fillStyle = '#0f172a';
  ctx.font = 'bold 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('CANT', 35, ty + 17);
  ctx.fillText('DESCRIPCIÓN', 85, ty + 17);
  ctx.textAlign = 'right';
  ctx.fillText('PRECIO ($)', width - 150, ty + 17);
  ctx.fillText('TOTAL ($)', width - 40, ty + 17);

  var cy = ty + 26;
  ctx.font = '11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    cy += 28;
    ctx.fillStyle = (i % 2 === 0) ? '#ffffff' : '#fafafa';
    ctx.fillRect(25, cy - 20, width - 50, 28);
    ctx.strokeStyle = '#f1f5f9';
    ctx.strokeRect(25, cy - 20, width - 50, 28);

    ctx.fillStyle = '#0f172a';
    ctx.textAlign = 'left';
    ctx.fillText(String(it.qty) + 'x', 35, cy);

    var iname = it.name || 'Artículo';
    if (iname.length > 35) iname = iname.substring(0, 33) + '…';
    ctx.fillText(iname, 85, cy);

    ctx.textAlign = 'right';
    ctx.fillStyle = '#475569';
    ctx.fillText('$' + Number(it.price).toFixed(2), width - 150, cy);

    ctx.fillStyle = '#0f172a';
    ctx.font = 'bold 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    ctx.fillText('$' + Number(it.subtotalUsd).toFixed(2), width - 40, cy);
    ctx.font = '11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';

  ctx.strokeStyle = '#e2e8f0';
  ctx.strokeRect(width - 330, totY, 305, 135);

  ctx.textAlign = 'left';
  ctx.fillText('Subtotal:', width - 315, totY + 22);
  ctx.textAlign = 'right';
  ctx.fillText('$' + r.subtotalUsd.toFixed(2), width - 40, totY + 22);

  ctx.textAlign = 'left';
  ctx.fillText('IVA (16%):', width - 315, totY + 42);
  ctx.textAlign = 'right';
  ctx.fillText('$' + r.taxUsd.toFixed(2), width - 40, totY + 42);

  if (r.igtfUsd > 0) {
    ctx.textAlign = 'left';
    ctx.fillStyle = '#d97706';
    ctx.fillText('IGTF (3% Divisas):', width - 315, totY + 62);
    ctx.textAlign = 'right';
    ctx.fillText('$' + r.igtfUsd.toFixed(2), width - 40, totY + 62);
  }

  ctx.fillStyle = '#0f172a';
  ctx.font = 'bold 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('TOTAL USD:', width - 315, totY + 88);
  ctx.textAlign = 'right';
  ctx.fillText('$' + r.totalUsd.toFixed(2), width - 40, totY + 88);

  ctx.fillStyle = '#059669';
  ctx.font = 'bold 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('TOTAL BS (BCV ' + bcv.toFixed(2) + '):', width - 315, totY + 114);
  ctx.textAlign = 'right';
  ctx.fillText('Bs. ' + r.totalBs.toLocaleString('es-VE', {minimumFractionDigits:2, maximumFractionDigits:2}), width - 40, totY + 114);

  var footY = totY + 160;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#64748b';
  ctx.font = '11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.fillText('¡Gracias por su compra en ' + r.storeName + '!', width / 2, footY);
  ctx.fillText('Comprobante digital comercial · Válido para garantía de 30 días para cambios.', width / 2, footY + 18);
  ctx.fillStyle = '#94a3b8';
  ctx.font = '9.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.fillText('Generado el ' + fmtDateTime(new Date()) + ' · Sistema FerreMax Core-Business Suite', width / 2, footY + 36);

  return canvas;
}

function downloadReceiptAsImage(receiptData) {
  var r = normalizeReceiptData(receiptData);
  var canvas = drawReceiptToCanvas(r);
  var link = document.createElement('a');
  link.download = 'Comprobante_FerreMax_' + r.folio + '.png';
  link.href = canvas.toDataURL('image/png');
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  showToast('Comprobante ' + r.folio + ' guardado como imagen PNG.', 'ok', 'Imagen de Comprobante');
}

function buildCorteWhatsAppText(corte, type) {
  type = type || corte.type || 'Z';
  var isZ = type === 'Z';
  var bcv = corte.bcvRate || BCV_RATE || 877.90;
  var bd = corte.breakdown || {};

  var bdUsd = bd.efectivoUsd ? bd.efectivoUsd.totalUsd : (corte.systemEfectivoUsd || 0);
  var bdBs = bd.efectivoBs ? bd.efectivoBs.totalBs : (corte.systemEfectivoBs || 0);
  var bdPm = bd.pagoMovil ? bd.pagoMovil.totalBs : (corte.systemPagoMovilBs || 0);
  var bdPt = bd.puntoDebito ? bd.puntoDebito.totalBs : (corte.systemPuntoBs || 0);
  var bdTr = bd.transferencia ? bd.transferencia.totalBs : (corte.systemTransfBs || 0);
  var bdZl = bd.zelle ? bd.zelle.totalUsd : (corte.systemZelleUsd || 0);

  var msg = '📊 *' + (corte.storeName || STORE_CONFIG.storeName || 'FERREMAX VENEZUELA') + '*\n' +
    '📑 *' + (isZ ? 'REPORTE DE CIERRE DE CAJA (CORTE Z)' : 'AUDITORÍA EN VIVO DE CAJA (CORTE X)') + '*\n' +
    '🆔 *Folio:* ' + (corte.closeNumber || (isZ ? 'Z-1001' : 'X-101')) + '\n' +
    '📅 *Fecha:* ' + fmtDateTime(corte.closingDate || new Date()) + '\n' +
    '👤 *Cajero:* ' + (corte.cashierName || 'Cajero Mostrador') + ' (Caja 02)\n' +
    '💵 *Tasa Oficial BCV:* Bs. ' + bcv.toFixed(2) + '\n' +
    '📦 *Total Operaciones:* ' + (corte.salesCount || 0) + ' ventas\n' +
    '------------------------------------\n' +
    '💰 *RECAUDACIÓN POR MÉTODO:*\n' +
    '• 💵 Efectivo USD: $' + Number(bdUsd).toFixed(2) + '\n' +
    '• 🇻🇪 Efectivo Bolívares: Bs. ' + Number(bdBs).toLocaleString('es-VE', {minimumFractionDigits:2}) + '\n' +
    '• 📱 Pago Móvil: Bs. ' + Number(bdPm).toLocaleString('es-VE', {minimumFractionDigits:2}) + '\n' +
    '• 💳 Punto de Débito: Bs. ' + Number(bdPt).toLocaleString('es-VE', {minimumFractionDigits:2}) + '\n' +
    '• 🏦 Transferencias: Bs. ' + Number(bdTr).toLocaleString('es-VE', {minimumFractionDigits:2}) + '\n' +
    '• 🇺🇸 Zelle: $' + Number(bdZl).toFixed(2) + '\n' +
    '------------------------------------\n' +
    '💵 *Total Ventas USD:* $' + Number(corte.totalSalesUsd || 0).toFixed(2) + '\n' +
    '📈 *Total en Bolívares:* Bs. ' + Number(corte.totalSalesBs || 0).toLocaleString('es-VE', {minimumFractionDigits:2}) + '\n' +
    '📊 *IVA (16%):* $' + Number(corte.totalIvaUsd || 0).toFixed(2) + '\n' +
    (corte.totalIgtfUsd ? '⚠️ *IGTF (3% Divisas):* $' + Number(corte.totalIgtfUsd).toFixed(2) + '\n' : '');

  if (isZ) {
    var diffUsd = corte.differences ? corte.differences.diffUsd : (corte.diffUsd || 0);
    var decUsd = corte.declared ? corte.declared.declaredEfectivoUsd : (corte.declaredEfectivoUsd || 0);
    var expUsd = corte.expected ? corte.expected.expectedEfectivoUsd : (corte.systemEfectivoUsd || 0);

    msg += '------------------------------------\n' +
      '📥 *ARQUEO FÍSICO CONTADO EN GAVETA:*\n' +
      '• Efectivo USD Contado: $' + Number(decUsd).toFixed(2) + ' (Esperado: $' + Number(expUsd).toFixed(2) + ')\n' +
      '• Diferencia USD: $' + Number(diffUsd).toFixed(2) + '\n' +
      '🎯 *ESTADO DEL CIERRE:* ' + (diffUsd === 0 ? '✅ CUADRADO (Sin diferencias)' : (diffUsd > 0 ? '🔵 SOBRANTE (+$' + diffUsd.toFixed(2) + ')' : '🔴 FALTANTE (-$' + Math.abs(diffUsd).toFixed(2) + ')')) + '\n';
  }

  msg += '------------------------------------\n' +
    '📌 *Sistema FerreMax Core-Business Suite*';

  return msg;
}

function sendCorteViaWhatsApp(corte, type) {
  var msg = buildCorteWhatsAppText(corte, type);
  if (navigator.clipboard) {
    navigator.clipboard.writeText(msg).catch(function(){});
  }
  var url = 'https://api.whatsapp.com/send?text=' + encodeURIComponent(msg);
  window.open(url, '_blank');
  showToast('Reporte copiado y listo para enviar a Gerencia por WhatsApp.', 'ok', 'WhatsApp');
}

function drawCorteToCanvas(corte, type) {
  type = type || corte.type || 'Z';
  var isZ = type === 'Z';
  var width = 640;
  var contentHeight = 650;
  var scale = 2;
  var canvas = document.createElement('canvas');
  canvas.width = width * scale;
  canvas.height = contentHeight * scale;
  var ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, width, contentHeight);
  ctx.strokeStyle = '#cbd5e1';
  ctx.strokeRect(10, 10, width - 20, contentHeight - 20);

  ctx.fillStyle = isZ ? '#0f766e' : '#2563eb';
  ctx.fillRect(10, 10, width - 20, 10);

  ctx.fillStyle = '#0f172a';
  ctx.font = 'bold 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(corte.storeName || STORE_CONFIG.storeName || 'FERREMAX VENEZUELA, C.A.', width / 2, 48);

  ctx.fillStyle = '#64748b';
  ctx.font = '11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.fillText('RIF: ' + (corte.storeRif || STORE_CONFIG.storeRif || 'J-50123456-7') + ' · Caja 02 Mostrador', width / 2, 68);

  var titleText = isZ ? 'CIERRE DEFINITIVO DE CAJA (CORTE Z)' : 'AUDITORÍA EN VIVO DE CAJA (CORTE X)';
  ctx.fillStyle = isZ ? '#f0fdfa' : '#eff6ff';
  ctx.strokeStyle = isZ ? '#0f766e' : '#2563eb';
  ctx.fillRect(100, 84, width - 200, 28);
  ctx.strokeRect(100, 84, width - 200, 28);
  ctx.fillStyle = isZ ? '#0f766e' : '#1d4ed8';
  ctx.font = 'bold 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.fillText(titleText, width / 2, 103);

  ctx.textAlign = 'left';
  ctx.fillStyle = '#1e293b';
  ctx.font = 'bold 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.fillText('Folio: ' + (corte.closeNumber || (isZ ? 'Z-1001' : 'X-101')), 35, 140);
  ctx.fillText('Fecha/Hora: ' + fmtDateTime(corte.closingDate || new Date()), 35, 160);
  ctx.fillText('Cajero: ' + (corte.cashierName || 'Cajero Mostrador'), 35, 180);

  ctx.fillText('Tasa BCV: Bs. ' + (corte.bcvRate ? Number(corte.bcvRate).toFixed(2) : '877.90'), width / 2 + 15, 140);
  ctx.fillText('Ventas del Turno: ' + (corte.salesCount || 0) + ' operaciones', width / 2 + 15, 160);

  var bdY = 205;
  ctx.fillStyle = '#f8fafc';
  ctx.fillRect(25, bdY, width - 50, 160);
  ctx.strokeStyle = '#e2e8f0';
  ctx.strokeRect(25, bdY, width - 50, 160);

  ctx.fillStyle = '#0f172a';
  ctx.font = 'bold 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.fillText('RECAUDACIÓN POR MÉTODO DE PAGO:', 40, bdY + 24);

  var bd = corte.breakdown || {};
  var methods = [
    ['Efectivo USD', '$ ' + Number(bd.efectivoUsd ? bd.efectivoUsd.totalUsd : (corte.systemEfectivoUsd || 0)).toFixed(2)],
    ['Bolívares Efectivo', 'Bs. ' + Number(bd.efectivoBs ? bd.efectivoBs.totalBs : (corte.systemEfectivoBs || 0)).toLocaleString('es-VE',{minimumFractionDigits:2})],
    ['Pago Móvil', 'Bs. ' + Number(bd.pagoMovil ? bd.pagoMovil.totalBs : (corte.systemPagoMovilBs || 0)).toLocaleString('es-VE',{minimumFractionDigits:2})],
    ['Punto de Débito', 'Bs. ' + Number(bd.puntoDebito ? bd.puntoDebito.totalBs : (corte.systemPuntoBs || 0)).toLocaleString('es-VE',{minimumFractionDigits:2})],
    ['Transferencias', 'Bs. ' + Number(bd.transferencia ? bd.transferencia.totalBs : (corte.systemTransfBs || 0)).toLocaleString('es-VE',{minimumFractionDigits:2})],
    ['Zelle', '$ ' + Number(bd.zelle ? bd.zelle.totalUsd : (corte.systemZelleUsd || 0)).toFixed(2)]
  ];

  ctx.font = '11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  for (var m = 0; m < methods.length; m++) {
    var col = m < 3 ? 0 : 1;
    var row = m % 3;
    var mx = col === 0 ? 40 : width / 2 + 15;
    var my = bdY + 52 + (row * 26);
    ctx.fillStyle = '#64748b';
    ctx.textAlign = 'left';
    ctx.fillText('• ' + methods[m][0] + ':', mx, my);
    ctx.fillStyle = '#0f172a';
    ctx.font = 'bold 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    ctx.fillText(methods[m][1], mx + 130, my);
    ctx.font = '11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  }

  var recY = bdY + 180;
  ctx.fillStyle = isZ ? '#f0fdf4' : '#f8fafc';
  ctx.fillRect(25, recY, width - 50, 160);
  ctx.strokeStyle = isZ ? '#86efac' : '#e2e8f0';
  ctx.strokeRect(25, recY, width - 50, 160);

  ctx.textAlign = 'left';
  ctx.fillStyle = '#0f172a';
  ctx.font = 'bold 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.fillText(isZ ? 'ARQUEO Y CONCILIACIÓN FÍSICA:' : 'TOTALES CONSOLIDADOS DEL TURNO:', 40, recY + 24);

  if (isZ) {
    var diffUsd = corte.differences ? corte.differences.diffUsd : (corte.diffUsd || 0);
    var decUsd = corte.declared ? corte.declared.declaredEfectivoUsd : (corte.declaredEfectivoUsd || 0);
    var expUsd = corte.expected ? corte.expected.expectedEfectivoUsd : (corte.systemEfectivoUsd || 0);

    ctx.font = '11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    ctx.fillStyle = '#475569';
    ctx.fillText('Efectivo USD Esperado en Sistema: $' + Number(expUsd).toFixed(2), 40, recY + 52);
    ctx.fillText('Efectivo USD Declarado en Arqueo: $' + Number(decUsd).toFixed(2), 40, recY + 74);
    ctx.fillText('Diferencia Contable: $' + Number(diffUsd).toFixed(2), 40, recY + 96);

    var statusText = diffUsd === 0 ? 'CUADRADO (Sin diferencia)' : (diffUsd > 0 ? 'SOBRANTE (+$' + diffUsd.toFixed(2) + ')' : 'FALTANTE (-$' + Math.abs(diffUsd).toFixed(2) + ')');
    var statusColor = diffUsd === 0 ? '#059669' : (diffUsd > 0 ? '#d97706' : '#dc2626');
    ctx.fillStyle = statusColor;
    ctx.font = 'bold 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    ctx.fillText('ESTADO: ' + statusText, 40, recY + 128);
  } else {
    ctx.font = '12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    ctx.fillStyle = '#475569';
    ctx.fillText('Subtotal Ventas: $' + Number(corte.totalSalesUsd || 0).toFixed(2), 40, recY + 52);
    ctx.fillText('IVA Acumulado:   $' + Number(corte.totalIvaUsd || 0).toFixed(2), 40, recY + 74);
    ctx.fillText('IGTF Acumulado:  $' + Number(corte.totalIgtfUsd || 0).toFixed(2), 40, recY + 96);

    ctx.fillStyle = '#0f766e';
    ctx.font = 'bold 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    ctx.fillText('TOTAL EN CAJA: $' + Number(corte.totalSalesUsd || 0).toFixed(2) + ' (Bs. ' + Number(corte.totalSalesBs || 0).toLocaleString('es-VE',{minimumFractionDigits:2}) + ')', 40, recY + 128);
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = '#94a3b8';
  ctx.font = '10px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.fillText('Reporte generado automáticamente por Sistema FerreMax · ' + fmtDateTime(new Date()), width / 2, contentHeight - 25);

  return canvas;
}

async function openCashClose(){
  var summary = null;
  var bcv = BCV_RATE || 877.90;

  try {
    var resp = await fetch(API_URL + '/pos/cash/shift-summary');
    if (resp.ok) {
      summary = await resp.json();
    }
  } catch (err) {
    console.warn('Backend shift-summary no disponible, usando órdenes locales:', err);
  }

  if (!summary) {
    var todayOrders = DB.orders.filter(function(o){ return new Date(o.date).toDateString() === new Date().toDateString(); });
    var totUsd = todayOrders.reduce(function(a,b){ return a + b.total; }, 0);
    var totBs = Math.round(totUsd * bcv * 100) / 100;
    var totIva = todayOrders.reduce(function(a,b){ return a + (b.iva || 0); }, 0);
    var totIgtf = todayOrders.reduce(function(a,b){ return a + (b.igtf || 0); }, 0);

      efectivoUsd: { totalUsd: todayOrders.filter(function(o){ return o.pay === 'Efectivo USD' || o.pay === 'Efectivo'; }).reduce(function(a,b){ return a + b.total; }, 0), totalBs: 0, count: 0 },
      efectivoBs: { totalUsd: 0, totalBs: 0, count: 0 },

      zelle: { totalUsd: 0, totalBs: 0, count: 0 }
