function findAbonoAndCustomer(folio) {
  var abono = (DB.abonos || []).filter(function(a){ return (a.receiptNumber === folio || a.folio === folio || a.id === folio); })[0];
  if (!abono) {
    showToast('No se encontró el comprobante ' + folio, 'err', 'Comprobante');
    return null;
  }
  var customer = (DB.customers || []).filter(function(c){ return c.id === abono.customerId; })[0];
  return { abono: abono, customer: customer };
}

function openAbonoReceiptByFolio(folio) {
  var found = findAbonoAndCustomer(folio);
  if (found) openAbonoReceiptModal(found.abono, found.customer);
}

function drawAbonoToCanvas(abono, customer) {
  var canvas = document.createElement('canvas');
  var dpr = 2;
  var w = 700;
  var h = 940;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  // Fondo blanco con borde
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, w, h);

  // Barra de cabecera con color primario
  var brandColor = (window.BRANDING && window.BRANDING.colorPrimary) || '#ea580c';
  ctx.fillStyle = brandColor;
  ctx.fillRect(0, 0, w, 8);

  // Marco
  ctx.strokeStyle = '#e2e8f0';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(20, 20, w - 40, h - 40);

  // Encabezado Empresa
  var storeName = (window.BRANDING && window.BRANDING.name) || 'FERREMAX VENEZUELA';
  ctx.fillStyle = '#0f172a';
  ctx.font = 'bold 24px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(storeName.toUpperCase(), w / 2, 65);

  ctx.fillStyle = '#64748b';
  ctx.font = '12px sans-serif';
  ctx.fillText('RIF: J-50123456-7 · C.A. Ferretería & Materiales de Construcción', w / 2, 88);
  ctx.fillText('Av. Francisco de Miranda, Caracas · Tel: 0212-9876543 / 0414-2345678', w / 2, 106);

  // Línea divisoria punteada
  ctx.strokeStyle = '#cbd5e1';
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(40, 125);
  ctx.lineTo(w - 40, 125);
  ctx.stroke();
  ctx.setLineDash([]);

  // Título del Recibo
  ctx.fillStyle = '#1e293b';
  ctx.font = 'bold 16px sans-serif';
  ctx.fillText('COMPROBANTE DE ABONO A CUENTA', w / 2, 155);

  // Folio destacado
  var folio = abono.receiptNumber || abono.folio || 'ABO-0000';
  ctx.fillStyle = brandColor;
  ctx.font = 'bold 22px monospace';
  ctx.fillText(folio, w / 2, 185);

  // Fecha y hora
  var fechaStr = fmtDateTime(abono.createdAt || new Date());
  ctx.fillStyle = '#64748b';
  ctx.font = '12px sans-serif';
  ctx.fillText('Fecha de emisión: ' + fechaStr, w / 2, 210);

  // Caja de datos del cliente
  ctx.fillStyle = '#f8fafc';
  ctx.strokeStyle = '#e2e8f0';
  ctx.fillRect(40, 230, w - 80, 95);
  ctx.strokeRect(40, 230, w - 80, 95);

  ctx.textAlign = 'left';
  ctx.fillStyle = '#64748b';
  ctx.font = '11px sans-serif';
  ctx.fillText('DATOS DEL CLIENTE', 55, 250);

  ctx.fillStyle = '#0f172a';
  ctx.font = 'bold 15px sans-serif';
  var custName = (customer && customer.name) || abono.customerName || 'Cliente';
  ctx.fillText(custName, 55, 273);

  ctx.font = '13px sans-serif';
  ctx.fillStyle = '#475569';
  var custDoc = (customer && (customer.docNumber || customer.rfc)) || abono.customerDoc || '—';
  var custPhone = (customer && customer.phone) || '';
  ctx.fillText('C.I. / RIF: ' + custDoc + (custPhone ? ('  ·  Tel: ' + custPhone) : ''), 55, 295);
  if (customer && (customer.address || customer.city)) {
    ctx.fillText('Dirección: ' + (customer.address || customer.city), 55, 313);
  }

  // Caja destacada del MONTO ABONADO
  ctx.fillStyle = '#ecfdf5';
  ctx.strokeStyle = '#10b981';
  ctx.lineWidth = 1.5;
  ctx.fillRect(40, 345, w - 80, 115);
  ctx.strokeRect(40, 345, w - 80, 115);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#047857';
  ctx.font = 'bold 13px sans-serif';
  ctx.fillText('MONTO TOTAL ABONADO', w / 2, 372);

  var amtUsd = Number(abono.amountUsd || 0);
  ctx.fillStyle = '#065f46';
  ctx.font = 'bold 36px monospace';
  ctx.fillText('$' + amtUsd.toFixed(2) + ' USD', w / 2, 412);

  var bcv = Number(abono.bcvRate || BCV_RATE || 877.90);
  var amtBs = Number(abono.amountBs || (amtUsd * bcv));
  ctx.fillStyle = '#047857';
  ctx.font = '14px sans-serif';
  ctx.fillText('Equivalente: Bs. ' + fmtBs(amtBs) + '  (Tasa Oficial BCV: Bs. ' + bcv.toFixed(2) + ')', w / 2, 442);

  // Detalle del Pago y Saldos
  ctx.textAlign = 'left';
  var yPos = 490;

  function drawRow(label, val, isBold, color) {
    ctx.fillStyle = '#64748b';
    ctx.font = '13px sans-serif';
    ctx.fillText(label, 50, yPos);
    ctx.textAlign = 'right';
    ctx.fillStyle = color || '#0f172a';
    ctx.font = (isBold ? 'bold ' : '') + '14px sans-serif';
    ctx.fillText(val, w - 50, yPos);
    ctx.textAlign = 'left';
    yPos += 26;
  }

  drawRow('Forma de Pago:', abono.paymentMethod || 'Pago Móvil', true);
  if (abono.paymentReference) {
    drawRow('Referencia de Operación:', abono.paymentReference, true, '#2563eb');
  }
  drawRow('Cajero / Receptor:', abono.cashierName || 'Caja Central', false);
  if (abono.notes) {
    drawRow('Observaciones:', abono.notes, false);
  }

  // Divisor punteado
  yPos += 10;
  ctx.strokeStyle = '#e2e8f0';
  ctx.setLineDash([3, 3]);
  ctx.beginPath();
  ctx.moveTo(40, yPos);
  ctx.lineTo(w - 40, yPos);
  ctx.stroke();
  ctx.setLineDash([]);
  yPos += 25;

  // Estado de Cuenta
  ctx.fillStyle = '#334155';
  ctx.font = 'bold 14px sans-serif';
  ctx.fillText('RESUMEN DE CUENTA', 50, yPos);
  yPos += 25;

  var prevDebt = Number(abono.previousDebtUsd || 0);
  var remDebt = Number(abono.remainingDebtUsd || 0);
  var remDebtBs = remDebt * bcv;

  drawRow('Deuda Anterior:', '$' + prevDebt.toFixed(2) + ' USD', false);
  drawRow('(-) Monto Abonado:', '-$' + amtUsd.toFixed(2) + ' USD', true, '#10b981');
  drawRow('(=) Saldo Restante Pendiente:', '$' + remDebt.toFixed(2) + ' USD (Bs. ' + fmtBs(remDebtBs) + ')', true, remDebt > 0 ? '#ef4444' : '#10b981');

  // Mensaje de pie
  yPos = h - 90;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#10b981';
  ctx.font = 'bold 13px sans-serif';
  ctx.fillText(remDebt <= 0 ? '¡CUENTA TOTALMENTE SOLVENTE!' : '¡GRACIAS POR SU ABONO PUNTUAL!', w / 2, yPos);

  yPos += 20;
  ctx.fillStyle = '#94a3b8';
  ctx.font = '11px sans-serif';
  ctx.fillText('Este documento es un comprobante electrónico válido de abono a cuenta de crédito comercial.', w / 2, yPos);
  yPos += 16;
  ctx.fillText('Generado digitalmente por Sistema FerreMax · ferremax.ve', w / 2, yPos);

  return canvas;
}

async function openStatementModal(customerId) {
  var bcv = BCV_RATE || 877.90;
  var customer = (DB.customers || []).filter(function(x){ return x.id === customerId; })[0];
  if (!customer) {
    showToast('Cliente no encontrado.', 'err', 'Estado de Cuenta');
    return;
  }

  var movements = [];
  var limit = Number(customer.creditLimit !== undefined ? customer.creditLimit : customer.creditLimitUsd) || 0;
  var debt = Number(customer.currentDebt !== undefined ? customer.currentDebt : customer.currentDebtUsd) || 0;
  var debtBs = debt * bcv;
  var avail = Math.max(0, limit - debt);

  // Intentar cargar estado de cuenta completo del backend
  try {
    var resp = await fetch(API_URL + '/customers/' + customerId + '/statement');
    if (resp.ok) {
      var data = await resp.json();
      if (data && data.movements) movements = data.movements;
      if (data && data.summary) {
        debt = Number(data.summary.currentDebtUsd || debt);
        debtBs = Number(data.summary.currentDebtBs || debtBs);
        limit = Number(data.summary.creditLimitUsd || limit);
        avail = Number(data.summary.availableCreditUsd || avail);
      }
    }
  } catch (err) {
    console.warn('Backend offline, generando estado de cuenta local:', err);
  }

  // Fallback local si backend no devolvió movimientos
  if (!movements.length) {
    // Buscar compras de este cliente
    (DB.orders || []).filter(function(o){ return o.customerId === customer.id; }).forEach(function(o) {
      movements.push({
        type: 'CARGO',
        label: 'Compra a Crédito (POS/Pedido)',
        folio: o.folio,
        amountUsd: Number(o.total || 0),
        date: o.date || new Date().toISOString(),
        notes: o.items ? (o.items.length + ' productos') : ''
      });
    });
    // Buscar abonos de este cliente
    (DB.abonos || []).filter(function(a){ return a.customerId === customer.id; }).forEach(function(a) {
      movements.push({
        type: 'ABONO',
        label: 'Abono a Cuenta (' + (a.paymentMethod || 'Pago') + ')',
        folio: a.receiptNumber || 'ABO',
        amountUsd: Number(a.amountUsd || 0),
        date: a.createdAt || new Date().toISOString(),
        notes: a.paymentReference ? ('Ref: ' + a.paymentReference) : (a.notes || '')
      });
    });
    movements.sort(function(a, b){ return new Date(b.date) - new Date(a.date); });
  }

  var rowsHtml = movements.map(function(m) {
    var isCargo = m.type === 'CARGO';
    return '<tr>' +
      '<td data-l="Fecha"><span class="sm mono">' + fmtDateTime(m.date || m.createdAt) + '</span></td>' +
      '<td data-l="Tipo">' +
        (isCargo
          ? '<span class="badge b-warn" style="font-size:10.5px">CARGO (Compra)</span>'
          : '<span class="badge b-ok" style="font-size:10.5px">ABONO (Pago)</span>') +
      '</td>' +
      '<td data-l="Folio / Ref"><b class="mono sm">' + esc(m.folio || m.receiptNumber || '—') + '</b><br><span class="xs muted">' + esc(m.label || m.notes || '') + '</span></td>' +
      '<td data-l="Monto ($)"><b class="mono sm" style="color:' + (isCargo ? 'var(--danger)' : 'var(--ok)') + '">' +
        (isCargo ? '+' : '-') + '$' + Number(m.amountUsd || 0).toFixed(2) +
      '</b></td>' +
      '<td data-l="Equivalente Bs."><span class="mono xs">Bs. ' + fmtBs(Number(m.amountUsd || 0) * bcv) + '</span></td>' +
    '</tr>';
  }).join('') || '<tr><td colspan="5" class="center muted" style="padding:30px">No hay movimientos registrados en el estado de cuenta.</td></tr>';

  var modalHtml = '<div class="card-head">' +
    '<div><h3>Estado de Cuenta Comercial</h3><p class="card-sub">' + esc(customer.name) + ' · ' + esc(customer.docNumber || customer.rfc || '—') + '</p></div>' +
    '<button class="icon-btn" type="button" data-action="close-overlay">' + I.x + '</button>' +
  '</div>' +
  '<div style="padding:22px">' +
    /* KPIs del cliente */
    '<div class="grid" style="grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px">' +
      '<div class="card" style="padding:12px;text-align:center"><b class="mono" style="font-size:18px;color:' + (debt > 0 ? 'var(--danger)' : 'var(--ok)') + '">$' + debt.toFixed(2) + '</b><span class="xs muted" style="display:block">Deuda Pendiente ($)</span><span class="xs mono text-accent">Bs. ' + fmtBs(debtBs) + '</span></div>' +
      '<div class="card" style="padding:12px;text-align:center"><b class="mono" style="font-size:18px">$' + limit.toFixed(2) + '</b><span class="xs muted" style="display:block">Línea de Crédito</span><span class="xs muted">' + (customer.creditDays || 15) + ' días plazo</span></div>' +
      '<div class="card" style="padding:12px;text-align:center"><b class="mono" style="font-size:18px;color:var(--ok)">$' + avail.toFixed(2) + '</b><span class="xs muted" style="display:block">Cupo Disponible</span><span class="xs muted">' + (customer.creditStatus === 'BLOCKED' ? '⚠️ Bloqueado' : '✅ Activo') + '</span></div>' +
    '</div>' +

    '<h4 style="font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:10px">Historial Cronológico de Movimientos</h4>' +
    '<div class="tbl-scroll" style="max-height:360px"><table class="tbl"><thead><tr>' +
      '<th>Fecha</th><th>Tipo</th><th>Folio / Concepto</th><th>Monto ($)</th><th>Equivalente (Bs.)</th>' +
    '</tr></thead><tbody>' + rowsHtml + '</tbody></table></div>' +
  '</div>' +
  '<div class="dr-foot wrap-row" style="gap:8px;justify-content:flex-end">' +
    (debt > 0 ? '<button class="btn btn-sm btn-primary" type="button" data-action="open-abono-modal" data-id="' + esc(customer.id) + '">' + I.plus + ' Registrar Abono</button>' : '') +
    '<button class="btn btn-sm" style="background:#25d366;color:#fff" type="button" data-action="wa-cobro" data-id="' + esc(customer.id) + '">' + I.wa + ' Enviar Resumen WhatsApp</button>' +
    '<button class="btn btn-sm btn-ghost" type="button" data-action="close-overlay">Cerrar</button>' +
  '</div>';

  openModal(modalHtml);
}

function sendCobroViaWhatsApp(customerId) {
  var bcv = BCV_RATE || 877.90;
  var customer = (DB.customers || []).filter(function(x){ return x.id === customerId; })[0];
  if (!customer) return;

  var debt = Number(customer.currentDebt !== undefined ? customer.currentDebt : customer.currentDebtUsd) || 0;
  var debtBs = debt * bcv;
  var storeName = (window.BRANDING && window.BRANDING.name) || 'FerreMax Venezuela';

  var text = 'Estimado(a) *' + customer.name + '*, le saludamos de *' + storeName + '*.\n\n' +
    'Le informamos amablemente que presenta un saldo pendiente en su cuenta comercial:\n' +
    '💵 *Deuda Actual:* *$' + debt.toFixed(2) + ' USD*\n' +
    '🇻🇪 *Equivalente Bs.:* *Bs. ' + fmtBs(debtBs) + '* (Tasa oficial BCV: ' + bcv.toFixed(2) + ')\n' +
    '📅 *Plazo acordado:* ' + (customer.creditDays || 15) + ' días\n\n' +
    'Puede coordinar su abono mediante:\n' +
    '• Pago Móvil o Transferencia Bancaria\n' +
    '• Divisas en efectivo o tarjeta de débito en nuestras cajas\n\n' +
    'Agradecemos hacernos llegar el comprobante de su abono o visitarnos en tienda.\n' +
    '¡Estamos a su completa orden!\n*' + storeName + '*';

  var phone = customer.phone ? customer.phone.replace(/\D/g, '') : '';
  var url = 'https://api.whatsapp.com/send?' + (phone ? ('phone=58' + phone.replace(/^0+/, '') + '&') : '') + 'text=' + encodeURIComponent(text);
  window.open(url, '_blank');
  showToast('Recordatorio de cobro preparado para WhatsApp.', 'info', 'Cobranza');
}

function exportReceivablesCSV() {
  var bcv = BCV_RATE || 877.90;
  var customers = DB.customers || [];
  if (!customers.length) {
    showToast('No hay datos para exportar.', 'err', 'Exportar');
    return;
  }

  var headers = ['Cliente', 'C.I. / RIF', 'Teléfono', 'Límite Crédito ($)', 'Deuda Actual ($)', 'Deuda en Bs.', 'Cupo Disponible ($)', 'Plazo (Días)', 'Estado'];
  var rows = customers.map(function(c) {
    var debt = Number(c.currentDebt !== undefined ? c.currentDebt : c.currentDebtUsd) || 0;
    var limit = Number(c.creditLimit !== undefined ? c.creditLimit : c.creditLimitUsd) || 0;
    var avail = Math.max(0, limit - debt);
    var debtBs = debt * bcv;
    return [
      '"' + (c.name || '').replace(/"/g, '""') + '"',
      '"' + (c.docNumber || c.rfc || '').replace(/"/g, '""') + '"',
      '"' + (c.phone || '').replace(/"/g, '""') + '"',
      limit.toFixed(2),
      debt.toFixed(2),
      debtBs.toFixed(2),
      avail.toFixed(2),
      c.creditDays || 15,
      c.creditStatus || 'ACTIVE'
    ].join(',');
  });

  var csvContent = '\uFEFF' + headers.join(',') + '\n' + rows.join('\n');
  var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  var link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'Cuentas_Por_Cobrar_FerreMax_' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  showToast('Cuentas por cobrar exportadas a CSV con éxito.', 'ok', 'Exportación');
}

function initClientesModule() {
  var searchInput = $('#customer-search-q');
  if (searchInput) {
    var debounceTimer = null;
    searchInput.addEventListener('input', function(e) {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(function() {
        State.ui.customerSearchQ = e.target.value;
        var container = $('#customers-cards-container');
        if (container) {
          var q = (State.ui.customerSearchQ || '').toLowerCase().trim();
          var list = DB.customers || [];
          var filtered = list.filter(function(c) {
            if (q) {
              var n = (c.name || '').toLowerCase();
              var r = (c.docNumber || c.rfc || '').toLowerCase();
              var p = (c.phone || '').toLowerCase();
              if (!n.includes(q) && !r.includes(q) && !p.includes(q)) return false;
            }
            if (State.ui.customersTab === 'deudores') {
              return (Number(c.currentDebt !== undefined ? c.currentDebt : c.currentDebtUsd) || 0) > 0.01;
            }
            return true;
          });
          container.innerHTML = renderCustomersCards(filtered, State.ui.customersTab || 'deudores');
        }
      }, 150);
    });
  }

  // Sincronizar en segundo plano con la base de datos sin bucle recursivo de render()
  loadCustomersFromAPI(true).then(function() {
    if (State.path.indexOf('/admin/clientes') !== 0) return;

    var list = DB.customers || [];
    var abonosList = DB.abonos || [];
    var debtors = list.filter(function(c) {
      return (Number(c.currentDebt !== undefined ? c.currentDebt : c.currentDebtUsd) || 0) > 0.01;
    });
    var tab = State.ui.customersTab || (debtors.length > 0 ? 'deudores' : 'todos');
    var q = (State.ui.customerSearchQ || '').toLowerCase().trim();

    // Actualizar KPIs si el contenedor existe
    var kpiGrid = $('#customers-kpi-grid');
    if (kpiGrid && typeof renderCustomersKpisHtml === 'function') {
      kpiGrid.innerHTML = renderCustomersKpisHtml(true);
      $$('.rv', kpiGrid).forEach(function(el) { el.classList.add('in'); });
      initCharts(kpiGrid);
    }

    // Actualizar tarjetas de clientes si estamos en pestaña de deudores o todos
    var container = $('#customers-cards-container');
    if (container) {
      var filtered = list.filter(function(c) {
        if (q) {
          var n = (c.name || '').toLowerCase();
          var r = (c.docNumber || c.rfc || '').toLowerCase();
          var p = (c.phone || '').toLowerCase();
          if (!n.includes(q) && !r.includes(q) && !p.includes(q)) return false;
        }
        if (tab === 'deudores') {
          return (Number(c.currentDebt !== undefined ? c.currentDebt : c.currentDebtUsd) || 0) > 0.01;
        }
        return true;
      });
      container.innerHTML = renderCustomersCards(filtered, tab);
    }

    // Actualizar tabla de abonos si estamos en la pestaña de abonos
    var abonosContainer = $('#abonos-table-container');
    if (abonosContainer) {
      abonosContainer.innerHTML = renderAbonosTable(abonosList);
    }

    // Actualizar contadores numéricos en pestañas
    var bDeu = document.querySelector('[data-tab="deudores"] .badge');
    if (bDeu) bDeu.textContent = list.filter(function(c){ return (Number(c.currentDebt !== undefined ? c.currentDebt : c.currentDebtUsd) || 0) > 0.01; }).length;
    var bAll = document.querySelector('[data-tab="todos"] .badge');
    if (bAll) bAll.textContent = list.length;
    var bAbo = document.querySelector('[data-tab="abonos"] .badge');
    if (bAbo) bAbo.textContent = abonosList.length;
  });
}

function exportCSV(what){
  var name='reporte', rows=[];
  if(what==='ventas'){ name='ventas-30d'; rows=[['Folio','Cliente','Fecha','Canal','Pago','Subtotal','IVA','Total','Estado']];
    DB.orders.forEach(function(o){ rows.push([o.folio,o.customer,new Date(o.date).toISOString(),o.channel,o.pay||'',o.sub.toFixed(2),o.iva.toFixed(2),o.total.toFixed(2),o.status]); }); }
  else if(what==='inventario'){ name='inventario'; rows=[['sku','nombre','categoria','precio_usd','costo_usd','stock','stock_minimo','codigo_barra','descripcion','destacado']];
    DB.products.forEach(function(p){ rows.push([p.sku,p.name,catName(p.cat),Number(p.price||0).toFixed(2),Number(p.cost||0).toFixed(2),p.stock,p.min,p.barcode||'',p.desc||'',p.badge==='Top'||p.badge==='Más vendido'?'SI':'NO']); }); }
  else if(what==='clientes'){ name='clientes'; rows=[['Nombre','Email','Teléfono','RFC','Ciudad','Segmento','Desde']];
    DB.customers.forEach(function(c){ rows.push([c.name,c.email,c.phone,c.rfc||'',c.city,c.seg,c.since]); }); }
  else if(what==='facturas'){ name='facturas'; rows=[['Folio','Orden','Cliente','RFC','Fecha','Subtotal','IVA','Total','Estado']];
    DB.invoices.forEach(function(i){ rows.push([i.folio,i.orderId,i.customer,i.rfc,new Date(i.date).toISOString().slice(0,10),i.sub.toFixed(2),i.iva.toFixed(2),i.total.toFixed(2),i.status]); }); }
  else if(what==='seguridad'){ name='bitacora-seguridad'; rows=[['Momento','Evento','Usuario','IP','Nivel']];
    DB.secEvents.forEach(function(e){ rows.push([e.t,e.ev,e.who,e.ip,e.lvl]); }); }
  else if(what==='roadmap'){ name='roadmap'; rows=[['Fase','Título','Tarea','Estado']];
    DB.roadmap.forEach(function(p){ p.tasks.forEach(function(t){ rows.push([p.phase,p.title,t[0],t[1]?'Completada':'Pendiente']); }); }); }
  else if(what==='reporte'){ name='top-productos'; rows=[['SKU','Producto','Unidades','Ingresos']];
    topProducts(20).forEach(function(t){ var u=DB.orders.reduce(function(a,o){return a+o.items.filter(function(i){return i.id===t.id;}).reduce(function(b,i){return b+i.qty;},0);},0);
      rows.push([t.p.sku,t.p.name,u,t.v.toFixed(2)]); }); }
  else { name='respaldo-ferremax'; rows=[['Tabla','Registros'],['productos',DB.products.length],['ordenes',DB.orders.length],['clientes',DB.customers.length],['facturas',DB.invoices.length]]; }
  downloadCSV(name+'-'+new Date().toISOString().slice(0,10)+'.csv',rows);
  Bus.emit('reportes.exportar',name+'.csv · '+(rows.length-1)+' filas',{module:'reportes'});
  showToast(name+'.csv descargado con '+(rows.length-1)+' registros.','ok','Exportación lista');
}
function downloadCSV(filename,rows){
  var csv=rows.map(function(r){ return r.map(function(c){ return '"'+String(c==null?'':c).replace(/"/g,'""')+'"'; }).join(','); }).join('\r\n');
  var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },1500);
}

    '<div class="search-wrap">'+I.search+'<input id="cmdk-in" placeholder="Escribe un comando, producto o cliente…" aria-label="Búsqueda global"></div>'+
    '<div class="cmdk-list" id="cmdk-list"></div>'+

    '<span style="margin-left:auto">Búsqueda global · Ctrl K</span></div></div></div>');
  var input=$('#cmdk-in'), list=$('#cmdk-list');

    filtered=[]; var html='', idx=0;
    order.forEach(function(g){ html+='<div class="xs muted" style="padding:9px 13px 4px;text-transform:uppercase;letter-spacing:.06em;font-weight:700">'+g+'</div>';
      groups[g].forEach(function(c){ filtered.push(c); var i=idx++;

      el.onmouseenter=function(){ sel=+el.getAttribute('data-i'); $$('.cmdk-item',list).forEach(function(x){x.classList.remove('sel');}); el.classList.add('sel'); };
    });
  }
  input.addEventListener('input',function(){ var q=input.value.toLowerCase(); sel=0;
    filtered=cmds.filter(function(c){ return c.t.toLowerCase().indexOf(q)>=0||c.g.toLowerCase().indexOf(q)>=0; }); paint(); });
  input.addEventListener('keydown',function(ev){
    if(ev.key==='ArrowDown'){ ev.preventDefault(); sel=Math.min(filtered.length-1,sel+1); paint(); scrollSel(); }
    if(ev.key==='ArrowUp'){ ev.preventDefault(); sel=Math.max(0,sel-1); paint(); scrollSel(); }
    if(ev.key==='Enter'){ ev.preventDefault(); var f=filtered[sel]; closeOverlay(entry); if(f) f.run(); }
  });
  function scrollSel(){ var el=$('.cmdk-item.sel',list); if(el) el.scrollIntoView({block:'nearest'}); }
  paint(); setTimeout(function(){ input.focus(); },60);
}

var tourStep=0;
function startTour(){ tourStep=0; if(!$('#admin-root')){ go('/admin/dashboard'); setTimeout(drawTour,600); return; } drawTour(); }
function drawTour(){
  endTour(true);
  var step=TOUR[tourStep]; if(!step) return;
  var target=$(step.s); if(!target){ tourStep++; return drawTour(); }
  target.scrollIntoView({block:'center',behavior:'smooth'});
  var r=target.getBoundingClientRect();
  var spot=document.createElement('div'); spot.className='spot';
  spot.style.cssText='left:'+(r.left-7)+'px;top:'+(r.top-7)+'px;width:'+(r.width+14)+'px;height:'+(r.height+14)+'px';
  var card=document.createElement('div'); card.className='tour-card';
  card.innerHTML='<span class="badge b-acc" style="margin-bottom:10px">Paso '+(tourStep+1)+' de '+TOUR.length+'</span><h4>'+step.t+'</h4><p>'+step.d+'</p>'+
    '<div class="row" style="margin-top:16px;gap:8px"><button class="btn btn-sm btn-ghost" type="button" data-t="skip">Omitir tour</button><div style="flex:1"></div>'+
    (tourStep>0?'<button class="btn btn-sm btn-ghost" type="button" data-t="prev">Atrás</button>':'')+
    '<button class="btn btn-sm btn-primary" type="button" data-t="next">'+(tourStep===TOUR.length-1?'Terminar':'Siguiente')+'</button></div>';
  document.body.appendChild(spot); document.body.appendChild(card);
  var below=r.bottom+240<innerHeight;
  card.style.left=clamp(r.left,16,Math.max(16,innerWidth-360))+'px';
  card.style.top=(below?r.bottom+16:Math.max(16,r.top-card.offsetHeight-16))+'px';
  card.onclick=function(ev){ var b=ev.target.closest('[data-t]'); if(!b) return;
    if(b.getAttribute('data-t')==='skip'){ endTour(); showToast('Tour omitido. Puedes retomarlo con el botón ? del encabezado.','info','Guía'); }
    if(b.getAttribute('data-t')==='prev'){ tourStep--; drawTour(); }
    if(b.getAttribute('data-t')==='next'){ tourStep++; if(tourStep>=TOUR.length){ endTour(); showToast('Tour terminado. Explora los módulos cuando quieras.','ok','Guía'); } else drawTour(); } };
}
function endTour(silent){ $$('.spot,.tour-card').forEach(function(n){ n.remove(); }); if(!silent) tourStep=0; }

    var uRole = (State.session && State.session.role) ? State.session.role : 'CASHIER';
    var cScreen = State.path || '/admin/pos';

    var res = await fetch(API_URL + '/ai/help-copilot', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': AUTH_TOKEN ? ('Bearer ' + AUTH_TOKEN) : ''
      },
      body: JSON.stringify({
        question: queryText,
        role: uRole,
        currentScreen: cScreen
      })
    });

    if(!res.ok){
      var errData = await res.json().catch(function(){ return {}; });
      throw new Error(errData.message || ('Error HTTP ' + res.status));
    }

    var data = await res.json();
    var reply = data.reply || '';
    var isFallback = !!data.isLocalFallback;
    var modelBadge = isFallback 
      ? '<span class="badge b-mut xs" title="Respuesta generada desde el Manual Operativo local sin conexión requerida">📚 Manual Operativo Local</span>'
      : '<span class="badge b-acc xs" title="Respuesta generada con IA Google Gemini">✨ Gemini AI Copilot</span>';

    // Formatear Markdown básico
    var formattedReply = reply
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
      .replace(/`([^`]+)`/g, '<code class="mono" style="background:var(--surface-3);padding:2px 6px;border-radius:4px;font-size:12px">$1</code>')
      .replace(/\n\n/g, '<br><br>')
      .replace(/\n- /g, '<br>• ');

    resBox.innerHTML = 
      '<div class="card card-pad" style="border:1.5px solid var(--accent);background:var(--surface);box-shadow:var(--sh-2)">' +
        '<div class="spread" style="margin-bottom:12px;border-bottom:1px solid var(--border);padding-bottom:10px">' +
          '<div class="row" style="gap:8px">' +
            '<span class="brand-mark" style="width:26px;height:26px;font-size:13px;background:var(--accent);color:#fff">' + I.spark + '</span>' +
            '<div><b class="sm" style="display:block">Respuesta Paso a Paso del Copiloto</b>' +
            '<span class="xs muted">Pregunta: “' + esc(queryText) + '”</span></div>' +
          '</div>' +
          modelBadge +
        '</div>' +
        '<div style="font-size:14px;line-height:1.6;color:var(--text)">' +
          formattedReply +
        '</div>' +
        '<div class="row" style="gap:8px;margin-top:14px;justify-content:flex-end">' +
          '<button class="btn btn-xs btn-ghost" type="button" onclick="navigator.clipboard.writeText(document.getElementById(\'help-copilot-response\').innerText);showToast(\'Guía copiada al portapapeles\',\'ok\');">' +
            I.copy + ' Copiar Instrucciones' +
          '</button>' +
        '</div>' +
      '</div>';

    resBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  }catch(err){
    resBox.innerHTML = 
      '<div class="card card-pad" style="border:1px solid var(--danger);background:var(--danger-soft)">' +
        '<b class="sm" style="color:var(--danger)">No se pudo consultar el copiloto: ' + esc(err.message) + '</b>' +
        '<p class="xs muted" style="margin-top:6px">Revisa que el backend esté activo en http://localhost:4000.</p>' +
      '</div>';
  }finally{
    if(btn) btn.disabled = false;
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   19. ARRANQUE & SINCRONIZACIÓN CON BACKEND API
   ══════════════════════════════════════════════════════════════════════════ */
async function syncFromBackend(){
  try{
    // 0. Verificar sesión activa con el backend API vía auth/me
    if(AUTH_TOKEN){
      try{
        var rMe = await fetch(API_URL + '/auth/me', {
          headers: { 'Authorization': 'Bearer ' + AUTH_TOKEN }
        });
        if(rMe.ok){
          var dMe = await rMe.json();
          if(dMe && dMe.user){
            var u = dMe.user;
            var rName = ROLE_MAP[u.role] || u.role;
            State.session = {
              id: u.userId || u.id,
              name: u.name,
              email: u.email,
              role: u.role,
              roleDisplayName: rName,
              token: AUTH_TOKEN,
              since: State.session && State.session.since ? State.session.since : new Date()
            };
            localStorage.setItem('ferremax_session', JSON.stringify(State.session));
            API_ONLINE = true;
          }
        } else if(rMe.status === 401){
          AUTH_TOKEN = null;
          State.session = null;
          localStorage.removeItem('ferremax_token');
          localStorage.removeItem('ferremax_session');
          if(State.path.indexOf('/admin') === 0){
            showToast('Tu sesión ha expirado o el token es inválido. Ingresa de nuevo.', 'warn', 'Sesión expirada');
            go('/login');
            return;
          }
        }
      }catch(e){
        console.warn('Verificación auth/me no disponible (modo offline):', e);
      }
    }

    // 1. Cargar configuración completa de tienda y tasa BCV oficial
    try{
      var rCfg=await fetch(API_URL+'/storefront/config');
      if(rCfg.ok){
        var dCfg=await rCfg.json();
        if(dCfg){
          STORE_CONFIG.storeName = dCfg.storeName || STORE_CONFIG.storeName;
          if(dCfg.storeSlogan !== undefined) STORE_CONFIG.storeSlogan = dCfg.storeSlogan;
          if(dCfg.logoUrl !== undefined) STORE_CONFIG.logoUrl = dCfg.logoUrl;
          if(dCfg.colorPrimary) {
            STORE_CONFIG.colorPrimary = dCfg.colorPrimary;
            State.accent = dCfg.colorPrimary;
          }
          if(dCfg.colorSecondary) {
            STORE_CONFIG.colorSecondary = dCfg.colorSecondary;
          }
          applyThemeTokens();

          STORE_CONFIG.storeRif = dCfg.storeRif || STORE_CONFIG.storeRif;
          STORE_CONFIG.address = dCfg.address || STORE_CONFIG.address;
          STORE_CONFIG.phone = dCfg.phone || STORE_CONFIG.phone;
          STORE_CONFIG.email = dCfg.email || STORE_CONFIG.email;
          STORE_CONFIG.schedule = dCfg.schedule || STORE_CONFIG.schedule;
          STORE_CONFIG.bannerText = dCfg.bannerText || STORE_CONFIG.bannerText;
          if(dCfg.ivaPercent !== undefined) STORE_CONFIG.ivaPercent = Number(dCfg.ivaPercent);
          if(dCfg.igtfPercent !== undefined) STORE_CONFIG.igtfPercent = Number(dCfg.igtfPercent);
          if(dCfg.pagoMovil) STORE_CONFIG.pagoMovil = dCfg.pagoMovil;
          if(dCfg.transferencia) STORE_CONFIG.transferencia = dCfg.transferencia;
          if(dCfg.zelle) STORE_CONFIG.zelle = dCfg.zelle;
          if(dCfg.delivery) STORE_CONFIG.delivery = dCfg.delivery;
          if(dCfg.bcvRate && dCfg.bcvRate > 0) BCV_RATE = dCfg.bcvRate;
          API_ONLINE = true;
        }
      }
    }catch(e){ console.warn('Error al cargar config de tienda:', e); }

    // 2. Consulta adicional de tasa BCV si no respondió config
    if(!API_ONLINE){
      var rRate=await fetch(API_URL+'/rates/bcv');
      if(rRate.ok){
        var dRate=await rRate.json();
        if(dRate.rate && dRate.rate>0) BCV_RATE=dRate.rate;
        API_ONLINE=true;
      }
    }

    // 3. Catálogo de productos desde la base de datos
    var rCat=await fetch(API_URL+'/storefront/catalog');
    if(rCat.ok){
      var dCat=await rCat.json();
      if(dCat.products && dCat.products.length){
        var arts=['drill','screws','hammer','saw','helmet','toolbox','paint','laser','reel','wrench'];
        DB.products=dCat.products.map(function(bp,idx){
          var pImgs = (bp.images && bp.images.length) ? bp.images : (bp.imageUrl ? [bp.imageUrl] : []);
          return {
            id:bp.id,
            sku:bp.sku,
            slug:bp.slug,
            name:bp.name,
            cat:bp.category?bp.category.slug:'electricas',
            price:bp.priceUsd,
            cost:bp.costUsd!==undefined?bp.costUsd:(bp.priceUsd*0.7),
            stock:bp.stockAvailable!==undefined?bp.stockAvailable:15,
            min:bp.minStock!==undefined?bp.minStock:5,
            unit:bp.unit || 'UND',
            purchaseUnit:bp.purchaseUnit || bp.unit || 'UND',
            unitRatio:Number(bp.unitRatio || 1.0),
            hasSerial:Boolean(bp.hasSerial),
            warrantyMonths:Number(bp.warrantyMonths || 0),
            location:bp.location || '',
            rating:4.8,
            reviews:42+idx*7,
            art:arts[idx%arts.length],
            badge:bp.featured?'Destacado':(bp.inStock?'':'Agotado'),
            desc:bp.description||'Herramienta de primera calidad con garantía FerreMax.',
            imageUrl:bp.imageUrl || (pImgs.length ? pImgs[0] : null),
            images:pImgs,
            specs:[['Código SKU',bp.sku],['Unidad de venta',bp.unit||'UND'],['Disponibilidad',bp.inStock?'En stock':'Agotado'],['Garantía',bp.warrantyMonths?bp.warrantyMonths+' meses':'Garantía de fábrica']]
          };
        });
      }
    }

    // 4. Sincronizar Personal y Roles desde el backend
    await loadUsersAndRoles();

    // 5. Sincronizar Pedidos
    if(AUTH_TOKEN){
      try{
        var rOrders=await fetch(API_URL+'/orders',{
          headers:{'Authorization':'Bearer '+AUTH_TOKEN}
        });
        if(rOrders.ok){
          var dOrders=await rOrders.json();
          if(dOrders && dOrders.length){
            DB.orders=dOrders.map(function(o){
              return {
                folio:o.orderNumber,
                customerId:o.customerId||'c1',
                customer:o.customerName,
                items:(o.items||[]).map(function(it){ return {id:it.productId,sku:it.productName,name:it.productName,price:it.priceUsd,qty:it.quantity}; }),
                sub:o.subtotalUsd,
                iva:o.taxUsd,
                igtf:o.igtfUsd||0,
                total:o.totalUsd,
                totalBs:o.totalBs,
                status:o.status==='PAID'?'pagada':(o.status==='CANCELLED'?'cancelada':'preparando'),
                channel:o.channel==='POS'?'POS mostrador':'Tienda online',
                date:new Date(o.createdAt),
                pay:o.paymentMethod==='PAGO_MOVIL'?'Pago Móvil':(o.paymentMethod==='EFECTIVO_USD'?'Efectivo USD':o.paymentMethod),
                ref:o.paymentReference
              };
            });
          }
        }
      }catch(e){}
    }

    // 6. Sincronizar Almacenes y Traslados
    try{
      var rWh=await fetch(API_URL+'/warehouses');
      if(rWh.ok){
        var dWh=await rWh.json();
        if(dWh && dWh.length) DB.warehouses=dWh;
      }
      var rTr=await fetch(API_URL+'/warehouses/transfers/history');
      if(rTr.ok){
        var dTr=await rTr.json();
        if(dTr && dTr.length) DB.transfers=dTr;
      }
    }catch(e){}

    // 7. Sincronizar Facturación Fiscal SENIAT, Compras Mayoristas, BI y Trazabilidad
    try {
      await loadFiscalData();
      await loadPurchasesData();
      await loadParetoData();
      await loadExecutiveData();
      await loadPredictiveStockData();
      await loadSerialsData();
      await loadPayrollData();
      await loadBannersFromAPI();
    }catch(e){}

    fetchGeminiStatus();
    render();
    if(API_ONLINE) showToast('Conectado a la API. Tasa BCV: Bs. '+BCV_RATE.toFixed(2)+' / $ | IVA: '+STORE_CONFIG.ivaPercent+'% | Personal: '+SYSTEM_USERS.length+' empleados','ok','Backend en línea');
  }catch(err){
    console.warn('API local no responde, usando base local:',err);
  }
}
