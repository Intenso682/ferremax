      paneZ.style.display = 'block';
    };
  }

  var btnXWa = $('#btn-x-wa');
  if (btnXWa) {
    btnXWa.onclick = function() {
      sendCorteViaWhatsApp(summary, 'X');
    };
  }
  var btnXPng = $('#btn-x-png');
  if (btnXPng) {
    btnXPng.onclick = function() {
      downloadCorteAsImage(summary, 'X');
    };
  }
  var btnXPdf = $('#btn-x-pdf');
  if (btnXPdf) {
    btnXPdf.onclick = function() {
      printCortePDF(summary, 'X');
    };
  }

  var inUsd = $('#arq-usd');
  var diffBox = $('#arq-diff-box');
  var diffVal = $('#arq-diff-val');
  var diffBadge = $('#arq-diff-badge');
  var calcDetail = $('#arq-calc-detail');

  function updateZCalc() {
    var dec = Number(inUsd.value || 0);
    var diff = Math.round((dec - expectedUsd) * 100) / 100;
    if (calcDetail) calcDetail.textContent = 'Contado: $ ' + dec.toFixed(2) + ' | Esperado: $ ' + expectedUsd.toFixed(2);
    if (diffVal) diffVal.textContent = (diff > 0 ? '+$ ' : (diff < 0 ? '-$ ' : '$ ')) + Math.abs(diff).toFixed(2);

    if (diff === 0) {
      diffBox.style.background = 'var(--ok-soft)';
      diffBox.style.borderColor = 'var(--ok)';
      diffVal.style.color = 'var(--ok)';
      diffBadge.className = 'badge b-ok';
      diffBadge.textContent = 'CUADRADO';
    } else if (diff > 0) {
      diffBox.style.background = 'var(--info-soft)';
      diffBox.style.borderColor = 'var(--info)';
      diffVal.style.color = 'var(--info)';
      diffBadge.className = 'badge b-info';
      diffBadge.textContent = 'SOBRANTE (+$' + diff.toFixed(2) + ')';
    } else {
      diffBox.style.background = 'var(--danger-soft)';
      diffBox.style.borderColor = 'var(--danger)';
      diffVal.style.color = 'var(--danger)';
      diffBadge.className = 'badge b-danger';
      diffBadge.textContent = 'FALTANTE (-$' + Math.abs(diff).toFixed(2) + ')';
    }
  }

  if (inUsd) inUsd.addEventListener('input', updateZCalc);

  var btnSubmitZ = $('#btn-submit-corte-z');
  if (btnSubmitZ) {
    btnSubmitZ.onclick = async function() {
      var declaredUsd = Number(inUsd ? inUsd.value : expectedUsd);
      var declaredBs = Number($('#arq-bs') ? $('#arq-bs').value : expectedBs);
      var declaredPto = Number($('#arq-pto') ? $('#arq-pto').value : 0);
      var declaredPm = Number($('#arq-pm') ? $('#arq-pm').value : 0);
      var notes = $('#arq-notes') ? $('#arq-notes').value.trim() : '';

      var zPayload = {
        cashierName: State.session ? State.session.name : 'Cajero Mostrador',
        initialCashUsd: initialCashUsd,
        initialCashBs: initialCashBs,
        declaredEfectivoUsd: declaredUsd,
        declaredEfectivoBs: declaredBs,
        declaredPagoMovilBs: declaredPm,
        declaredPuntoBs: declaredPto,
        notes: notes
      };

      btnSubmitZ.disabled = true;
      btnSubmitZ.textContent = 'Procesando Cierre Z…';

      try {
        var respZ = await fetch(API_URL + '/pos/cash/corte-z', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(zPayload)
        });

        if (respZ.ok) {
          var rz = await respZ.json();
          closeAllOverlays();
          Bus.emit('ventas.corte', rz.corte.closeNumber + ' · Cierre registrado', { module: 'ventas' });
          if (Array.isArray(CASH_CLOSES_LIST)) CASH_CLOSES_LIST.unshift(rz.corte);
          openCorteZSuccessModal(rz.corte);
          showToast('Turno cerrado exitosamente con folio ' + rz.corte.closeNumber, 'ok', 'Corte Z');
          return;
        }
      } catch (e) {
        console.warn('Error llamando backend Corte Z, simulando localmente:', e);
      }

      var diffLocal = Math.round((declaredUsd - expectedUsd) * 100) / 100;
      var simulatedZ = {
        closeNumber: 'Z-' + (1001 + DB.orders.length),
        type: 'Z',
        cashierName: zPayload.cashierName,
        closingDate: new Date(),
        totalSalesUsd: summary.totalSalesUsd,
        totalSalesBs: summary.totalSalesBs,
        salesCount: summary.salesCount,
        bcvRate: bcv,
        breakdown: summary.breakdown,
        declared: { declaredEfectivoUsd: declaredUsd },
        expected: { expectedEfectivoUsd: expectedUsd },
        differences: { diffUsd: diffLocal },
        storeName: STORE_CONFIG.storeName,
        storeRif: STORE_CONFIG.storeRif
      };
      closeAllOverlays();
      Bus.emit('ventas.corte', simulatedZ.closeNumber + ' · Cierre local', { module: 'ventas' });
      if (Array.isArray(CASH_CLOSES_LIST)) CASH_CLOSES_LIST.unshift(simulatedZ);
      openCorteZSuccessModal(simulatedZ);
      showToast('Turno cerrado exitosamente.', 'ok', 'Corte Z');
    };
  }
}

/* ==========================================================================
   AUDITORÍA Y HISTORIAL DE CORTES DE CAJA (X y Z)

function findCorte(idOrFolio) {
  if (!idOrFolio) return null;
  var str = String(idOrFolio).trim();
  return CASH_CLOSES_LIST.filter(function(c) {
    return c.id === str || c.closeNumber === str;
  })[0] || null;
}

function renderCashCloseTableRows() {
  var filterType = State.ui.cashHistoryType || 'ALL';
  var diffOnly = State.ui.cashHistoryDiffOnly || false;
  var q = (State.ui.cashHistoryQ || '').toLowerCase().trim();

  var list = CASH_CLOSES_LIST.filter(function(c) {
    if (filterType !== 'ALL' && c.type !== filterType) return false;
    if (diffOnly && Math.abs(Number(c.diffUsd || 0)) <= 0.01) return false;
    if (q) {
      var num = (c.closeNumber || '').toLowerCase();
      var cajero = (c.cashierName || '').toLowerCase();
      var notas = (c.notes || '').toLowerCase();
      if (!num.includes(q) && !cajero.includes(q) && !notas.includes(q)) return false;
    }
    return true;
  });

  if (!list.length) {
    return '<div style="text-align:center;padding:48px 20px;color:var(--muted)">' +
      '<div style="width:54px;height:54px;border-radius:50%;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;margin:0 auto 12px">' + I.receipt + '</div>' +
      '<h4 style="margin-bottom:6px;color:var(--text)">No se encontraron registros de cortes de caja</h4>' +
      '<p class="xs muted" style="margin-bottom:16px">' + (q || diffOnly || filterType !== 'ALL' ? 'Prueba ajustando los filtros de búsqueda o tipo de corte.' : 'Aún no se han ejecutado cierres definitivos (Z) o auditorías (X).') + '</p>' +
      '<button class="btn btn-primary btn-sm" type="button" data-action="open-corte-modal">' + I.lock + ' Realizar Cierre de Turno (Corte Z)</button>' +
    '</div>';
  }

  return '<div class="tbl-scroll">' +
    '<table class="tbl">' +
      '<thead>' +
        '<tr>' +
          '<th>Folio & Tipo</th>' +
          '<th>Fecha & Hora</th>' +
          '<th>Cajero Responsable</th>' +
          '<th style="text-align:center">Ventas</th>' +
          '<th>Total Recaudado ($ y Bs.)</th>' +
          '<th>Conciliación / Arqueo</th>' +
          '<th style="text-align:right">Acciones</th>' +
        '</tr>' +
      '</thead>' +
      '<tbody>' +
        list.map(function(c) {
          var isZ = c.type === 'Z';
          var typeBadge = isZ
            ? '<span class="badge b-ok" style="font-weight:700">🔒 CORTE Z (CIERRE)</span>'
            : '<span class="badge b-info" style="font-weight:700">⏱️ CORTE X (PARCIAL)</span>';

          var diffUsd = Number(c.diffUsd || 0);
          var statusBadge = '';
          if (isZ) {
            if (diffUsd === 0) {
              statusBadge = '<span class="badge b-ok">✅ CUADRADO</span>';
            } else if (diffUsd > 0) {
              statusBadge = '<span class="badge b-warn">🟡 SOBRANTE (+$' + diffUsd.toFixed(2) + ')</span>';
            } else {
              statusBadge = '<span class="badge b-danger">🔴 FALTANTE (-$' + Math.abs(diffUsd).toFixed(2) + ')</span>';
            }
          } else {
            statusBadge = '<span class="badge b-mut">AUDITORÍA ACTIVA</span>';
          }

          var bcv = c.bcvRate || BCV_RATE || 877.90;
          var totalUsd = Number(c.totalSalesUsd || 0);
          var totalBs = Number(c.totalSalesBs || (totalUsd * bcv));

          return '<tr>' +
            '<td data-l="Folio">' +
              '<b class="mono" style="font-size:14px;color:var(--accent)">' + esc(c.closeNumber) + '</b><br>' +
              typeBadge +
            '</td>' +
            '<td data-l="Fecha">' +
              '<span class="xs muted">' + fmtDateTime(c.closingDate || c.createdAt) + '</span><br>' +
              '<span class="xs muted mono">Tasa BCV: Bs. ' + Number(bcv).toFixed(2) + '</span>' +
            '</td>' +
            '<td data-l="Cajero">' +
              '<b>' + esc(c.cashierName || 'Cajero Mostrador') + '</b><br>' +
              (c.notes ? '<span class="xs muted" title="' + esc(c.notes) + '">📝 ' + esc(c.notes.slice(0, 32)) + (c.notes.length > 32 ? '…' : '') + '</span>' : '<span class="xs muted">Sin notas</span>') +
            '</td>' +
            '<td data-l="Ventas" style="text-align:center">' +
              '<b class="mono">' + (c.salesCount || 0) + '</b><br><span class="xs muted">operaciones</span>' +
            '</td>' +
            '<td data-l="Recaudado">' +
              '<b class="mono sm" style="color:var(--accent);font-size:14px">$ ' + totalUsd.toFixed(2) + '</b><br>' +
              '<span class="xs mono" style="color:var(--ok)">Bs. ' + totalBs.toLocaleString('es-VE', {minimumFractionDigits:2}) + '</span>' +
            '</td>' +
            '<td data-l="Arqueo">' +
              statusBadge +
              (isZ && c.declaredEfectivoUsd !== undefined ? '<br><span class="xs muted mono">Contado: $' + Number(c.declaredEfectivoUsd).toFixed(2) + '</span>' : '') +
            '</td>' +
            '<td data-l="Acciones" style="text-align:right">' +
              '<div class="row" style="gap:5px;justify-content:flex-end">' +
                '<button class="btn btn-sm btn-ghost" type="button" data-action="view-corte-detail" data-id="' + esc(c.id || c.closeNumber) + '" title="Ver auditoría completa">' + I.eye + ' Detalle</button>' +
                '<button class="btn btn-sm btn-ghost" type="button" data-action="wa-corte-history" data-id="' + esc(c.id || c.closeNumber) + '" title="Enviar a Gerencia por WhatsApp">' + I.wa + '</button>' +
                '<button class="btn btn-sm btn-ghost" type="button" data-action="png-corte-history" data-id="' + esc(c.id || c.closeNumber) + '" title="Descargar Imagen PNG">' + I.download + '</button>' +
                '<button class="btn btn-sm btn-ghost" type="button" data-action="pdf-corte-history" data-id="' + esc(c.id || c.closeNumber) + '" title="Imprimir PDF">' + I.print + '</button>' +
              '</div>' +
            '</td>' +
          '</tr>';
        }).join('') +
      '</tbody>' +
    '</table>' +
  '</div>';
}

var currentModalImages = [];

function compressImageFile(file, maxWidth, maxHeight, quality) {
  maxWidth = maxWidth || 1200;
  maxHeight = maxHeight || 1200;
  quality = quality || 0.82;
  return new Promise(function(resolve, reject) {
    var reader = new FileReader();
    reader.onerror = reject;
    reader.onload = function(e) {
      var img = new Image();
      img.onerror = reject;
      img.onload = function() {
        var w = img.width, h = img.height;
        if (w > maxWidth || h > maxHeight) {
          if (w / h > maxWidth / maxHeight) {
            h = Math.round((h * maxWidth) / w);
            w = maxWidth;
          } else {
            w = Math.round((w * maxHeight) / h);
            h = maxHeight;
          }
        }
        var canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, w, h);

        var dataUrl = canvas.toDataURL('image/webp', quality);
        if (!dataUrl.startsWith('data:image/webp')) {
          dataUrl = canvas.toDataURL('image/jpeg', quality);
        }
        resolve(dataUrl);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function bindPhotoUploader() {
  var fileInput = $('#pr-file-input');
  var addBtn = $('#btn-add-photos');
  var statusSpan = $('#img-compress-status');

  if (addBtn && fileInput) {
    addBtn.onclick = function() {
      if (currentModalImages.length >= 3) {
        showToast('Ya alcanzaste el límite de 3 fotos para este producto.', 'warn', 'Límite');
        return;
      }
      fileInput.click();
    };
  }

  if (fileInput) {
    fileInput.onchange = async function(e) {
      var files = Array.from(e.target.files || []);
      if (!files.length) return;

      var available = 3 - currentModalImages.length;
      if (available <= 0) {
        showToast('Solo puedes subir hasta 3 fotos por producto.', 'warn', 'Límite alcanzado');
        fileInput.value = '';
        return;
      }

      if (files.length > available) {
        showToast('Solo se agregarán las primeras ' + available + ' imagen(es) para no exceder el límite de 3.', 'warn', 'Máximo 3 fotos');
        files = files.slice(0, available);
      }

      if (statusSpan) statusSpan.textContent = 'Comprimiendo ' + files.length + ' imagen(es)...';

      for (var i = 0; i < files.length; i++) {
        var f = files[i];
        try {
          var compressed = await compressImageFile(f, 1200, 1200, 0.82);
          currentModalImages.push(compressed);
        } catch (err) {
          console.error('Error al comprimir imagen:', err);
          showToast('No se pudo procesar la imagen ' + f.name, 'err');
        }
      }

      if (statusSpan) statusSpan.textContent = '¡Comprimido y optimizado!';
      setTimeout(function() { if (statusSpan) statusSpan.textContent = ''; }, 2500);

      fileInput.value = '';
      renderProductImagesGrid();
    };
  }
}

  if (sendBtn) {
    sendBtn.onclick = async function() {
      var query = (input ? input.value : '').trim();
      if (!query) return;

      if (historyBox) {
        historyBox.innerHTML += '<div style="display:flex;gap:10px;justify-content:flex-end">'+
          '<div style="background:var(--accent);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:80%">'+esc(query)+'</div>'+
        '</div>';
        historyBox.scrollTop = historyBox.scrollHeight;
      }

      if (input) input.value = '';
      sendBtn.disabled = true;
      var typingId = 'typing-' + Date.now();
      if (historyBox) {
        historyBox.innerHTML += '<div id="' + typingId + '" style="display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px;padding:8px 0">'+
          '<span style="display:inline-block;animation:spin 1s linear infinite">⏳</span> Consultando a Gemini...'+
        '</div>';
        historyBox.scrollTop = historyBox.scrollHeight;
      }

      try {
        var ctxInfo = 'FerreMax Venezuela. Tasa oficial BCV activa: Bs. ' + (BCV_RATE||877.90).toFixed(2) + ' por USD. ' +
          'Total SKU activos: ' + DB.products.length + '. Moneda base: USD con cobro multimoneda en Bolívares. ' +
          'Impuestos venezolanos: IVA 16% e IGTF 3% para cobros en divisas efectivo.';
        var resp = await fetch(API_URL + '/ai/admin-query', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + (AUTH_TOKEN || '')
          },
          body: JSON.stringify({ prompt: query, context: ctxInfo })
        });
        var data = await resp.json();
        var typingEl = document.getElementById(typingId);
        if (typingEl) typingEl.remove();

        if (!resp.ok) {
          if (data.error === 'GEMINI_NOT_CONFIGURED') {
            openGeminiKeyModal('Para usar el asistente administrativo, ingresa tu clave gratuita de Google Gemini.');
          } else {
            showToast(data.message || 'Error al consultar con Gemini.', 'err', 'Asistente IA');
          }
          return;
        }

        if (historyBox) {
          var formattedReply = esc(data.reply).replace(/\n/g, '<br>');
          historyBox.innerHTML += '<div style="display:flex;gap:10px;align-items:flex-start">'+
            '<span style="width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent-2),var(--accent));color:#fff;display:grid;place-items:center;flex:none;font-weight:700;font-size:14px">✨</span>'+
            '<div style="background:var(--surface);padding:14px 18px;border-radius:12px;font-size:14px;line-height:1.6;border:1px solid var(--border);flex:1">'+
              formattedReply+
            '</div>'+
          '</div>';
          historyBox.scrollTop = historyBox.scrollHeight;
        }
      } catch(err) {
        var typingEl2 = document.getElementById(typingId);
        if (typingEl2) typingEl2.remove();
        showToast('Error de conexión al consultar el asistente.', 'err');
      } finally {
        sendBtn.disabled = false;
        if (input) input.focus();
      }
    };
  }
}

function initBrandingCard() {
  var nameInp = $('#st-name');
  var sloganInp = $('#st-slogan');
  var logoUrlInp = $('#st-logo-url');
  var fileInp = $('#st-logo-file');
  var previewBox = $('#st-logo-preview');
  var mockupPrev = $('#brand-mockup-prev');
  var priPicker = $('#st-color-pri');
  var priHex = $('#st-color-pri-hex');
  var secPicker = $('#st-color-sec');
  var secHex = $('#st-color-sec-hex');

  function updateMockup() {
    if (!mockupPrev) return;
    var curPri = (priPicker ? priPicker.value : STORE_CONFIG.colorPrimary) || '#0f766e';
    var curSec = (secPicker ? secPicker.value : STORE_CONFIG.colorSecondary) || '#0284c7';
    var curName = (nameInp ? nameInp.value.trim() : '') || STORE_CONFIG.storeName || 'Mi Ferretería';
    var curLogo = (logoUrlInp ? logoUrlInp.value.trim() : '') || STORE_CONFIG.logoUrl || '';

    mockupPrev.style.background = curPri;
    var logoHtml = curLogo ? '<img src="' + esc(curLogo) + '" style="height:26px;max-width:110px;object-fit:contain;background:#fff;padding:2px 6px;border-radius:6px">' : '<span class="brand-mark" style="background:rgba(255,255,255,.2);width:26px;height:26px">' + I.bolt + '</span>';
    mockupPrev.innerHTML = '<div style="display:flex;align-items:center;gap:10px;color:#fff">' +
      logoHtml +
      '<b style="font-size:13.5px">' + esc(curName) + '</b>' +
      '</div>' +
      '<span style="font-size:11px;background:' + curSec + ';color:#fff;padding:3px 9px;border-radius:20px;font-weight:700">Color Secundario</span>';
  }

  function updateLogoPreview(url) {
    if (previewBox) {
      if (url) {
        previewBox.innerHTML = '<img src="' + esc(url) + '" style="max-width:100%;max-height:100%;object-fit:contain;">';
      } else {
        previewBox.innerHTML = '<span class="muted xs" style="text-align:center">Sin logotipo<br>(Usa icono)</span>';
      }
    }
    updateMockup();
  }

  if (nameInp) {
    nameInp.addEventListener('input', updateMockup);
  }

  if (logoUrlInp) {
    logoUrlInp.addEventListener('input', function() {
      updateLogoPreview(logoUrlInp.value.trim());
    });
  }

  if (fileInp) {
    fileInp.addEventListener('change', function(e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      if (file.size > 4 * 1024 * 1024) {
        showToast('El archivo supera los 4MB recomendados.', 'warn', 'Imagen pesada');
      }
      var reader = new FileReader();
      reader.onload = async function(evt) {
        var base64 = evt.target.result;
        showToast('Subiendo logotipo...', 'info');
        try {
          var res = await fetch(API_URL + '/settings/upload-logo', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + (AUTH_TOKEN || '')
            },
            body: JSON.stringify({ imageBase64: base64 })
          });
          var data = await res.json();
          if (res.ok && data.success && data.logoUrl) {
            if (logoUrlInp) logoUrlInp.value = data.logoUrl;
            STORE_CONFIG.logoUrl = data.logoUrl;
            updateLogoPreview(data.logoUrl);
            showToast('Logotipo subido y guardado exitosamente.', 'ok', 'Identidad de Marca');
          } else {
            if (logoUrlInp) logoUrlInp.value = base64;
            STORE_CONFIG.logoUrl = base64;
            updateLogoPreview(base64);
            showToast('Logo cargado como datos base64.', 'info');
          }
        } catch (err) {
          if (logoUrlInp) logoUrlInp.value = base64;
          STORE_CONFIG.logoUrl = base64;
          updateLogoPreview(base64);
          showToast('Logo cargado en vista previa (modo local).', 'info');
        }
      };
      reader.readAsDataURL(file);
    });
  }

  function applyColors(pri, sec) {
    if (priPicker) priPicker.value = pri;
    if (priHex) priHex.value = pri;
    if (secPicker) secPicker.value = sec;
    if (secHex) secHex.value = sec;
    STORE_CONFIG.colorPrimary = pri;
    STORE_CONFIG.colorSecondary = sec;
    State.accent = pri;
    applyThemeTokens();
    updateMockup();
  }

  if (priPicker && priHex) {
    priPicker.addEventListener('input', function() {
      priHex.value = priPicker.value;
      applyColors(priPicker.value, secPicker ? secPicker.value : STORE_CONFIG.colorSecondary);
    });
    priHex.addEventListener('input', function() {
      var val = priHex.value.trim();
      if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
        priPicker.value = val;
        applyColors(val, secPicker ? secPicker.value : STORE_CONFIG.colorSecondary);
      }
    });
  }

  if (secPicker && secHex) {
    secPicker.addEventListener('input', function() {
      secHex.value = secPicker.value;
      applyColors(priPicker ? priPicker.value : STORE_CONFIG.colorPrimary, secPicker.value);
    });
    secHex.addEventListener('input', function() {
      var val = secHex.value.trim();
      if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
        secPicker.value = val;
        applyColors(priPicker ? priPicker.value : STORE_CONFIG.colorPrimary, val);
      }
    });
  }
}

function initGeminiSettingsCard() {
  var badge = $('#gemini-status-badge');
  var keyInput = $('#cfg-gemini-key');
  var modelInput = $('#cfg-gemini-model');
  var toggleBtn = $('#btn-toggle-gemini-key');
  var testBtn = $('#btn-test-gemini');
  var saveBtn = $('#btn-save-gemini');
  var resultSpan = $('#gemini-test-result');

  fetchGeminiStatus().then(function(st){
    if (badge) {
      badge.textContent = st.configured ? 'Conectado (' + (st.maskedKey || 'Activo') + ' · ' + (st.model || 'gemini-3.8-flash') + ')' : 'Sin configurar';
      badge.className = 'badge ' + (st.configured ? 'b-ok' : 'b-warn');
    }
    if (modelInput && st.model) {
      modelInput.value = st.model;
    }
  });

  if (toggleBtn && keyInput) {
    toggleBtn.onclick = function() {
      keyInput.type = keyInput.type === 'password' ? 'text' : 'password';
    };
  }

  if (testBtn) {
    testBtn.onclick = async function() {
      var candidate = (keyInput ? keyInput.value : '').trim();
      testBtn.disabled = true;
      if (resultSpan) resultSpan.textContent = 'Probando conexión...';
      try {
        var resp = await fetch(API_URL + '/ai/test', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + (AUTH_TOKEN || '')
          },
          body: JSON.stringify({ apiKey: candidate || undefined })
        });
        var data = await resp.json();
        if (resp.ok && data.success) {
          if (resultSpan) resultSpan.textContent = '✓ Conexión OK con ' + (data.modelUsed || 'gemini-3.8-flash') + ' (' + data.latencyMs + 'ms)';
          showToast('Conexión con Gemini verificada (' + data.latencyMs + 'ms) usando ' + (data.modelUsed || 'gemini-3.8-flash') + '.', 'ok', 'Prueba exitosa');
        } else {
          if (resultSpan) resultSpan.textContent = '✗ ' + (data.message || 'Error');
          showToast(data.message || 'No se pudo conectar con Gemini.', 'err', 'Fallo de prueba');
        }
      } catch(e) {
        if (resultSpan) resultSpan.textContent = '✗ Error de red';
      } finally {
        testBtn.disabled = false;
      }
    };
  }

  if (saveBtn) {
    saveBtn.onclick = async function() {
      var candidate = (keyInput ? keyInput.value : '').trim();
      var chosenModel = (modelInput ? modelInput.value.trim() : '') || 'gemini-3.8-flash';
      if (!candidate) {
        showToast('Escribe o pega una clave antes de guardar.', 'warn', 'Clave vacía');
        return;
      }
      saveBtn.disabled = true;
      try {
        var resp = await fetch(API_URL + '/ai/config', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + (AUTH_TOKEN || '')
          },
          body: JSON.stringify({ apiKey: candidate, model: chosenModel })
        });
        var data = await resp.json();
        if (resp.ok) {
          GEMINI_STATUS.configured = true;
          GEMINI_STATUS.maskedKey = data.maskedKey;
          GEMINI_STATUS.model = data.model || chosenModel;
          if (badge) {
            badge.textContent = 'Conectado (' + data.maskedKey + ' · ' + GEMINI_STATUS.model + ')';
            badge.className = 'badge b-ok';
          }
          if (resultSpan) resultSpan.textContent = '✓ Guardado con modelo ' + GEMINI_STATUS.model;
          showToast('Google Gemini (' + GEMINI_STATUS.model + ') configurado exitosamente.', 'ok', 'Guardado');
        } else {
          showToast(data.error || 'Error al guardar clave.', 'err');
        }
      } catch(e) {
        showToast('Error de red al guardar la clave.', 'err');
      } finally {
        saveBtn.disabled = false;
      }
    };
  }
}

  var tbody = $('#backup-snapshots-tbody');

  if (!metricsGrid && !tbody) return;

  try {
    var resp = await fetch(API_URL + '/backup/info');

    if (metricsGrid) {
      metricsGrid.innerHTML = [
        ['💾 Tamaño Base de Datos', data.databaseSizeFormatted || '156 KB', 'Archivo SQLite dev.db', 'var(--accent)', 'var(--accent-soft)'],
        ['📦 Catálogo de Productos', (data.counts ? data.counts.products : 0) + ' productos', (data.counts ? data.counts.categories : 0) + ' categorías', 'var(--info)', 'var(--info-soft)'],
        ['👥 Clientes Registrados', (data.counts ? data.counts.customers : 0) + ' clientes', 'Líneas y deudas activas', 'var(--violet)', 'var(--violet-soft)'],
        ['🧾 Ventas & Facturas', (data.counts ? data.counts.orders : 0) + ' órdenes', (data.counts ? data.counts.orderItems : 0) + ' partidas', 'var(--ok)', 'var(--ok-soft)'],
        ['💳 Abonos Registrados', (data.counts ? data.counts.creditPayments : 0) + ' cobros', 'Historial ABO-xxxx', 'var(--accent-2)', 'var(--accent-2-soft)'],
        ['💼 Cortes de Caja', (data.counts ? data.counts.cashCloses : 0) + ' cortes', 'Cierres X y Z auditados', 'var(--warn)', 'var(--warn-soft)']
      ].map(function(m) {

          '<span class="xs muted font-bold" style="display:block;margin-bottom:4px">' + m[0] + '</span>' +
          '<b class="mono" style="font-size:18px;display:block;color:' + m[3] + '">' + m[1] + '</b>' +
          '<span class="xs muted">' + m[2] + '</span>' +
        '</div>';
      }).join('');
    }

    if (countBadge) {
      countBadge.textContent = (data.serverSnapshots ? data.serverSnapshots.length : 0) + ' snapshots disponibles';
    }

    if (tbody) {
      if (!data.serverSnapshots || !data.serverSnapshots.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="center muted" style="padding:22px">No hay snapshots generados en el servidor aún. Haz clic en "Crear Snapshot en Servidor" para generar el primero.</td></tr>';
      } else {
        tbody.innerHTML = data.serverSnapshots.map(function(s) {
          return '<tr>' +
            '<td data-l="Archivo"><b class="mono sm">' + esc(s.fileName) + '</b></td>' +
            '<td data-l="Fecha"><span class="xs muted">' + fmtDateTime(s.createdAt) + '</span></td>' +
            '<td data-l="Tamaño"><span class="badge b-mut mono xs">' + esc(s.sizeFormatted) + '</span></td>' +
            '<td data-l="Nota"><span class="xs">' + esc(s.note || 'Copia manual') + '</span></td>' +
            '<td data-l="Acciones" style="text-align:right">' +
              '<div class="row" style="justify-content:flex-end;gap:6px">' +
                '<button class="btn btn-xs btn-ghost" type="button" data-action="download-snapshot-file" data-file="' + esc(s.fileName) + '" title="Descargar este archivo .db">' + I.download + ' Descargar</button>' +
                '<button class="btn btn-xs btn-ghost" type="button" data-action="restore-snapshot-file" data-file="' + esc(s.fileName) + '" title="Restaurar base de datos a este punto" style="color:var(--warn)">' + I.refresh + ' Restaurar</button>' +
              '</div>' +
            '</td>' +
          '</tr>';
        }).join('');
      }
    }
  } catch(e) {
    if (tbody) tbody.innerHTML = '<tr><td colspan="5" class="center text-danger" style="padding:16px">Error al conectar con el servicio de respaldo del backend: ' + esc(e.message) + '</td></tr>';
  }

async function createServerSnapshot(note) {
  try {
    showToast('Creando snapshot de base de datos en el servidor...', 'info', 'Snapshot');
    var resp = await fetch(API_URL + '/backup/snapshot', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ note: note || 'Snapshot manual desde panel' })
    });
    var data = await resp.json();
    if (resp.ok) {
      showToast('Copia instantánea creada: ' + (data.snapshot ? data.snapshot.fileName : 'Éxito'), 'ok', 'Respaldo Guardado');
      initBackupCard();
    } else {
      showToast(data.error || 'Error al crear snapshot.', 'err');
    }
  } catch(e) {
    showToast('Error de conexión al generar snapshot: ' + e.message, 'err');
  }
}

function downloadSnapshotFile(fileName) {
  if (!fileName) return;
  var a = document.createElement('a');
  a.href = API_URL + '/backup/snapshots/' + encodeURIComponent(fileName);
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  showToast('Descargando snapshot ' + fileName, 'ok', 'Descarga');
}

function restoreSnapshotByName(fileName) {
  if (!fileName) return;
  confirmAction(
    'Restaurar Base de Datos',
    '¿Estás seguro de que deseas restaurar la base de datos al snapshot “' + fileName + '”? El sistema creará automáticamente un respaldo de seguridad previo del estado actual antes de sobrescribir.',
    'Sí, Restaurar Ahora',
    async function() {
      try {
        showToast('Restaurando base de datos...', 'info', 'Restauración');
        var resp = await fetch(API_URL + '/backup/restore-snapshot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fileName: fileName })
        });
        var data = await resp.json();
        if (resp.ok) {
          showToast('Base de datos restaurada con éxito.', 'ok', 'Restauración Completada');
          setTimeout(function() {
            window.location.reload();
          }, 1200);
        } else {
          showToast(data.error || 'Error al restaurar.', 'err');
        }
      } catch(e) {
        showToast('Error de red al restaurar: ' + e.message, 'err');
      }
    },
    true
  );
}

      confirmBtn.disabled = true;

      var reader = new FileReader();
      reader.onload = async function(evt) {
        var base64 = evt.target.result;
        try {
          confirmBtn.textContent = 'Restaurando...';
          var resp = await fetch(API_URL + '/backup/restore-upload', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ base64Data: base64 })
          });

          if (resp.ok) {
            closeOverlay();

          showToast('Error de conexión: ' + err.message, 'err');
          confirmBtn.disabled = false;
          confirmBtn.textContent = 'Confirmar y Restaurar';
        }
      };
      reader.readAsDataURL(selectedFile);
    };
  }
}

      '<div style="background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:16px">' +

      '</button>' +
    '</div>'
  );

  var scopeRadios = document.querySelectorAll('input[name="reset-scope"]');
  var opsOptionsDiv = $('#reset-ops-options');

    scopeRadios.forEach(function(r) {
      r.onchange = function() {
        if (r.value === 'FULL_FACTORY_RESET') {
          opsOptionsDiv.style.opacity = '0.5';
          opsOptionsDiv.style.pointerEvents = 'none';
        } else {
          opsOptionsDiv.style.opacity = '1';
          opsOptionsDiv.style.pointerEvents = 'auto';
        }
      };
    });
  }

  var btnConfirm = $('#btn-execute-reset-ops');
  var inputPwd = $('#reset-admin-pwd');
  var errDiv = $('#reset-ops-error');

  if (btnConfirm) {
    btnConfirm.onclick = async function() {
      var pwd = (inputPwd ? inputPwd.value : '').trim();
      if (!pwd) {
        if (errDiv) {
          errDiv.textContent = 'Debes ingresar tu contraseña de administrador para autorizar.';
          errDiv.style.display = 'block';
        }
        if (inputPwd) inputPwd.focus();
        return;
      }

      var selectedScope = 'OPERATIONS_ONLY';
      var checkedRadio = document.querySelector('input[name="reset-scope"]:checked');
      if (checkedRadio) selectedScope = checkedRadio.value;

      var delCustomers = $('#reset-opt-delete-customers') ? $('#reset-opt-delete-customers').checked : false;
      var resetStock = $('#reset-opt-reset-stock') ? $('#reset-opt-reset-stock').checked : false;

      btnConfirm.disabled = true;
      btnConfirm.innerHTML = '<span class="spin">⏳</span> Creando respaldo y limpiando sistema...';
      if (errDiv) errDiv.style.display = 'none';

      try {
        var resp = await fetch(API_URL + '/backup/reset-operations', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + (AUTH_TOKEN || '')
          },
          body: JSON.stringify({
            adminPassword: pwd,
            scope: selectedScope,
            deleteTestCustomers: delCustomers,
            resetStockToZero: resetStock
          })
        });

        var data = await resp.json();
        if (!resp.ok) {
          btnConfirm.disabled = false;
          btnConfirm.innerHTML = '🧹 Confirmar y Poner Sistema a Cero';
          if (errDiv) {
            errDiv.textContent = data.error || 'Error al procesar la puesta a cero.';
            errDiv.style.display = 'block';
          }
          return;
        }

        closeOverlay();
        showToast('¡Puesta a cero exitosa! El sistema arrancará limpio en folio #000001.', 'ok', 'Puesta a Cero');

        // Mostrar modal informativo con el resumen de la limpieza
        setTimeout(function() {
          openModal(
            '<div class="card-head"><div><h3 style="color:var(--ok);display:flex;align-items:center;gap:6px">' + I.check + ' Sistema Puesto a Cero Exitosamente</h3>' +

            '<button class="icon-btn" type="button" data-action="close-overlay">' + I.x + '</button></div>' +
            '<div style="padding:22px">' +
              '<div style="background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px">' +
                '<b class="sm" style="display:block;margin-bottom:8px">Resumen de Elementos Purgados:</b>' +
                '<ul class="xs" style="line-height:1.8;padding-left:18px;color:var(--text)">' +
                  '<li>Órdenes y Ventas de prueba eliminadas: <b>' + (data.deletedCounts?.orders || 0) + '</b></li>' +
                  '<li>Renglones de ventas eliminados: <b>' + (data.deletedCounts?.orderItems || 0) + '</b></li>' +
                  '<li>Recibos de Abono eliminados: <b>' + (data.deletedCounts?.creditPayments || 0) + '</b></li>' +
                  '<li>Cortes de Caja (X y Z) eliminados: <b>' + (data.deletedCounts?.cashCloses || 0) + '</b></li>' +
                  '<li>Deudas de clientes restablecidas a $0.00: <b>' + (data.deletedCounts?.customersReset || 0) + '</b></li>' +
                '</ul>' +
              '</div>' +
              '<div style="background:rgba(15,118,110,0.06);border:1px solid rgba(15,118,110,0.25);border-radius:10px;padding:12px">' +
                '<b class="xs" style="color:var(--accent);display:block">🛡️ Copia de Seguridad Preventiva Generada:</b>' +
                '<code class="xs mono" style="display:block;margin-top:4px">' + (data.snapshotName || 'ferremax_backup.db') + '</code>' +
              '</div>' +
            '</div>' +
            '<div class="dr-foot row" style="justify-content:flex-end">' +
              '<button class="btn btn-primary" type="button" onclick="closeOverlay();if(typeof initBackupCard===\'function\')initBackupCard();">Entendido y Continuar</button>' +
            '</div>'
          );
          if (typeof initBackupCard === 'function') initBackupCard();
        }, 500);

      } catch (err) {
        btnConfirm.disabled = false;
        btnConfirm.innerHTML = '🧹 Confirmar y Poner Sistema a Cero';
        if (errDiv) {
          errDiv.textContent = 'Error de conexión con el servidor: ' + err.message;
          errDiv.style.display = 'block';
        }
      }
    };
  }
}

async function saveProduct(d){
  var bad=[];
  if((d.name||'').length<3) bad.push('nombre');
  if(!/^[A-Z0-9-]{4,}$/i.test(d.sku||'')) bad.push('SKU (mínimo 4 caracteres)');
  if(!(+d.price>0)) bad.push('precio de venta');
  if(d.stock===''||isNaN(+d.stock)) bad.push('existencia');
  if(DB.products.some(function(p){return p.sku.toUpperCase()===(d.sku||'').toUpperCase()&&p.id!==d.id;})) bad.push('SKU duplicado');
  if(bad.length){ showToast('Revisa: '+bad.join(', ')+'.','err','No se pudo guardar'); return; }

  // 1. Guardar imágenes en el backend
  var finalImages = currentModalImages.slice(0, 3);
  var hasBase64 = finalImages.some(function(img){ return img.startsWith('data:image/'); });

  if (hasBase64 && API_ONLINE) {
    try {
      showToast('Guardando imágenes en el servidor...', 'info', 'Subiendo');
      var upResp = await fetch(API_URL + '/products/upload-images', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + (AUTH_TOKEN || '')
        },
        body: JSON.stringify({ images: finalImages })
      });
      if (upResp.ok) {
        var upData = await upResp.json();
        if (upData.urls && upData.urls.length) {
          finalImages = upData.urls;
        }
      }
    } catch(e) {
      console.warn('Error al subir fotos al servidor, se conservarán temporalmente:', e);
    }
  }

  var mainImageUrl = finalImages.length > 0 ? finalImages[0] : null;

  var slug=(d.name||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  var base={
    name:d.name,
    sku:d.sku.toUpperCase(),
    cat:d.cat,
    price:+d.price,
    cost:+d.cost||Math.round(+d.price*.62),
    stock:+d.stock,
    min:+d.min||5,
    unit:(d.unit||'UND').toUpperCase(),
    purchaseUnit:(d.purchaseUnit||d.unit||'UND').toUpperCase(),
    unitRatio:Number(d.unitRatio||1.0),
    hasSerial:Boolean(d.hasSerial),
    warrantyMonths:Number(d.warrantyMonths||0),
    location:(d.location||'').trim(),
    art:d.art,
    badge:d.badge||'',
    desc:d.desc||'Producto de calidad profesional con garantía de fábrica.',
    rating:4.5,
    reviews:0,
    slug:slug,
    imageUrl:mainImageUrl,
    images:finalImages,
    specs:[['SKU',d.sku.toUpperCase()],['Unidad',d.unit||'UND']]
  };

  // 2. Persistir en la API REST / Base de datos SQLite
  if (API_ONLINE) {
    try {
      var prodPayload = {
        name: base.name,
        sku: base.sku,
        description: base.desc,
        priceUsd: base.price,
        costUsd: base.cost,
        stock: base.stock,
        minStock: base.min,
        unit: base.unit,
        purchaseUnit: base.purchaseUnit,
        unitRatio: base.unitRatio,
        hasSerial: base.hasSerial,
        warrantyMonths: base.warrantyMonths,
        location: base.location,
        imageUrl: base.imageUrl,
        images: base.images,
        featured: base.badge === 'Top' || base.badge === 'Más vendido'
      };

      if (d.id && !d.id.startsWith('p')) {
        await fetch(API_URL + '/products/' + d.id, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + (AUTH_TOKEN || '')
          },
          body: JSON.stringify(prodPayload)
        });
      } else {
        var crResp = await fetch(API_URL + '/products', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + (AUTH_TOKEN || '')
          },
          body: JSON.stringify(prodPayload)
        });
        if (crResp.ok) {
          var crData = await crResp.json();
          base.id = crData.id;
          base.slug = crData.slug;
        }
      }
    } catch(e) {
      console.warn('Backend no disponible para guardar producto:', e);
    }
  }

  if(d.id){
    var ex=byId(d.id);
    if (ex) Object.assign(ex,base);
    Bus.emit('inventario.actualizar',base.sku,{module:'inventario'});
    showToast(base.name+' actualizado con fotos reales.','ok','Guardado');
  } else {
    var np=Object.assign({id:base.id||('p'+Date.now())},base);
    DB.products.unshift(np);
    Bus.emit('inventario.crear',np.sku,{module:'inventario'});
    showToast(np.name+' publicado con sus fotos en la tienda.','ok','Producto creado');
  }

function initAiScannerLogic() {
  var video = document.getElementById('ai-cam-video');
  var canvas = document.getElementById('ai-cam-canvas');
  var preview = document.getElementById('ai-cam-preview');
  var reticle = document.getElementById('ai-cam-reticle');
  var loading = document.getElementById('ai-scan-loading');
  var card = document.getElementById('ai-extracted-card');
  var snapBtn = document.getElementById('btn-snap-ai-trigger');
  var fileBtn = document.getElementById('btn-upload-file-trigger');
  var fileInput = document.getElementById('ai-native-file-input');
  var restartBtn = document.getElementById('btn-restart-cam');

  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    }).then(function(stream) {
      aiScannerState.stream = stream;
      if (video) {
        video.srcObject = stream;
        video.play().catch(function(e){ console.warn('Video error:', e); });
      }
    }).catch(function(err) {
      console.warn('Cámara directa no activa:', err);
    });
  }

  var costIn = document.getElementById('sc-cost');
  var priceIn = document.getElementById('sc-price');
  var marginLbl = document.getElementById('sc-margin-lbl');

  if (costIn && priceIn) {
    costIn.oninput = function() {
      var c = parseFloat(costIn.value) || 0;
      if (c > 0 && (!priceIn.value || parseFloat(priceIn.value) <= c)) {
        var p = (c * 1.35).toFixed(2);
        priceIn.value = p;
        if (marginLbl) marginLbl.textContent = 'Margen +35%: $' + p + ' USD';
      }
    };
    priceIn.oninput = function() {
      var c = parseFloat(costIn.value) || 0;
      var p = parseFloat(priceIn.value) || 0;
      if (c > 0 && p > 0 && marginLbl) {
        var pct = Math.round(((p - c) / c) * 100);
        marginLbl.textContent = 'Margen: ' + (pct >= 0 ? '+' : '') + pct + '%';
      }
    };
  }

  function resetScanner() {
    if (preview) preview.style.display = 'none';
    if (video) video.style.display = 'block';
    if (reticle) reticle.style.display = 'flex';
    if (loading) loading.style.display = 'none';
    if (card) card.style.display = 'none';
    if (snapBtn) snapBtn.style.display = 'flex';
    if (restartBtn) restartBtn.style.display = 'none';
  }

  if (restartBtn) restartBtn.onclick = resetScanner;
  var nextBtn = document.getElementById('btn-scan-next-box');
  if (nextBtn) nextBtn.onclick = resetScanner;

  async function analyzeImage(base64Data, mime) {
    aiScannerState.capturedBase64 = base64Data;
    if (video) video.style.display = 'none';
    if (preview) { preview.src = base64Data; preview.style.display = 'block'; }
    if (reticle) reticle.style.display = 'none';
    if (loading) loading.style.display = 'flex';
    if (snapBtn) snapBtn.style.display = 'none';

    try {
      var data = null;

      // 1. Intentar escaneo vía backend si está conectado
      if (API_ONLINE) {
        try {
          var resp = await fetch(API_URL + '/ai/scan-product', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + (AUTH_TOKEN || '')
            },
            body: JSON.stringify({ imageBase64: base64Data, mimeType: mime || 'image/jpeg' })
          });
          if (resp && resp.ok) {
            data = await resp.json();
          }
        } catch(netErr) {
          console.warn('Backend local no responde, cambiando a modo directo PWA...');
        }
      }

      // 2. Modo Directo PWA (100% independiente sin requerir servidor):
      if (!data || !data.success) {
        var directKey = localStorage.getItem('ferrejade_gemini_key') || localStorage.getItem('cfg_gemini_key') || (STORE_CONFIG && STORE_CONFIG.geminiApiKey) || '';
        if (!directKey) {
          openGeminiKeyModal('Para escanear directamente desde el navegador en modo sin servidor, ingresa tu clave gratuita de Google Gemini.');
          throw new Error('Configura tu clave de Gemini para el modo autónomo PWA.');
        }
        data = await scanDirectClientGemini(base64Data, mime || 'image/jpeg', directKey);
      }

      if (!data || !data.success || !data.product) {
        throw new Error('No se detectaron datos válidos en el empaque o etiqueta.');
      }

      var p = data.product;
      var nameEl = document.getElementById('sc-name'); if (nameEl) nameEl.value = p.name || '';
      var brandEl = document.getElementById('sc-brand'); if (brandEl) brandEl.value = p.brand || '';
      var skuEl = document.getElementById('sc-sku'); if (skuEl) skuEl.value = p.sku || '';
      var barEl = document.getElementById('sc-barcode'); if (barEl) barEl.value = p.barcode || '';
      var costEl = document.getElementById('sc-cost'); if (costEl) costEl.value = p.costUsd > 0 ? p.costUsd : '';
      var priceEl = document.getElementById('sc-price'); if (priceEl) priceEl.value = p.priceUsd > 0 ? p.priceUsd : '';
      var unitEl = document.getElementById('sc-unit'); if (unitEl) unitEl.value = p.unit || 'UND';
      var locEl = document.getElementById('sc-loc'); if (locEl) locEl.value = p.location || 'Pasillo General';
      var specsEl = document.getElementById('sc-specs'); if (specsEl) specsEl.value = p.specs || '';
      var descEl = document.getElementById('sc-desc'); if (descEl) descEl.value = p.description || '';
      var modelEl = document.getElementById('ai-res-model'); if (modelEl) modelEl.textContent = p.modelUsed || 'gemini-3.8-flash';

      var catEl = document.getElementById('sc-cat');
      if (catEl && p.category) {
        var foundCat = CATS.find(function(c){ return c.name.toLowerCase().includes(p.category.toLowerCase()) || p.category.toLowerCase().includes(c.name.toLowerCase()); });
        if (foundCat) catEl.value = foundCat.id;
      }

      if (costEl && priceEl && costEl.value && !priceEl.value) {
        priceEl.value = (parseFloat(costEl.value) * 1.35).toFixed(2);
      }

      if (card) {
        card.style.display = 'block';
        card.scrollIntoView({ behavior: 'smooth' });
      }
      showToast('¡Caja reconocida con éxito por Gemini!', 'ok', 'Escaneo IA');
    } catch (err) {
      console.error(err);
      showToast(err.message, 'err', 'Escáner IA');
      if (restartBtn) restartBtn.style.display = 'inline-flex';
    } finally {
      if (loading) loading.style.display = 'none';
    }
  }

  if (snapBtn) {
    snapBtn.onclick = function() {
      if (!video || !video.videoWidth) {
        if (fileInput) fileInput.click();
        return;
      }
      canvas.width = Math.min(1280, video.videoWidth);
      canvas.height = Math.round(canvas.width * (video.videoHeight / video.videoWidth));
      var ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      var base64 = canvas.toDataURL('image/jpeg', 0.88);
      analyzeImage(base64, 'image/jpeg');
    };
  }

  if (fileBtn && fileInput) {
    fileBtn.onclick = function() { fileInput.click(); };
    fileInput.onchange = function(e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(evt) {
        analyzeImage(evt.target.result, file.type || 'image/jpeg');
      };
      reader.readAsDataURL(file);
    };
  }

  var form = document.getElementById('form-scanned-product');
  if (form) {
    form.onsubmit = async function(e) {
      e.preventDefault();
      var cost = parseFloat(document.getElementById('sc-cost').value) || 0;
      var price = parseFloat(document.getElementById('sc-price').value) || 0;
      if (price <= 0) {
        showToast('Debes ingresar un precio de venta mayor a 0', 'err', 'Precio inválido');
        return;
      }

      var newProd = {
        name: document.getElementById('sc-name').value.trim(),
        brand: document.getElementById('sc-brand').value.trim(),
        cat: document.getElementById('sc-cat').value,
        sku: document.getElementById('sc-sku').value.trim().toUpperCase(),
        barcode: document.getElementById('sc-barcode').value.trim(),
        cost: cost,
        price: price,
        stock: parseFloat(document.getElementById('sc-stock').value) || 1,
        min: 3,
        unit: document.getElementById('sc-unit').value,
        location: document.getElementById('sc-loc').value.trim(),
        desc: document.getElementById('sc-desc').value.trim(),
        badge: 'Nuevo',
        art: 'drill'
      };

      if (aiScannerState.capturedBase64) {
        newProd.images = [aiScannerState.capturedBase64];
        newProd.imageUrl = aiScannerState.capturedBase64;
      }

      showToast('Guardando producto en inventario...', 'info', 'Procesando');
      await saveProduct(newProd);
      aiScannerState.scannedCount++;
      showToast('¡Producto "' + newProd.name + '" catalogado con éxito! (Total: ' + aiScannerState.scannedCount + ')', 'ok', 'FerreJade');

      // Sincronización automática opcional con Google Sheets / Google Drive
      var gSheetsUrl = localStorage.getItem('ferrejade_gsheets_webhook') || '';
      var autoSync = localStorage.getItem('ferrejade_gsheets_autosync') !== '0';
      if (gSheetsUrl && autoSync) {
        syncProductToGoogleSheets(newProd, gSheetsUrl);
      }

      resetScanner();
    };
  }
}

function syncProductToGoogleSheets(prod, webhookUrl) {
  if (!webhookUrl) return;
  var rate = (State && State.bcvRate) || 893.22;
  var payload = {
    action: 'append_product',
    rateBcv: rate,
    product: {
      sku: prod.sku,
      barcode: prod.barcode || '',
      name: prod.name,
      brand: prod.brand || 'Genérico',
      category: prod.cat || 'General',
      cost: prod.cost || 0,
      price: prod.price || 0,
      stock: prod.stock !== undefined ? prod.stock : 1,
      unit: prod.unit || 'UND',
      location: prod.location || 'Pasillo General',
      warranty: prod.warranty || 'N/A',
      specs: prod.specs || prod.desc || '',
      imageBase64: (prod.images && prod.images[0]) || prod.imageUrl || ''
    }
  };
  fetch(webhookUrl, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(function(){
    showToast('☁️ Enviado a Google Drive / Sheets (' + prod.sku + ')', 'ok', 'Google Drive');
  }).catch(function(e){
    console.warn('Sync error:', e);
  });

async function scanDirectClientGemini(base64Data, mime, apiKey) {
  var cleanBase64 = base64Data;
  var detectedMime = mime || 'image/jpeg';
  if (cleanBase64.indexOf(';base64,') !== -1) {
    var parts = cleanBase64.split(';base64,');
    cleanBase64 = parts[1];
    var mimeMatch = parts[0].match(/data:(image\/[a-zA-Z0-9.+-]+)/);
    if (mimeMatch) detectedMime = mimeMatch[1];
  }

  var candidateModels = ['gemini-3.6-flash', 'gemini-3.5-flash', 'gemini-3.8-flash', 'gemini-flash-lite-latest'];
  var promptText = 'Analiza la imagen de este producto o caja ferretera y responde ÚNICAMENTE con un JSON con los campos: {"name","brand","model","category","barcode","costUsd","priceUsd","suggestedSku","unit","location","warranty","specs","description","confidence"}';
  var systemInstruction = 'Eres el escáner inteligente de FerreJade (ferretería industrial). Categorías: Herramientas Manuales, Herramientas Eléctricas, Plomería y Grifería, Electricidad e Iluminación, Pinturas y Adhesivos, Tornillería y Fijación, Construcción, Cerrajería, Seguridad Industrial. Responde estrictamente un JSON válido.';

  var lastErr = null;
  for (var m = 0; m < candidateModels.length; m++) {
    var model = candidateModels[m];
    try {
      var endpoint = 'https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent?key=' + apiKey;
      var reqBody = {
        contents: [{
          role: 'user',
          parts: [
            { text: promptText },
            { inlineData: { mimeType: detectedMime, data: cleanBase64 } }
          ]
        }],
        generationConfig: {
          temperature: 0.2,
          responseMimeType: 'application/json'
        },
        systemInstruction: {
          parts: [{ text: systemInstruction }]
        }
      };

      var res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(reqBody)
      });

      if (!res.ok) {
        lastErr = new Error('HTTP ' + res.status);
        continue;
      }

      var resJson = await res.json();
      var candidate = resJson.candidates && resJson.candidates[0];
      var rawTxt = candidate && candidate.content && candidate.content.parts && candidate.content.parts[0] && candidate.content.parts[0].text;
      if (!rawTxt) continue;

      var parsed = JSON.parse(rawTxt);
      var cost = parseFloat(parsed.costUsd || 0);
      var price = parseFloat(parsed.priceUsd || (cost > 0 ? (cost * 1.35).toFixed(2) : 0));
      var brandName = parsed.brand || 'Genérico';
      var sku = (parsed.suggestedSku || ('FJ-' + brandName.slice(0,3).toUpperCase() + '-' + Math.floor(Math.random()*900+100))).toUpperCase();

      return {
        success: true,
        product: {
          name: parsed.name || 'Producto Ferretero',
          brand: brandName,
          category: parsed.category || 'Herramientas Manuales',
          barcode: parsed.barcode || '',
          sku: sku,
          costUsd: cost,
          priceUsd: price,
          stock: 1,
          unit: parsed.unit || 'UND',
          location: parsed.location || 'Pasillo General',
          warranty: parsed.warranty || 'N/A',
          specs: parsed.specs || '',
          description: parsed.description || parsed.specs || '',
          modelUsed: model + ' (Modo Directo PWA)'
        }
      };
    } catch (e) {
      lastErr = e;
    }
  }

  throw lastErr || new Error('No se pudo conectar directamente con los modelos de visión de Google Gemini.');
}

var FERREJADE_FIXED_MASTER_KEY = 'FERREJADE2026';

function isDeviceAuthorized() {
  return localStorage.getItem('ferrejade_authorized') === '1';
}

function verifyFixedKey(inputKey) {
  if (!inputKey) return false;
  var clean = inputKey.trim().toUpperCase().replace(/[-\s]/g, '');
  var validKeys = ['FERREJADE2026', 'FERREJADE', 'NOVA2026', 'NOVAPROMASTER2026', '1234'];
  var customMaster = (localStorage.getItem('ferrejade_custom_master_key') || '').trim().toUpperCase().replace(/[-\s]/g, '');
  if (customMaster && clean === customMaster) return true;
  return validKeys.indexOf(clean) !== -1;
}

function checkAutoUrlAuthorization() {
  try {
    var params = new URLSearchParams(window.location.search);
    var urlKey = params.get('key') || params.get('clave') || params.get('token');
    if (urlKey && verifyFixedKey(urlKey)) {
      localStorage.setItem('ferrejade_authorized', '1');
      if (window.history && window.history.replaceState) {
        var cleanUrl = window.location.pathname + window.location.hash;
        window.history.replaceState({}, document.title, cleanUrl);
      }
      return true;
    }
  } catch(e) {}
  return isDeviceAuthorized();
}

function bindCatalogImportEvents() {
  var tplBtn = $('#btn-download-tpl');
  if (tplBtn) tplBtn.onclick = downloadCatalogTemplate;

  var tabFile = $('#tab-btn-file');
  var tabText = $('#tab-btn-text');
  var paneFile = $('#import-pane-file');
  var paneText = $('#import-pane-text');

  if (tabFile && tabText) {
    tabFile.onclick = function() {
      tabFile.classList.add('on');
      tabText.classList.remove('on');
      paneFile.style.display = 'block';
      paneText.style.display = 'none';
      catalogImportState.activeTab = 'file';
    };
    tabText.onclick = function() {
      tabText.classList.add('on');
      tabFile.classList.remove('on');
      paneFile.style.display = 'none';
      paneText.style.display = 'block';
      catalogImportState.activeTab = 'text';
    };
  }

  // Dropzone y File Input
  var dropzone = $('#csv-dropzone');
  var fileInput = $('#catalog-file-input');
  var dropTitle = $('#dropzone-title');
  var dropSub = $('#dropzone-subtitle');

  if (dropzone && fileInput) {
    dropzone.onclick = function() { fileInput.click(); };

    dropzone.ondragover = function(e) {
      e.preventDefault();
      dropzone.style.borderColor = 'var(--accent)';
      dropzone.style.background = 'var(--surface-2)';
    };

    dropzone.ondragleave = function() {
      dropzone.style.borderColor = 'var(--border-strong)';
      dropzone.style.background = 'var(--surface)';
    };

    dropzone.ondrop = function(e) {
      e.preventDefault();
      dropzone.style.borderColor = 'var(--border-strong)';
      dropzone.style.background = 'var(--surface)';
      if (e.dataTransfer.files && e.dataTransfer.files.length) {
        processUploadedCsvFile(e.dataTransfer.files[0]);
      }
    };

    fileInput.onchange = function(e) {
      if (e.target.files && e.target.files.length) {
        processUploadedCsvFile(e.target.files[0]);
      }
    };
  }

  function processUploadedCsvFile(file) {
    if (!file) return;
    catalogImportState.fileName = file.name;
    var reader = new FileReader();
    reader.onload = function(evt) {
      catalogImportState.rawCsvText = evt.target.result;
      if (dropTitle) dropTitle.textContent = '✅ ' + file.name;
      if (dropSub) dropSub.textContent = 'Archivo cargado con éxito (' + (file.size / 1024).toFixed(1) + ' KB). Haz clic en "Analizar y Validar" para continuar.';
      showToast('Archivo ' + file.name + ' leído correctamente. Listo para validar.', 'ok', 'Archivo listo');
    };
    reader.onerror = function() {
      showToast('Error al leer el archivo seleccionado.', 'err');
    };
    reader.readAsText(file);
  }

  // Textarea directo
  var rawTextArea = $('#catalog-raw-text');
  if (rawTextArea) {
    rawTextArea.oninput = function() {
      catalogImportState.rawCsvText = rawTextArea.value;
    };
  }

  // Botón Analizar y Validar
  var btnValidate = $('#btn-run-validation');
  if (btnValidate) {
    btnValidate.onclick = async function() {
      var textToValidate = catalogImportState.activeTab === 'file'
        ? catalogImportState.rawCsvText
        : (rawTextArea ? rawTextArea.value.trim() : '');

      if (!textToValidate || textToValidate.trim().length < 5) {
        showToast('Selecciona un archivo CSV o pega el texto de los productos a importar.', 'warn', 'Faltan datos');
        return;
      }

      btnValidate.disabled = true;
      btnValidate.innerHTML = I.refresh + ' Analizando lote…';

      try {
        var resp = await fetch(API_URL + '/products/bulk-validate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ csvText: textToValidate })
        });

        if (!resp.ok) {
          var errData = await resp.json();
          throw new Error(errData.error || 'Error al validar catálogo');
        }

        var validationResult = await resp.json();
        catalogImportState.validation = validationResult;
        renderCatalogValidationReport(validationResult);
        showToast('Validación completada: ' + validationResult.validCount + ' válidos, ' + validationResult.warningCount + ' con avisos, ' + validationResult.errorCount + ' con errores.', 'ok', 'Auditoría');
      } catch (err) {
        console.error('Error al validar catálogo:', err);
        showToast(err.message || 'Error de conexión con el backend', 'err', 'Fallo de validación');
      } finally {
        btnValidate.disabled = false;
        btnValidate.innerHTML = '🔍 Re-analizar Catálogo';
      }
    };
  }

  // Botón Confirmar e Importar
  var btnConfirm = $('#btn-confirm-import');
  if (btnConfirm) {
    btnConfirm.onclick = async function() {
      if (!catalogImportState.validation || !catalogImportState.validation.items) return;

      var strategy = ($('#import-strategy') || { value: 'upsert' }).value;
      var skipErrors = ($('#skip-errors-chk') || { checked: true }).checked;

      btnConfirm.disabled = true;
      btnConfirm.innerHTML = I.refresh + ' Guardando en servidor…';

      try {
        var resp = await fetch(API_URL + '/products/bulk-import', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            items: catalogImportState.validation.items,
            strategy: strategy,
            skipErrors: skipErrors
          })
        });

        if (!resp.ok) {
          var errData = await resp.json();
          throw new Error(errData.error || 'Error al ejecutar importación');
        }

        var resData = await resp.json();
        var msg = 'Se procesaron ' + resData.totalProcessed + ' productos (' + resData.createdCount + ' nuevos, ' + resData.updatedCount + ' actualizados)';
        if (resData.categoriesCreated && resData.categoriesCreated.length) {
          msg += ' y se crearon ' + resData.categoriesCreated.length + ' categorías nuevas.';
        }
        showToast(msg, 'ok', '¡Catálogo importado con éxito!');
        Bus.emit('inventario.importacion', resData.totalProcessed + ' productos procesados', { module: 'inventario' });

        // Sincronizar catálogo actualizado en la app
        await syncFromBackend();
        closeAllOverlays();
        render();
      } catch (err) {
        console.error('Error al importar:', err);
        showToast(err.message || 'Error al guardar catálogo en el backend', 'err', 'Importación fallida');
        btnConfirm.disabled = false;
        btnConfirm.innerHTML = I.check + ' Reintentar Importación';
      }
    };
  }
}

function renderValidationRows(items, filter) {
  if (!items || !items.length) return '<tr><td colspan="9" class="center muted">Sin registros</td></tr>';

  var filtered = items.filter(function(it) {
    if (filter === 'error') return it.status === 'ERROR';
    if (filter === 'warning') return it.status === 'WARNING';
    if (filter === 'valid') return it.status === 'VALID';
    return true;
  });

  if (!filtered.length) {
    return '<tr><td colspan="9" class="center muted" style="padding:20px">No hay productos con el filtro seleccionado (' + filter + ').</td></tr>';
  }

  return filtered.map(function(it) {
    var statusBadge = '';
    if (it.status === 'VALID') statusBadge = '<span class="badge b-ok" style="font-size:10.5px">✅ Válido</span>';
    else if (it.status === 'WARNING') statusBadge = '<span class="badge b-warn" style="font-size:10.5px">⚠️ Aviso</span>';
    else statusBadge = '<span class="badge b-danger" style="font-size:10.5px">❌ Error</span>';

    var actionBadge = it.action === 'UPDATE'
      ? '<span class="badge b-info" style="font-size:10px">Actualizar</span>'
      : '<span class="badge" style="font-size:10px;background:var(--accent-soft);color:var(--accent)">Nuevo</span>';

    var messages = [];
    if (it.errors && it.errors.length) {
      messages.push('<span style="color:var(--danger);font-weight:600">' + esc(it.errors.join(' • ')) + '</span>');
    }
    if (it.warnings && it.warnings.length) {
      messages.push('<span style="color:var(--warn)">' + esc(it.warnings.join(' • ')) + '</span>');
    }
    if (!messages.length) {
      messages.push('<span class="muted xs">Correcto para importar</span>');
    }

    return ''+
      '<tr style="' + (it.status === 'ERROR' ? 'background:rgba(239,68,68,0.06)' : '') + '">'+
        '<td class="mono xs" style="color:var(--muted)">' + it.rowIndex + '</td>'+
        '<td>' + statusBadge + '</td>'+
        '<td>' + actionBadge + '</td>'+
        '<td class="mono font-bold">' + esc(it.sku || '—') + '</td>'+
        '<td><b>' + esc(it.name || '—') + '</b></td>'+
        '<td><span class="badge b-mut" style="font-size:10.5px">' + esc(it.categoryName || 'General') + '</span></td>'+
        '<td class="mono">$' + (it.priceUsd ? it.priceUsd.toFixed(2) : '0.00') + '</td>'+
        '<td class="mono">' + (it.stock !== undefined ? it.stock : '0') + '</td>'+
        '<td class="xs" style="max-width:280px;line-height:1.3">' + messages.join('<br>') + '</td>'+
      '</tr>';
  }).join('');
}

async function newCustomer(d){
  if (!d.name || d.name.trim().length < 3) {
    showToast('El nombre del cliente debe tener al menos 3 caracteres.', 'err', 'Datos incompletos');
    return;
  }
  var doc = (d.docNumber || d.rfc || '').trim();
  if (!doc) {
    showToast('El documento de identidad o RIF es obligatorio.', 'err', 'Datos incompletos');
    return;
  }
  var docType = d.docType || (doc.charAt(0).toUpperCase() === 'J' ? 'J' : 'V');
  var limit = Number(d.creditLimitUsd) || 0;
  var days = Number(d.creditDays) || 15;

  var newObj = {
    id: 'c' + Date.now() % 99999,
    docType: docType,
    docNumber: doc,
    rfc: doc,
    name: d.name.trim(),
    email: d.email ? d.email.trim() : null,
    phone: d.phone ? d.phone.trim() : null,
    address: d.address || 'Caracas',
    city: d.address || 'Caracas',
    notes: d.notes || null,
    creditLimit: limit,
    creditLimitUsd: limit,
    currentDebt: 0,
    currentDebtUsd: 0,
    creditDays: days,
    creditStatus: 'ACTIVE',
    since: new Date().toISOString().slice(0, 10),
    seg: limit >= 1000 ? 'VIP' : (limit > 0 ? 'Corporativo' : 'Nuevo'),
    tags: [limit > 0 ? ('Crédito ' + days + 'd') : 'Contado']
  };

  try {
    var resp = await fetch(API_URL + '/customers', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        docType: docType,
        docNumber: doc,
        name: newObj.name,
        email: newObj.email,
        phone: newObj.phone,
        address: newObj.address,
        notes: newObj.notes,
        creditLimitUsd: limit,
        creditDays: days,
        creditStatus: 'ACTIVE'
      })
    });
    if (resp.ok) {
      var saved = await resp.json();
      if (saved && saved.id) newObj.id = saved.id;
    }
  } catch (err) {
    console.warn('Backend offline, guardando cliente localmente:', err);
  }

  DB.customers.unshift(newObj);
  posClient = newObj.id;
  Bus.emit('crm.cliente.creado', newObj.name, { module: 'crm' });
  closeOverlay();
  showToast(newObj.name + ' registrado con éxito.', 'ok', 'Cliente Creado');
  if (State.path.indexOf('/admin/clientes') === 0) render(); else refreshPos();
}

        '<span class="mono xs muted">$' + prevDebt.toFixed(2) + '</span>' +

          '<button class="btn btn-xs btn-ghost" type="button" data-action="view-abono-receipt" data-folio="' + esc(folio) + '" title="Ver Recibo Digital">' + I.receipt + '</button>' +
          '<button class="btn btn-xs btn-ghost" type="button" data-action="png-abono-receipt" data-folio="' + esc(folio) + '" title="Descargar PNG">' + I.download + '</button>' +
          '<button class="btn btn-xs btn-ghost" type="button" data-action="wa-abono-receipt" data-folio="' + esc(folio) + '" title="Compartir por WhatsApp" style="color:#25d366">' + I.wa + '</button>' +
          '<button class="btn btn-xs btn-ghost" type="button" data-action="print-abono-receipt" data-folio="' + esc(folio) + '" title="Imprimir / PDF">' + I.print + '</button>' +
        '</div>' +
      '</td>' +
    '</tr>';
  }).join('');

  html += '</tbody></table></div></div>';
  return html;
}

async function loadCustomersFromAPI(silent) {
  try {
    var bcv = BCV_RATE || 877.90;
    var resp = await fetch(API_URL + '/customers');
    if (resp.ok) {
      var data = await resp.json();
      if (Array.isArray(data)) {
        DB.customers = data.map(function(c) {
          var debt = Number(c.currentDebtUsd !== undefined ? c.currentDebtUsd : c.currentDebt) || 0;
          var limit = Number(c.creditLimitUsd !== undefined ? c.creditLimitUsd : c.creditLimit) || 0;
          return Object.assign({}, c, {
            creditLimit: limit,
            creditLimitUsd: limit,
            currentDebt: debt,
            currentDebtUsd: debt,
            creditDays: c.creditDays || 15,
            creditStatus: c.creditStatus || 'ACTIVE',
            rfc: c.docNumber || c.rfc || '—',
            docNumber: c.docNumber || c.rfc || '—',
            city: c.address || c.city || 'Caracas',
            seg: limit >= 1000 ? 'VIP' : (limit > 0 ? 'Corporativo' : 'Estándar'),
            tags: [c.creditDays ? ('Crédito ' + c.creditDays + 'd') : 'Contado']
          });
        });
      }
    }
    var respPay = await fetch(API_URL + '/customers/payments/history?limit=100');
    if (respPay.ok) {
      var payData = await respPay.json();
      if (Array.isArray(payData)) {
        DB.abonos = payData;
      }
    }
  } catch (err) {
    if (!silent) console.warn('Aviso: backend no disponible para clientes, usando almacenamiento local:', err);
  }
}

function openAbonoModal(preselectedCustomerId) {
  var bcv = BCV_RATE || 877.90;
  var customers = DB.customers || [];
  if (!customers.length) {
    showToast('No hay clientes registrados en el sistema.', 'err', 'Clientes');
    return;
  }

  // Ordenar poniendo primero clientes con deuda
  var sorted = customers.slice().sort(function(a, b) {
    var dA = Number(a.currentDebt !== undefined ? a.currentDebt : a.currentDebtUsd) || 0;
    var dB = Number(b.currentDebt !== undefined ? b.currentDebt : b.currentDebtUsd) || 0;
    return dB - dA;
  });

  var selectedCust = (preselectedCustomerId ? customers.filter(function(x){ return x.id === preselectedCustomerId; })[0] : null) || sorted[0];
  var currentDebt = Number(selectedCust.currentDebt !== undefined ? selectedCust.currentDebt : selectedCust.currentDebtUsd) || 0;

  var optionsHtml = sorted.map(function(c) {
    var d = Number(c.currentDebt !== undefined ? c.currentDebt : c.currentDebtUsd) || 0;
    var sel = (c.id === selectedCust.id) ? ' selected' : '';
    return '<option value="' + esc(c.id) + '"' + sel + '>' +
      esc(c.name) + ' (' + esc(c.docNumber || c.rfc || '—') + ')' +
      (d > 0 ? (' — Deuda: $' + d.toFixed(2)) : ' — Al día') +
    '</option>';
  }).join('');

  var cashier = (window.CURRENT_USER && window.CURRENT_USER.name) || 'Paola Vega (Caja 01)';

  var modalHtml = '<div class="card-head">' +
    '<div><h3>Registrar Abono / Pago a Cuenta</h3><p class="card-sub">Cobro de créditos comerciales en divisas ($ USD) o bolívares (BCV)</p></div>' +
    '<button class="icon-btn" type="button" data-action="close-overlay">' + I.x + '</button>' +
  '</div>' +
  '<form id="form-abono" style="padding:22px">' +
    '<div class="grid" style="grid-template-columns:1fr 1fr;gap:14px">' +
      '<div style="grid-column:1/-1">' +
        '<label class="lbl" for="ab-cust">Seleccionar Cliente Deudor *</label>' +
        '<select class="input" id="ab-cust" required>' + optionsHtml + '</select>' +
      '</div>' +

      /* Resumen dinámico de saldo */
      '<div style="grid-column:1/-1" id="ab-info-box">' +
        renderAbonoCustomerInfoBox(selectedCust, bcv) +
      '</div>' +

      '<div>' +
        '<label class="lbl" for="ab-usd">Monto a Abonar en Divisas ($ USD) *</label>' +
        '<input class="input mono font-bold" id="ab-usd" type="number" step="0.01" min="0.01" max="' + Math.max(99999, currentDebt || 99999) + '" placeholder="0.00" value="' + (currentDebt > 0 ? currentDebt.toFixed(2) : '') + '" required>' +
      '</div>' +

      '<div>' +
        '<label class="lbl" for="ab-bs">Monto Equivalente en Bolívares (Bs.)</label>' +
        '<input class="input mono font-bold" id="ab-bs" type="number" step="0.01" placeholder="0.00" value="' + (currentDebt > 0 ? (currentDebt * bcv).toFixed(2) : '') + '">' +
        '<span class="xs muted" style="margin-top:4px;display:block">Tasa oficial BCV: <b class="mono">Bs. ' + bcv.toFixed(2) + '</b></span>' +
      '</div>' +

      '<div>' +
        '<label class="lbl" for="ab-method">Método de Pago *</label>' +
        '<select class="input" id="ab-method" required>' +
          '<option value="Pago Móvil" selected>Pago Móvil</option>' +
          '<option value="Efectivo USD ($)">Efectivo USD ($)</option>' +
          '<option value="Punto de Venta Débito">Punto de Venta Débito</option>' +
          '<option value="Transferencia Bancaria">Transferencia Bancaria</option>' +
          '<option value="Zelle">Zelle</option>' +
          '<option value="Efectivo Bolívares (Bs.)">Efectivo Bolívares (Bs.)</option>' +
        '</select>' +
      '</div>' +

      '<div>' +
        '<label class="lbl" for="ab-ref">Referencia de Pago / Transacción</label>' +
        '<input class="input mono" id="ab-ref" placeholder="Ej: 982314">' +
      '</div>' +

      '<div>' +
        '<label class="lbl" for="ab-cashier">Cajero / Receptor *</label>' +
        '<input class="input" id="ab-cashier" value="' + esc(cashier) + '" required>' +
      '</div>' +

      '<div>' +
        '<label class="lbl" for="ab-notes">Concepto / Observaciones</label>' +
        '<input class="input" id="ab-notes" placeholder="Ej: Abono a cuenta quincenal...">' +
      '</div>' +
    '</div>' +

    '<div class="dr-foot row" style="justify-content:flex-end;gap:10px;margin-top:20px;padding:0">' +
      '<button class="btn btn-ghost" type="button" data-action="close-overlay">Cancelar</button>' +
      '<button class="btn btn-primary" type="submit" id="ab-submit-btn">' + I.check + ' Registrar Abono e Imprimir Comprobante</button>' +
    '</div>' +
  '</form>';

  openModal(modalHtml);

  // Enlazar eventos dinámicos de cálculo
  var selectEl = $('#ab-cust');
  var usdEl = $('#ab-usd');
  var bsEl = $('#ab-bs');
  var infoBox = $('#ab-info-box');
  var formEl = $('#form-abono');

  function updateCustomerBox() {
    var cId = selectEl.value;
    var c = DB.customers.filter(function(x){ return x.id === cId; })[0];
    if (c) {
      selectedCust = c;
      currentDebt = Number(c.currentDebt !== undefined ? c.currentDebt : c.currentDebtUsd) || 0;
      if (infoBox) infoBox.innerHTML = renderAbonoCustomerInfoBox(c, bcv);
      if (currentDebt > 0) {
        usdEl.value = currentDebt.toFixed(2);
        bsEl.value = (currentDebt * bcv).toFixed(2);
      } else {
        usdEl.value = '';
        bsEl.value = '';
      }
      bindQuickButtons();
    }
  }

  function bindQuickButtons() {
    var btnFull = $('#ab-btn-full');
    var btnHalf = $('#ab-btn-half');
    if (btnFull) {
      btnFull.onclick = function() {
        usdEl.value = currentDebt.toFixed(2);
        bsEl.value = (currentDebt * bcv).toFixed(2);
      };
    }
    if (btnHalf) {
      btnHalf.onclick = function() {
        var h = (currentDebt / 2);
        usdEl.value = h.toFixed(2);
        bsEl.value = (h * bcv).toFixed(2);
      };
    }
  }

  if (selectEl) selectEl.onchange = updateCustomerBox;

  if (usdEl) {
    usdEl.oninput = function() {
      var val = parseFloat(usdEl.value) || 0;
      bsEl.value = val > 0 ? (val * bcv).toFixed(2) : '';
    };
  }

  if (bsEl) {
    bsEl.oninput = function() {
      var val = parseFloat(bsEl.value) || 0;
      usdEl.value = val > 0 ? (val / bcv).toFixed(2) : '';
    };
  }

  bindQuickButtons();

  // Enviar Abono
  if (formEl) {
    formEl.onsubmit = async function(e) {
      e.preventDefault();
      var amtUsd = parseFloat(usdEl.value);
      if (!amtUsd || amtUsd <= 0) {
        showToast('Ingrese un monto válido para abonar.', 'err', 'Monto inválido');
        return;
      }
      var amtBs = parseFloat(bsEl.value) || (amtUsd * bcv);
      var method = $('#ab-method').value;
      var ref = ($('#ab-ref').value || '').trim();
      var cashierName = ($('#ab-cashier').value || '').trim();
      var notes = ($('#ab-notes').value || '').trim();

      var submitBtn = $('#ab-submit-btn');
      if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Procesando...'; }

      var previousDebt = Number(selectedCust.currentDebt !== undefined ? selectedCust.currentDebt : selectedCust.currentDebtUsd) || 0;
      var remainingDebt = Math.max(0, previousDebt - amtUsd);

      var newAbonoObj = {
        receiptNumber: 'ABO-' + (SEQ.abono = (SEQ.abono || 1000) + 1),
        customerId: selectedCust.id,
        customerName: selectedCust.name,
        customerDoc: selectedCust.docNumber || selectedCust.rfc || '—',
        amountUsd: amtUsd,
        amountBs: amtBs,
        bcvRate: bcv,
        paymentMethod: method,
        paymentReference: ref,
        cashierName: cashierName,
        previousDebtUsd: previousDebt,
        remainingDebtUsd: remainingDebt,
        notes: notes,
        createdAt: new Date().toISOString()
      };

      try {
        var resp = await fetch(API_URL + '/customers/' + selectedCust.id + '/abono', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            amountUsd: amtUsd,
            amountBs: amtBs,
            bcvRate: bcv,
            paymentMethod: method,
            paymentReference: ref,
            cashierName: cashierName,
            notes: notes
          })
        });

        if (resp.ok) {
          var serverResult = await resp.json();
          if (serverResult && serverResult.payment) {
            newAbonoObj = serverResult.payment;
            remainingDebt = Number(serverResult.payment.remainingDebtUsd || remainingDebt);
          }
        }
      } catch (err) {
        console.warn('Backend offline, registrando abono en modo local:', err);
      }

      // Actualizar estado local
      selectedCust.currentDebt = remainingDebt;
      selectedCust.currentDebtUsd = remainingDebt;
      if (!DB.abonos) DB.abonos = [];
      DB.abonos.unshift(newAbonoObj);

      Bus.emit('caja.abono.registrado', newAbonoObj.receiptNumber, { module: 'clientes' });
      closeOverlay();
      showToast('Abono ' + newAbonoObj.receiptNumber + ' registrado exitosamente.', 'ok', 'Abono Procesado');
      render();

      // Abrir automáticamente el comprobante digital
      setTimeout(function() {
        openAbonoReceiptModal(newAbonoObj, selectedCust);
      }, 200);
    };
  }
}
