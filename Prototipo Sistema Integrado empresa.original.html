<!--
════════════════════════════════════════════════════════════════════════════
  CORE-BUSINESS SUITE · v1.1 (build corregido)
════════════════════════════════════════════════════════════════════════════
  CHANGELOG v1.1 — bugs reportados y corregidos:

  [CRÍTICO] Login no permitía entrar con los 3 roles.
     Causa raíz 1: la navegación dependía 100% de `location.hash`. En entornos
                   sandbox/iframe o con permisos restringidos, asignar el hash
                   lanza SecurityError y la app quedaba "congelada" en /login.
     Causa raíz 2: el botón "Entrar" solo funcionaba por `submit` nativo del
                   form; si el handler no llegaba a bindearse, no pasaba nada.
     Causa raíz 3: al entrar se lanzaba un TOUR automático con un foco oscuro
                   (box-shadow 9999px) que cubría todo el panel → se percibía
                   como "no me dejó entrar".
     Fix: router interno con estado (go()) + try/catch sobre el hash,
          botones de acceso rápido por rol (1 clic, sin contraseña),
          handler de click Y submit, tour solo manual.

  [CRÍTICO] Módulo "API & DevOps" no renderizaba (pantalla en skeleton).
     Causa: `Views.devops = () => `...`,` terminaba en COMA en vez de punto y
            coma, por lo que `function containerRow(){}` siguiente se parseaba
            como *expresión* de función y nunca quedaba definida en el scope
            → ReferenceError al pintar la tabla de contenedores.
     Fix: todas las sentencias terminadas en `;` + funciones declaradas aparte.

  [ALTO] handleAction() reventaba al llamarse sin elemento (paleta Ctrl+K).
     Fix: `const D = (el && el.dataset) || {}`.

  [ALTO] "Descargar PDF" de una factura abría otro modal en vez de imprimir.
     Fix: print-invoice → imprime de verdad (iframe); view-invoice → modal.

  [MEDIO] KPI "Uptime 99.98%" se mostraba como "100".
     Fix: kpi() recibe decimales y prefijo explícitos.

  [QA] Añadido Error Boundary por módulo + window.onerror con toast visible:
       ningún módulo puede volver a quedarse colgado en silencio.
       Añadido badge de stock bajo en el menú Inventario.
════════════════════════════════════════════════════════════════════════════
-->

:root{

  --ok:#059669; --ok-soft:#d1fae5; --warn:#d97706; --warn-soft:#fef3c7;

  --sh-2:0 4px 14px rgba(15,23,42,.08); --sh-3:0 18px 48px rgba(15,23,42,.16);
  --sidebar:264px; --sidebar-mini:74px; --topbar:64px;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Space Grotesk','Inter',system-ui,sans-serif;

  --ease:cubic-bezier(.22,.68,.35,1);
}
[data-theme="dark"]{
  --bg:#080d14; --surface:#0f1720; --surface-2:#131d28; --surface-3:#1a2531;
  --border:#22303f; --border-strong:#33475c; --text:#e8eef6; --muted:#93a4b8; --muted-2:#6b7f95;
  --ok:#34d399; --ok-soft:rgba(52,211,153,.14); --warn:#fbbf24; --warn-soft:rgba(251,191,36,.14);
  --danger:#f87171; --danger-soft:rgba(248,113,113,.14); --info:#60a5fa; --info-soft:rgba(96,165,250,.14);
  --violet:#a78bfa; --violet-soft:rgba(167,139,250,.14); --accent-soft:rgba(20,184,166,.16);
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 6px 20px rgba(0,0,0,.45); --sh-3:0 24px 60px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.55;overflow-x:hidden;transition:background .35s var(--ease),color .35s var(--ease)}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;line-height:1.18;letter-spacing:-.02em;font-weight:700}
p{margin:0}a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg{display:block;max-width:100%}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--font-mono)}.xs{font-size:12.5px}.sm{font-size:13.5px}.big{font-size:22px}
.muted{color:var(--muted)}.row{display:flex;align-items:center;gap:12px}
.wrap-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:14px}
.grid{display:grid;gap:18px}.hr{height:1px;background:var(--border);border:0;margin:0}
.tip{border-bottom:1px dashed var(--border-strong);cursor:help}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:12px;font-weight:600;font-size:14px;transition:transform .18s var(--ease),box-shadow .22s var(--ease),background .2s,border-color .2s,color .2s;border:1px solid transparent;white-space:nowrap}

.btn-accent2{background:var(--accent-2);color:#04231f}.btn-accent2:hover{filter:brightness(1.07)}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}

.term{background:#070c12;color:#c9d6e3;border-radius:14px;padding:16px;font-family:var(--font-mono);font-size:12.3px;line-height:1.75;max-height:260px;overflow-y:auto;border:1px solid #1b2836}
.term .ok{color:#4ade80}.term .dim{color:#5b7186}.term .warn{color:#fbbf24}.term .acc{color:#2dd4bf}
.gauge{position:relative;width:170px;height:170px;margin:0 auto}
.gauge svg{transform:rotate(-90deg)}
.gauge .gv{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.gauge .gv b{font-family:var(--font-display);font-size:38px;display:block;line-height:1}
.matrix td,.matrix th{text-align:center}.matrix td:first-child,.matrix th:first-child{text-align:left}
.matrix input{width:16px;height:16px;accent-color:var(--accent)}
.cmdk{width:min(620px,100%);background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-3);border:1px solid var(--border);overflow:hidden;animation:pop .25s var(--ease)}
.cmdk .search-wrap svg{width:18px;height:18px}
.cmdk input{width:100%;padding:17px 20px 17px 42px;border:0;border-bottom:1px solid var(--border);background:transparent;font-size:16px}
.cmdk input:focus{outline:none}
.cmdk-list{max-height:370px;overflow-y:auto;padding:8px}
.cmdk-item{display:flex;align-items:center;gap:12px;padding:10px 13px;border-radius:11px;cursor:pointer;font-size:14px}
.cmdk-item svg{width:17px;height:17px;color:var(--muted);flex:none}
.cmdk-item.sel{background:var(--accent-soft)}
.spot{position:fixed;z-index:600;border-radius:14px;box-shadow:0 0 0 9999px rgba(6,12,20,.55);pointer-events:none;transition:all .38s var(--ease)}
.tour-card{position:fixed;z-index:601;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-3);padding:20px;width:min(340px,90vw)}
.tour-card h4{font-size:16px;margin-bottom:7px}.tour-card p{font-size:13.5px;color:var(--muted)}
.arch{width:100%;height:auto;overflow:visible}
.arch .flow{stroke-dasharray:6 8;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-28}}
.empty{text-align:center;padding:56px 24px;color:var(--muted)}
.empty>svg{width:52px;height:52px;margin:0 auto 14px;color:var(--border-strong)}
.empty b{display:block;font-size:17px;color:var(--text);margin-bottom:6px;font-family:var(--font-display)}
.locked-panel{text-align:center;padding:70px 24px}
.locked-panel .ic{width:64px;height:64px;border-radius:20px;background:var(--warn-soft);color:var(--warn);display:grid;place-items:center;margin:0 auto 18px}
.locked-panel .ic svg{width:30px;height:30px}
.err-panel{text-align:center;padding:56px 24px}
.err-panel .ic{width:64px;height:64px;border-radius:20px;background:var(--danger-soft);color:var(--danger);display:grid;place-items:center;margin:0 auto 18px}
.err-panel .ic svg{width:30px;height:30px}
.err-panel pre{text-align:left;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px;font-family:var(--font-mono);font-size:12px;overflow-x:auto;margin-top:16px;color:var(--danger)}
.mob-only{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:1180px){
  .hero-in{grid-template-columns:1fr;gap:38px}.hero-art{min-height:auto;max-width:520px;margin:0 auto;width:100%}
  .float-card.f1{left:-8px}.float-card.f2{right:-8px}
  .pd{grid-template-columns:1fr;gap:26px}.pd-gal{position:static}
  .pos-layout{grid-template-columns:1fr}.pos-ticket{position:static}
  .banner{grid-template-columns:1fr;padding:32px}
}
@media(max-width:1024px){
  .cat-layout{grid-template-columns:1fr}.filters{position:static}.nav-links{display:none}
  .login-wrap{grid-template-columns:1fr}.login-art{display:none}.foot-in{grid-template-columns:1fr 1fr}
  .admin{grid-template-columns:1fr!important}
  .side{position:fixed;left:0;top:0;bottom:0;width:280px;transform:translateX(-100%);transition:transform .3s var(--ease);box-shadow:var(--sh-3)}
  .admin.mob-open .side{transform:none}
  .mob-only{display:grid}.page{padding:20px 16px 60px}
  .top .hide-md{display:none}
}
@media(max-width:640px){
  .head-in{height:64px;gap:10px;padding:0 14px}.head-search{display:none}
  .hero{padding:36px 16px 26px}.sec{padding:44px 16px}.foot-in{grid-template-columns:1fr}
  .p-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:13px}
  .toasts{left:14px;right:14px;bottom:14px;max-width:none}
  .tbl thead{display:none}
  .tbl tr{display:block;border-bottom:1px solid var(--border);padding:10px 0}
  .tbl td{display:flex;justify-content:space-between;gap:14px;border:0;padding:6px 14px;text-align:right}
  .tbl td::before{content:attr(data-l);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;text-align:left}
  .pay-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>

var scrimStack=[];
function openOverlay(html,opt){

  wrap.innerHTML=(opt.scrim===false?'':'<div class="scrim" data-action="close-overlay"></div>')+html;
  var nodes=Array.prototype.slice.call(wrap.children);
  nodes.forEach(function(n){ root.appendChild(n); });
  var entry={nodes:nodes,onClose:opt.onClose};
  scrimStack.push(entry);
  return entry;
}
function closeOverlay(entry){
  if(!entry) entry=scrimStack.pop(); else scrimStack=scrimStack.filter(function(e){return e!==entry;});
  if(!entry) return;
  entry.nodes.forEach(function(n){ n.style.transition='opacity .2s'; n.style.opacity='0';
    setTimeout(function(){ if(n.parentNode) n.parentNode.removeChild(n); },200); });
  if(entry.onClose) entry.onClose();
}

var chartGeo={};
function smooth(pts){
  if(!pts.length) return '';
  if(pts.length<2) return 'M'+pts[0].x+','+pts[0].y;
  var d='M'+pts[0].x+','+pts[0].y, i;
  for(i=0;i<pts.length-1;i++){
    var p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    d+=' C'+(p1.x+(p2.x-p0.x)/6)+','+(p1.y+(p2.y-p0.y)/6)+' '+(p2.x-(p3.x-p1.x)/6)+','+(p2.y-(p3.y-p1.y)/6)+' '+p2.x+','+p2.y;
  }
  return d;
}
function areaChart(id,labels,values,h){
  h=h||240;
  var W=760,PADL=46,PADR=14,PADT=16,PADB=26;
  var max=(Math.max.apply(null,values)||1)*1.15;
  function x(i){ return PADL+(i*(W-PADL-PADR)/Math.max(1,values.length-1)); }
  function y(v){ return PADT+((max-v)/max)*(h-PADT-PADB); }
  var pts=values.map(function(v,i){ return {x:x(i),y:y(v),v:v,l:labels[i]}; });
  chartGeo[id]={pts:pts,W:W,h:h};
  var grid='',g;
  for(g=0;g<=4;g++){ var yy=PADT+g*((h-PADT-PADB)/4), val=max-(g*(max/4));
    grid+='<line x1="'+PADL+'" y1="'+yy+'" x2="'+(W-PADR)+'" y2="'+yy+'" stroke="var(--border)" stroke-dasharray="3 5"/>'+
      '<text x="'+(PADL-9)+'" y="'+(yy+4)+'" text-anchor="end" font-size="10" fill="var(--muted-2)" font-family="monospace">'+(val>=1000?(val/1000).toFixed(0)+'k':val.toFixed(0))+'</text>'; }
  var step=Math.ceil(pts.length/6);
  var xl=pts.filter(function(_,i){ return i%step===0||i===pts.length-1; })
    .map(function(p){ return '<text x="'+p.x+'" y="'+(h-6)+'" text-anchor="middle" font-size="10" fill="var(--muted-2)">'+esc(p.l)+'</text>'; }).join('');
  return '<svg viewBox="0 0 '+W+' '+h+'" data-chart="'+id+'" style="width:100%;height:'+h+'px;overflow:visible">'+
    '<defs><linearGradient id="grad-'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent-2)" stop-opacity=".38"/><stop offset="1" stop-color="var(--accent-2)" stop-opacity="0"/></linearGradient></defs>'+
    grid+'<path d="'+smooth(pts)+' L'+pts[pts.length-1].x+','+(h-PADB)+' L'+pts[0].x+','+(h-PADB)+' Z" fill="url(#grad-'+id+')"/>'+
    '<path d="'+smooth(pts)+'" fill="none" stroke="var(--accent-2)" stroke-width="2.6" stroke-linecap="round" class="draw"/>'+
    '<g class="chart-markers"></g>'+xl+'</svg>';
}
function sparkline(values,color){
  var W=120,H=34,max=Math.max.apply(null,values),min=Math.min.apply(null,values);
  var pts=values.map(function(v,i){ return {x:i*(W/(values.length-1)),y:H-((v-min)/((max-min)||1))*(H-6)-3}; });
  return '<svg viewBox="0 0 '+W+' '+H+'"><path d="'+smooth(pts)+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" class="draw"/>'+
    '<circle cx="'+pts[pts.length-1].x+'" cy="'+pts[pts.length-1].y+'" r="2.6" fill="'+color+'"/></svg>';
}
function donut(data,size){
  size=size||168; var thick=22, total=data.reduce(function(a,b){return a+b.v;},0)||1, r=(size-thick)/2, c=2*Math.PI*r, off=0;
  var arcs=data.map(function(d){ var frac=d.v/total, s='<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+d.c+'" stroke-width="'+thick+'" stroke-dasharray="'+(frac*c)+' '+c+'" stroke-dashoffset="'+(-off*c)+'"/>'; off+=frac; return s; }).join('');
  return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--surface-3)" stroke-width="'+thick+'"/>'+arcs+
    '<text x="50%" y="47%" text-anchor="middle" font-size="12" fill="var(--muted)">Total</text>'+

      var r=svg.getBoundingClientRect(), scale=r.width/geo.W, xm=(ev.clientX-r.left)/scale, best=0, bd=1e9;
      geo.pts.forEach(function(p,i){ var d=Math.abs(p.x-xm); if(d<bd){bd=d;best=i;} });
      var p=geo.pts[best];
      markers.innerHTML='<line x1="'+p.x+'" y1="16" x2="'+p.x+'" y2="'+(geo.h-26)+'" stroke="var(--border-strong)" stroke-dasharray="3 3"/>'+
        '<circle cx="'+p.x+'" cy="'+p.y+'" r="5" fill="var(--surface)" stroke="var(--accent-2)" stroke-width="2.6"/>';
      tip.innerHTML=esc(p.l)+'<br><b>'+money(p.v)+'</b>';
      tip.style.left=(p.x*scale)+'px'; tip.style.top=(p.y*(r.height/geo.h))+'px'; tip.style.opacity='1';
    });
    svg.addEventListener('mouseleave',function(){ tip.style.opacity='0'; markers.innerHTML=''; });
  });
  $$('[data-count]',root).forEach(function(el){ animateNum(el); });
}
function animateNum(el){
  var to=parseFloat(el.getAttribute('data-count'))||0, dec=+(el.getAttribute('data-dec')||0),
      pre=el.getAttribute('data-pre')||'', suf=el.getAttribute('data-suf')||'', t0=performance.now();
  function step(t){ var k=clamp((t-t0)/950,0,1), e=1-Math.pow(1-k,3), v=to*e;
    el.textContent=pre+(dec?v.toFixed(dec):num(Math.round(v)))+suf; if(k<1) requestAnimationFrame(step); }
  requestAnimationFrame(step);
}
var io=null;
function observeReveal(root){
  root=root||document;
  if(!('IntersectionObserver' in window)){ $$('.rv',root).forEach(function(e){e.classList.add('in');}); return; }
  if(!io) io=new IntersectionObserver(function(es){ es.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } }); },{threshold:.1});
  $$('.rv',root).forEach(function(e){ io.observe(e); });
}

function discount(sub){
  if(!State.coupon) return {amt:0,ship:0,label:''};
  var c=DB.coupons.filter(function(x){return x.code===State.coupon;})[0];
  if(!c) return {amt:0,ship:0,label:''};
  var amt=c.type==='pct'?sub*c.value/100:(c.type==='amt'?Math.min(c.value,sub):0);

  }

    if((D.addr||'').length<5) mark('co-addr','Falta la calle y el número exterior.');

function doLogin(role,email){
  role=role||State.loginRole||'Administrador';
  if(!DB.perms[role]) role='Administrador';
  State.loginRole=role;
  var payload={sub:1,role:role,email:email||ROLE_MAIL[role],iat:Date.now()};
  var b64=''; try{ b64=btoa(unescape(encodeURIComponent(JSON.stringify(payload)))).slice(0,28); }catch(e){ b64='eyJkZW1vIjoidG9rZW4i'; }
  State.session={name:ROLE_NAME[role]||'Usuario',email:email||ROLE_MAIL[role],role:role,
    token:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.'+b64+'.demoSignature',since:new Date()};
  Bus.emit('auth.login',State.session.email+' · '+role+' · JWT emitido',{module:'core'});
  Bus.emit('auth.permisos','scope='+DB.perms[role].length+' módulos',{module:'core'});
  showToast('Sesión iniciada como '+role+'. Bienvenido, '+State.session.name.split(' ')[0]+'.','ok','Acceso concedido');
  go('/admin/dashboard');
}

function metrics(){
  var now=new Date();
  function age(d){ return (now-new Date(d))/864e5; }
  var today=DB.orders.filter(function(o){return age(o.date)<1&&o.status!=='cancelada';});
  var last30=DB.orders.filter(function(o){return age(o.date)<=30&&o.status!=='cancelada';});
  var sum=function(a){return a.reduce(function(x,y){return x+y.total;},0);};
  var sales30=sum(last30)||1, prev=sum(DB.orders.filter(function(o){return age(o.date)>30;}))||1;
  return {today:sum(today),todayN:today.length,sales30:sales30,salesPrev:prev,growth:((sales30-prev)/prev)*100,
    ticket:last30.length?sales30/last30.length:0,orders30:last30.length,
    low:DB.products.filter(function(p){return p.stock>0&&p.stock<=p.min;}),
    out:DB.products.filter(function(p){return p.stock===0;}),
    stockValue:DB.products.reduce(function(a,p){return a+p.cost*p.stock;},0),
    pend:DB.invoices.filter(function(i){return i.status!=='timbrada';})};
}
function salesSeries(range){
  var r=seeded(range==='7d'?11:(range==='30d'?22:33)), out=[], lab=[], i, n, d;
  if(range==='12m'){ for(i=11;i>=0;i--){ d=new Date(); d.setMonth(d.getMonth()-i);
      lab.push(d.toLocaleDateString('es-MX',{month:'short'}).replace('.','')); out.push(Math.round(78000+r()*64000+(11-i)*2600)); }
    return {labels:lab,values:out}; }
  n=range==='7d'?7:30;
  for(i=n-1;i>=0;i--){ d=daysAgo(i); lab.push(d.toLocaleDateString('es-MX',{day:'2-digit',month:'short'}).replace('.',''));
    out.push(Math.round(3200+r()*7400+(i<2?2600:0))); }
  return {labels:lab,values:out};
}
function categorySales(){
  return CATS.map(function(c){
    var v=DB.orders.reduce(function(a,o){ return a+o.items.reduce(function(b,i){ var p=byId(i.id); return b+((p&&p.cat===c.id)?i.price*i.qty:0); },0); },0);
    return {l:c.name,c:c.color,v:v||Math.round(6000+Math.random()*18000)}; }).sort(function(a,b){return b.v-a.v;});
}
function topProducts(n){
  var map={};
  DB.orders.forEach(function(o){ o.items.forEach(function(i){ map[i.id]=(map[i.id]||0)+i.price*i.qty; }); });
  return Object.keys(map).map(function(id){ return {id:id,v:map[id],p:byId(id)}; })
    .filter(function(x){return x.p;}).sort(function(a,b){return b.v-a.v;}).slice(0,n||5);
}

var timers=[], ignoreHash=false;
function clearTimers(){ timers.forEach(function(t){ clearTimeout(t); clearInterval(t); }); timers=[]; }
function go(path){
  if(typeof path!=='string') path='/';
  if(path.charAt(0)!=='/') path='/'+path;
  State.path=path;
  try{ ignoreHash=true; location.hash='#'+path; }catch(e){ /* sandbox: seguimos con routing interno */ }
  setTimeout(function(){ ignoreHash=false; },80);
  render();
}
window.addEventListener('hashchange',function(){
  if(ignoreHash) return;
  State.path=(location.hash||'#/').replace(/^#/,'')||'/';
  render();
});
function parsePath(){
  var h=(State.path||'/').replace(/^\//,'');
  var parts=h.split('?'), qs=parts[1]||'';
  return {parts:parts[0].split('/').filter(Boolean), params:new URLSearchParams(qs)};
}
function render(){
  var r=parsePath(), parts=r.parts, app=$('#app');
  clearTimers(); endTour(true);
  if(parts[0]==='admin'){
    if(!State.session){ go('/login'); return; }
    var mid=parts[1]||'dashboard';
    if(!MOD_LABEL[mid]) mid='dashboard';
    State.module=mid;
    setSEO({title:(MOD_LABEL[mid].label)+' · Panel FerreMax'});
    app.innerHTML=adminShell(skeletonPage(),mid);
    refreshBadges();
    timers.push(setTimeout(function(){
      var page=$('#page'); if(!page) return;
      var body;
      try{ body=canAccess(mid)?Views[mid]():viewLocked(mid); }
      catch(err){ body=viewModuleError(mid,err); if(DEV_ERRORS) showToast('Fallo en módulo '+mid+': '+err.message,'err','Error boundary'); }
      page.innerHTML=body;
      afterAdminRender(mid);
    },220));
    return;
  }
  if(parts[0]==='login'){ app.innerHTML=viewLogin(); afterStoreRender(); return; }
  if(parts[0]==='productos'){
    if(r.params.get('ofertas')) State.ui.onlyOffers=true;
    app.innerHTML=parts[1]?viewProduct(parts[1]):viewCatalog();
    afterStoreRender(); return;
  }
  if(['nosotros','envios','devoluciones','faq','facturacion','aviso','terminos','seguridad-info','sitemap'].indexOf(parts[0])>=0){
    app.innerHTML=viewStatic(parts[0]); afterStoreRender(); return; }
  app.innerHTML=viewHome(); afterStoreRender();
}

function bindForms(){

document.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('[data-action]'):null; if(!t) return;
  var a=t.getAttribute('data-action');
  if(a==='modal-scrim'){ if(e.target.classList.contains('modal')) closeOverlay(); return; }
  try{ handleAction(a,t,e); }
  catch(err){ if(DEV_ERRORS) showToast(err.message,'err','Acción fallida'); }
});
function handleAction(a,el,e){
  var D=(el&&el.dataset)||{};
  switch(a){
    /* navegación */
    case 'go': if(e) e.preventDefault(); endTour(true); go(D.to||'/'); break;
    case 'nav-cat': if(e) e.preventDefault(); State.ui.onlyOffers=false; State.ui.catFilter=[D.cat]; State.ui.q=''; go('/productos'); break;
    case 'nav-ofertas': if(e) e.preventDefault(); State.ui.onlyOffers=true; State.ui.catFilter=[]; State.ui.q=''; go('/productos'); break;
    case 'search-all': State.ui.q=($('#global-q')||{}).value||''; var sr=$('#search-results'); if(sr) sr.innerHTML=''; go('/productos'); break;
    case 'admin-nav': if(e) e.preventDefault(); var root=$('#admin-root'); if(root) root.classList.remove('mob-open');
      closeAllOverlays(); if(('/admin/'+D.m)===State.path) render(); else go('/admin/'+D.m); break;
    case 'scroll-to': var tgt=document.getElementById(D.to); if(tgt) tgt.scrollIntoView({behavior:'smooth',block:'start'}); break;
    case 'render': render(); break;
    /* tema / ui */
    case 'toggle-theme': State.theme=State.theme==='light'?'dark':'light'; LS.set('cb-theme',State.theme); applyThemeTokens(); render(); break;
    case 'set-accent': State.accent=D.c; LS.set('cb-accent',D.c); applyThemeTokens();
      Bus.emit('ajustes.token','color de marca → '+D.c,{module:'core'});
      showToast('Token de color actualizado en tienda y panel.','ok','Design system'); render(); break;
    case 'toggle-help': State.ui.help=!State.ui.help; LS.set('cb-help',State.ui.help);
      showToast(State.ui.help?'Tooltips activados: pasa el cursor sobre los elementos con línea punteada.':'Tooltips desactivados.','info','Guías'); render(); break;
    case 'toggle-generic': el.classList.toggle('on'); el.setAttribute('aria-checked',el.classList.contains('on'));
      showToast('Preferencia guardada.','ok','Ajustes'); break;
    case 'toggle-dense': el.classList.toggle('on');
      $$('.tbl td').forEach(function(td){ td.style.padding=el.classList.contains('on')?'7px 14px':''; });
      showToast(el.classList.contains('on')?'Densidad compacta activada.':'Densidad normal.','info','Ajustes'); break;
    case 'toggle-mini': State.ui.sidebar=!State.ui.sidebar; LS.set('cb-mini',State.ui.sidebar);
      var ar=$('#admin-root'); if(ar) ar.classList.toggle('mini',State.ui.sidebar); break;
    case 'open-mob-side': var r2=$('#admin-root'); if(r2) r2.classList.add('mob-open');
      openOverlay('',{onClose:function(){ var r=$('#admin-root'); if(r) r.classList.remove('mob-open'); }}); break;
    case 'close-mob-side': var r3=$('#admin-root'); if(r3) r3.classList.remove('mob-open'); closeOverlay(); break;
    case 'cmdk': openCmdk(); break;
    case 'start-tour': startTour(); break;
    case 'open-notifs': openNotifs(); break;
    /* auth */
    case 'quick-login': doLogin(D.role); break;
    case 'show-pass': var ip=$('#lg-pass'); if(ip) ip.type=ip.type==='password'?'text':'password'; break;
    case 'recover': showToast('Te enviamos un enlace de recuperación válido por 15 minutos.','ok','Contraseña'); break;
    case 'logout': State.session=null; posCart.length=0; closeAllOverlays();
      showToast('Sesión cerrada y refresh token revocado.','info','Hasta pronto'); go('/'); break;
    /* storefront */
    case 'open-cart': openCart(); break;
    case 'close-overlay': closeOverlay(); break;
    case 'goto-product': case 'go-product': if(e) e.preventDefault(); go('/productos/'+D.slug); break;
    case 'add-cart': addToCart(D.id,1); break;
    case 'add-cart-pd': addToCart(D.id,+(window.__pdq||1)); window.__pdq=1; var qq=$('#pd-q'); if(qq) qq.textContent='1'; break;
    case 'buy-now': addToCart(D.id,+(window.__pdq||1),true); openCheckout(); break;
    case 'pd-qty': var s=$('#pd-q'); if(s){ var v=clamp((+s.textContent)+ +D.d,1,99); s.textContent=v; window.__pdq=v; } break;
    case 'pd-tab': $$('.tabs button').forEach(function(b){b.classList.remove('on');}); el.classList.add('on');
      $$('[data-tab]').forEach(function(p){ p.hidden=p.getAttribute('data-tab')!==D.t; }); break;
    case 'thumb': $$('.pd-thumbs div').forEach(function(x){x.classList.remove('on');}); el.classList.add('on');
      var mn=$('#pd-main'); if(mn){ mn.style.animation='none'; void mn.offsetWidth; mn.style.animation=''; } break;
    case 'fav': el.classList.toggle('on'); showToast(el.classList.contains('on')?'Guardado en favoritos.':'Quitado de favoritos.','info','Favoritos'); break;
    case 'cart-qty': var l=State.cart.filter(function(x){return x.id===D.id;})[0]; if(!l) break;
      var pp=byId(D.id), nv=l.qty+ +D.d;
      if(nv<=0){ State.cart=State.cart.filter(function(x){return x.id!==D.id;}); showToast('Producto eliminado del carrito.','info','Carrito'); }
      else if(nv>pp.stock){ showToast('Solo quedan '+pp.stock+' unidades.','warn','Stock'); }
      else l.qty=nv;

    case 'revoke': showToast('Se revocaron 3 sesiones activas. Tu token actual sigue válido.','warn','Seguridad'); break;
    case 'toggle-perm': var role=D.role, mid2=D.m;
      if(el.checked && DB.perms[role].indexOf(mid2)<0) DB.perms[role].push(mid2);
      if(!el.checked) DB.perms[role]=DB.perms[role].filter(function(x){return x!==mid2;});

        location.reload(); },true); break;

    e.preventDefault(); var t=$('#global-q')||$('#pos-q')||$('#inv-q'); if(t) t.focus(); }

function confirmPosOrder(){
  var t=posTotals(), cust=DB.customers.filter(function(c){return c.id===posClient;})[0]||DB.customers[0];
  var items=posCart.map(function(l){ var p=byId(l.id); return {id:p.id,sku:p.sku,name:p.name,price:p.price,qty:l.qty}; });
  SEQ.order++; var folio='F-'+SEQ.order;
  DB.orders.unshift({folio:folio,customerId:cust.id,customer:cust.name,items:items,sub:t.sub,iva:t.iva,total:t.total,status:'pagada',channel:'POS mostrador',date:new Date(),pay:posPay});
  items.forEach(function(i){ var p=byId(i.id); if(p) p.stock=Math.max(0,p.stock-i.qty); });
  Bus.emit('ventas.orden.creada',folio+' · '+money(t.total)+' · '+posPay,{module:'ventas'});
  Bus.emit('inventario.descontar',items.map(function(i){return i.sku;}).join(', '),{module:'inventario'});
  var wantInv=$('#req-inv');
  if(wantInv&&wantInv.checked&&cust.rfc){ SEQ.inv++;
    DB.invoices.unshift({folio:'A-'+SEQ.inv,orderId:folio,customer:cust.name,rfc:cust.rfc,date:new Date(),sub:t.sub,iva:t.iva,total:t.total,status:'timbrada',serie:'A',uso:'G03',pay:'01'});

  closeAllOverlays(); posCart.length=0; refreshBadges();

}

  var sub=posCart.reduce(function(s,l){return s+byId(l.id).price*l.qty;},0);
  var amt=type==='pct'?sub*v/100:v;
  if(!posCart.length||amt<=0||amt>sub){ showToast('El descuento debe ser mayor a 0 y menor al subtotal.','err','Descuento inválido'); return; }

  posCart.forEach(function(l){ l.disc=Math.round(byId(l.id).price*l.qty*per*100)/100; });
  closeOverlay(); refreshPos(); Bus.emit('ventas.descuento',money(amt),{module:'ventas'});

function saveProduct(d){
  var bad=[];
  if((d.name||'').length<3) bad.push('nombre');
  if(!/^[A-Z0-9-]{4,}$/i.test(d.sku||'')) bad.push('SKU (mínimo 4 caracteres)');
  if(!(+d.price>0)) bad.push('precio de venta');
  if(d.stock===''||isNaN(+d.stock)) bad.push('existencia');
  if(DB.products.some(function(p){return p.sku.toUpperCase()===(d.sku||'').toUpperCase()&&p.id!==d.id;})) bad.push('SKU duplicado');
  if(bad.length){ showToast('Revisa: '+bad.join(', ')+'.','err','No se pudo guardar'); return; }
  var slug=(d.name||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  var base={name:d.name,sku:d.sku.toUpperCase(),cat:d.cat,price:+d.price,cost:+d.cost||Math.round(+d.price*.62),stock:+d.stock,min:+d.min||5,
    art:d.art,badge:d.badge||'',desc:d.desc||'Producto de calidad profesional con garantía de fábrica.',rating:4.5,reviews:0,slug:slug,specs:[['SKU',d.sku.toUpperCase()]]};
  if(d.id){ var ex=byId(d.id); Object.assign(ex,base); Bus.emit('inventario.actualizar',base.sku,{module:'inventario'});
    showToast(base.name+' actualizado. La tienda ya muestra el nuevo dato.','ok','Guardado'); }
  else { var np=Object.assign({id:'p'+Date.now()},base); DB.products.unshift(np);
    Bus.emit('inventario.crear',np.sku,{module:'inventario'}); showToast(np.name+' publicado en la tienda.','ok','Producto creado'); }
  closeOverlay(); render();
}

function exportCSV(what){
  var name='reporte', rows=[];

    DB.orders.forEach(function(o){ rows.push([o.folio,o.customer,new Date(o.date).toISOString(),o.channel,o.pay||'',o.sub.toFixed(2),o.iva.toFixed(2),o.total.toFixed(2),o.status]); }); }
  else if(what==='inventario'){ name='inventario'; rows=[['SKU','Nombre','Categoría','Precio','Costo','Margen %','Stock','Mínimo','Estado']];
    DB.products.forEach(function(p){ rows.push([p.sku,p.name,catName(p.cat),p.price,p.cost,(((p.price-p.cost)/p.price)*100).toFixed(1),p.stock,p.min,p.stock===0?'Agotado':(p.stock<=p.min?'Bajo':'Óptimo')]); }); }
  else if(what==='clientes'){ name='clientes'; rows=[['Nombre','Email','Teléfono','RFC','Ciudad','Segmento','Desde']];
    DB.customers.forEach(function(c){ rows.push([c.name,c.email,c.phone,c.rfc||'',c.city,c.seg,c.since]); }); }
  else if(what==='facturas'){ name='facturas'; rows=[['Folio','Orden','Cliente','RFC','Fecha','Subtotal','IVA','Total','Estado']];
    DB.invoices.forEach(function(i){ rows.push([i.folio,i.orderId,i.customer,i.rfc,new Date(i.date).toISOString().slice(0,10),i.sub.toFixed(2),i.iva.toFixed(2),i.total.toFixed(2),i.status]); }); }
  else if(what==='seguridad'){ name='bitacora-seguridad'; rows=[['Momento','Evento','Usuario','IP','Nivel']];
    DB.secEvents.forEach(function(e){ rows.push([e.t,e.ev,e.who,e.ip,e.lvl]); }); }
  else if(what==='roadmap'){ name='roadmap'; rows=[['Fase','Título','Tarea','Estado']];
    DB.roadmap.forEach(function(p){ p.tasks.forEach(function(t){ rows.push([p.phase,p.title,t[0],t[1]?'Completada':'Pendiente']); }); }); }

      rows.push([t.p.sku,t.p.name,u,t.v.toFixed(2)]); }); }
  else { name='respaldo-ferremax'; rows=[['Tabla','Registros'],['productos',DB.products.length],['ordenes',DB.orders.length],['clientes',DB.customers.length],['facturas',DB.invoices.length]]; }
  downloadCSV(name+'-'+new Date().toISOString().slice(0,10)+'.csv',rows);

  showToast(name+'.csv descargado con '+(rows.length-1)+' registros.','ok','Exportación lista');
}
function downloadCSV(filename,rows){
  var csv=rows.map(function(r){ return r.map(function(c){ return '"'+String(c==null?'':c).replace(/"/g,'""')+'"'; }).join(','); }).join('\r\n');
  var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },1500);
}

    '<span style="margin-left:auto">Búsqueda global · Ctrl K</span></div></div></div>');
  var input=$('#cmdk-in'), list=$('#cmdk-list');

    var groups={}, order=[];
    filtered.forEach(function(c){ if(!groups[c.g]){ groups[c.g]=[]; order.push(c.g); } groups[c.g].push(c); });
    filtered=[]; var html='', idx=0;
    order.forEach(function(g){ html+='<div class="xs muted" style="padding:9px 13px 4px;text-transform:uppercase;letter-spacing:.06em;font-weight:700">'+g+'</div>';

    $$('.cmdk-item',list).forEach(function(el){
      el.onclick=function(){ var f=filtered[+el.getAttribute('data-i')]; closeOverlay(entry); if(f) f.run(); };
      el.onmouseenter=function(){ sel=+el.getAttribute('data-i'); $$('.cmdk-item',list).forEach(function(x){x.classList.remove('sel');}); el.classList.add('sel'); };
    });
  }
  input.addEventListener('input',function(){ var q=input.value.toLowerCase(); sel=0;
    filtered=cmds.filter(function(c){ return c.t.toLowerCase().indexOf(q)>=0||c.g.toLowerCase().indexOf(q)>=0; }); paint(); });
  input.addEventListener('keydown',function(ev){
    if(ev.key==='ArrowDown'){ ev.preventDefault(); sel=Math.min(filtered.length-1,sel+1); paint(); scrollSel(); }
    if(ev.key==='ArrowUp'){ ev.preventDefault(); sel=Math.max(0,sel-1); paint(); scrollSel(); }
    if(ev.key==='Enter'){ ev.preventDefault(); var f=filtered[sel]; closeOverlay(entry); if(f) f.run(); }
  });
  function scrollSel(){ var el=$('.cmdk-item.sel',list); if(el) el.scrollIntoView({block:'nearest'}); }
  paint(); setTimeout(function(){ input.focus(); },60);
}

 {s:'[data-m="devops"]',t:'El cuarto de máquinas',d:'Aquí ves la arquitectura real: API Gateway, módulos en Docker, bus de eventos Redis y el pipeline CI/CD blue-green.'},
 {s:'[data-m="seguridad"]',t:'Seguridad por diseño',d:'JWT de 15 min con refresh rotativo, RBAC validado en el gateway, datos cifrados y bitácora inmutable.'},
 {s:'.top',t:'Búsqueda global',d:'Ctrl K en cualquier momento: navega a módulos, productos o clientes sin soltar el teclado.'}
];
var tourStep=0;
function startTour(){ tourStep=0; if(!$('#admin-root')){ go('/admin/dashboard'); setTimeout(drawTour,600); return; } drawTour(); }
function drawTour(){
  endTour(true);
  var step=TOUR[tourStep]; if(!step) return;
  var target=$(step.s); if(!target){ tourStep++; return drawTour(); }
  target.scrollIntoView({block:'center',behavior:'smooth'});
  var r=target.getBoundingClientRect();
  var spot=document.createElement('div'); spot.className='spot';
  spot.style.cssText='left:'+(r.left-7)+'px;top:'+(r.top-7)+'px;width:'+(r.width+14)+'px;height:'+(r.height+14)+'px';
  var card=document.createElement('div'); card.className='tour-card';
  card.innerHTML='<span class="badge b-acc" style="margin-bottom:10px">Paso '+(tourStep+1)+' de '+TOUR.length+'</span><h4>'+step.t+'</h4><p>'+step.d+'</p>'+
    '<div class="row" style="margin-top:16px;gap:8px"><button class="btn btn-sm btn-ghost" type="button" data-t="skip">Omitir tour</button><div style="flex:1"></div>'+
    (tourStep>0?'<button class="btn btn-sm btn-ghost" type="button" data-t="prev">Atrás</button>':'')+
    '<button class="btn btn-sm btn-primary" type="button" data-t="next">'+(tourStep===TOUR.length-1?'Terminar':'Siguiente')+'</button></div>';
  document.body.appendChild(spot); document.body.appendChild(card);
  var below=r.bottom+240<innerHeight;
  card.style.left=clamp(r.left,16,Math.max(16,innerWidth-360))+'px';
  card.style.top=(below?r.bottom+16:Math.max(16,r.top-card.offsetHeight-16))+'px';
  card.onclick=function(ev){ var b=ev.target.closest('[data-t]'); if(!b) return;
    if(b.getAttribute('data-t')==='skip'){ endTour(); showToast('Tour omitido. Puedes retomarlo con el botón ? del encabezado.','info','Guía'); }
    if(b.getAttribute('data-t')==='prev'){ tourStep--; drawTour(); }
    if(b.getAttribute('data-t')==='next'){ tourStep++; if(tourStep>=TOUR.length){ endTour(); showToast('Tour terminado. Explora los módulos cuando quieras.','ok','Guía'); } else drawTour(); } };
}
function endTour(silent){ $$('.spot,.tour-card').forEach(function(n){ n.remove(); }); if(!silent) tourStep=0; }
